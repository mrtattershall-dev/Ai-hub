<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>q9 shop</title>
</head>
<body>
  <h1>Shop</h1>
  <div id="q9-products">
    <div>Apple <button class="q9-add" data-name="Apple" data-price="50">Add</button></div>
    <div>Bread <button class="q9-add" data-name="Bread" data-price="225">Add</button></div>
    <div>Milk <button class="q9-add" data-name="Milk" data-price="199">Add</button></div>
  </div>
  <ul id="q9-cart"></ul>
  <p id="q9-empty">Cart is empty</p>
  <p>Total: <span id="q9-total">$0.00</span> - <span id="q9-count">0 items</span></p>
  <p id="q9-delivery"></p>
  <input id="q9-code" placeholder="Discount code"> <button id="q9-apply">Apply</button> <span id="q9-msg"></span>
  <button id="q9-clear">Clear cart</button>
  <script src="q9_shop.js"></script>
</body>
</html>
