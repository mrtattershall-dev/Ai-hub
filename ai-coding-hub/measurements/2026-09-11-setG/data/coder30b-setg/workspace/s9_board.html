<!DOCTYPE html>
<html>
<head>
    <title>Todo Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Todo Board</h1>
    
    <div id="s9-todo">
        <h2>To Do <span id="s9-count-todo">0</span></h2>
        <ul></ul>
    </div>
    
    <div id="s9-doing">
        <h2>Doing <span id="s9-count-doing">0</span></h2>
        <ul></ul>
    </div>
    
    <div id="s9-done">
        <h2>Done <span id="s9-count-done">0</span></h2>
        <ul></ul>
    </div>
    
    <div>
        <input type="text" id="s9-new" placeholder="Add new item">
        <button id="s9-add">Add</button>
    </div>
    
    <script src="s9_board.js"></script>
</body>
</html>
