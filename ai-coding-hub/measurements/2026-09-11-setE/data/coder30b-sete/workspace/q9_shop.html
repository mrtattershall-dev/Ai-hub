<!DOCTYPE html>
<html>
<head>
    <title>Q9 Shop</title>
</head>
<body>
    <h1>Shop</h1>
    
    <div>
        <h2>Products</h2>
        <div>
            <span>Apple - 50 cents</span>
            <button class="q9-add" data-name="Apple" data-price="50">Add to Cart</button>
        </div>
        <div>
            <span>Bread - 225 cents</span>
            <button class="q9-add" data-name="Bread" data-price="225">Add to Cart</button>
        </div>
        <div>
            <span>Milk - 199 cents</span>
            <button class="q9-add" data-name="Milk" data-price="199">Add to Cart</button>
        </div>
    </div>
    
    <div>
        <h2>Cart</h2>
        <p id="q9-count">0 items</p>
        <ul id="q9-cart"></ul>
    </div>
    
    <div>
        <h2>Discount Code</h2>
        <input type="text" id="q9-code" placeholder="Enter code">
        <button id="q9-apply">Apply</button>
        <p id="q9-msg"></p>
    </div>
    
    <script src="q9_shop.js"></script>
</body>
</html>
