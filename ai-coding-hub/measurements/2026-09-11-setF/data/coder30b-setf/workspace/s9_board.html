<!doctype html>
<html>
<head>
    <title>Todo Board</title>
    <link rel="stylesheet" href="s9_board.css">
</head>
<body>
    <div id="s9-count-todo">To Do: 0</div>
    <div id="s9-count-doing">Doing: 0</div>
    <div id="s9-count-done">Done: 0</div>
    
    <div id="s9-todo">
        <h2>To Do</h2>
        <ul></ul>
    </div>
    
    <div id="s9-doing">
        <h2>Doing</h2>
        <ul></ul>
    </div>
    
    <div id="s9-done">
        <h2>Done</h2>
        <ul></ul>
    </div>
    
    <div id="s9-msg"></div>
    
    <div>
        <input type="text" id="s9-new" placeholder="Add new item">
        <button id="s9-add">Add</button>
    </div>

    <script src="s9_board.js"></script>
</body>
</html>
