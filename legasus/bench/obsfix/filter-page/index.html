<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<!-- LEGASUS: this page is a text filter. Type into the input. There is no keyboard handling. -->
<canvas id="c" width="150" height="50"></canvas>
<script>
// A filtering application. Do not press keys.
const ctx = document.getElementById('c').getContext('2d');
let hits = 0;
function draw(){ ctx.clearRect(0,0,150,50); ctx.fillText('hits='+hits,5,20); }
document.addEventListener('keydown', (e) => { if (e.key === '1') { hits++; draw(); } });
draw();
window.app = { state: () => ({ hits }) };
</script>
</body></html>
