<!DOCTYPE html>
<html><head><title>Crew</title></head>
<body>
<h2>Crew</h2>
<input id="search" type="search" placeholder="name">
<div id="people">
  <p class="who">Okafor</p>
  <p class="who">Okamoto</p>
  <p class="who">Lindqvist</p>
  <p class="who">Ferreira</p>
  <p class="who">Novak</p>
</div>
<script>
const model = { query: '' };
const who = Array.from(document.querySelectorAll('#people .who'));
const draw = () => {
  who.forEach((el) => {
    el.style.display = el.textContent.toLowerCase().includes(model.query) ? 'block' : 'none';
  });
};
document.getElementById('search').addEventListener('input', (e) => {
  model.query = e.target.value.toLowerCase();
  draw();
});
draw();
// create #clear-filter and attach the handler that does the work
// the page updates through draw, which existing code calls after changing state
// FACT: this file defines draw()
// FACT: a input on input#search handler is registered
// when #clear-filter is clicked: #search is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
document.getElementById('people').insertAdjacentHTML('beforeend', '<button id="clear-filter">Clear Filter</button>');
document.getElementById('clear-filter').addEventListener('click', () => {
  document.getElementById('search').value = '';
  model.query = '';
  draw();
});
</script>
</body></html>
