<!DOCTYPE html>
<html>
<head><title>Parts</title></head>
<body>
<h1>Parts</h1>
<input type="text" id="search" placeholder="search parts">
<ul id="parts">
  <li class="part">bracket</li>
  <li class="part">brace</li>
  <li class="part">washer</li>
  <li class="part">spindle</li>
  <li class="part">grommet</li>
</ul>
<script>
const field = document.getElementById('search');
const rows = Array.from(document.querySelectorAll('#parts .part'));
function refresh() {
  const q = field.value.toLowerCase();
  rows.forEach(function (li) {
    li.style.display = li.textContent.toLowerCase().indexOf(q) === -1 ? 'none' : '';
  });
}
field.addEventListener('input', refresh);
// create #clear-filter and attach the handler that does the work
// the page updates through refresh, which existing code calls after changing state
// FACT: this file defines refresh()
// FACT: a input on input#search handler is registered
// CHECK 1 FAILED: loads with no page or console error, showing every item
// CHECK 3 FAILED: clicking #clear-filter brings every item back
// CHECK 4 FAILED: and leaves #search empty
// CHECK 6 FAILED: clicking #clear-filter a second time brings every item back again
// CHECK 7 FAILED: no page or console error was raised at any point
// [JS ERROR] Cannot read properties of null (reading 'addEventListener')
// when #clear-filter is clicked: #search is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
document.getElementById('clear-filter').addEventListener('click', function () {
  field.value = '';
  refresh();
});
</script>
</body>
</html>
