<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Votes</title>
    <style>
        canvas {
            border: 1px solid black;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="voteCanvas" width="400" height="200"></canvas>
    <script>
        const canvas = document.getElementById('voteCanvas');
        const ctx = canvas.getContext('2d');

        let voteCount = { key1: 0, key2: 0 };

        function drawVotes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '20px Arial';
            ctx.fillText('Key 1: ' + voteCount.key1, 10, 20);
            ctx.fillText('Key 2: ' + voteCount.key2, 10, 40);
        }

        function handleKeyDown(event) {
            if (event.key === 'Key1') {
                voteCount.key1++;
                drawVotes();
            } else if (event.key === 'Key2') {
                voteCount.key2++;
                drawVotes();
            }
        }

        window.app = { state: () => ({ ...voteCount }) };

        document.addEventListener('keydown', handleKeyDown);
    </script>
</body>
</html>
