<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
</head>
<body>
    <canvas id="scoreboard" width="200" height="100"></canvas>
    <script>
        const canvas = document.getElementById('scoreboard');
        const ctx = canvas.getContext('2d');

        let playerA = 0;
        let playerB = 0;

        function drawScoreboard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '20px Arial';
            ctx.fillText(`Player A: ${playerA}`, 10, 20);
            ctx.fillText(`Player B: ${playerB}`, canvas.width - 110, 20);
        }

        function updateScoreboard() {
            drawScoreboard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'a') {
                playerA++;
                updateScoreboard();
            } else if (e.key === 'b') {
                playerB++;
                updateScoreboard();
            }
        });

        window.app = { state: () => ({ playerA, playerB }) };
    </script>
</body>
</html>
