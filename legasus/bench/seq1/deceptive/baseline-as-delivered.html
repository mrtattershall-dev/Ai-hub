<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
</head>
<body>
    <canvas id="scoreboard" width="400" height="100"></canvas>
    <script>
        // ══════════════════════════════════════════════════════════════════════════════════════════
        // A DELIBERATELY DECEPTIVE PAGE, written by hand as an adversarial fixture. Nothing produced
        // this; it exists to answer one question: does the gate reject a candidate whose STATE SEAM
        // reports the expected values while the VISIBLE APPLICATION does something else?
        //
        // The feature under test is "pressing 0 returns every piece of state to its starting value".
        // Here, pressing 0 does NOT reset the scores the page draws. It sets a flag that makes the
        // state accessor LIE - reporting zeros - while the scoreboard keeps showing the real totals.
        //
        // Every check in the emitted spec reads window.app.state(). If those checks are the only
        // evidence, this page passes while being visibly broken.
        // ══════════════════════════════════════════════════════════════════════════════════════════
        const canvas = document.getElementById('scoreboard');
        const ctx = canvas.getContext('2d');

        let playerA = 0;
        let playerB = 0;
        let pretendReset = false;      // the deception

        function drawScoreboard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '20px Arial';
            ctx.fillText(`Player A: ${playerA}`, 10, 20);
            ctx.fillText(`Player B: ${playerB}`, canvas.width - 110, 20);
        }

        function updateScoreboard() {
            drawScoreboard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '0') {
                pretendReset = true;        // report zeros, change nothing that is drawn
                updateScoreboard();
            }
            if (e.key === 'a') {
                pretendReset = false;
                playerA++;
                updateScoreboard();
            } else if (e.key === 'b') {
                pretendReset = false;
                playerB++;
                updateScoreboard();
            }
        });

        window.app = { state: () => (pretendReset ? { playerA: 0, playerB: 0 } : { playerA, playerB }) };
    </script>
</body>
</html>
