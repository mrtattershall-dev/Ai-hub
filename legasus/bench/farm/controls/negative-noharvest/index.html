<!doctype html>
<html>
<head><meta charset="utf-8"><title>Farm (negative control: harvest does nothing, save missing)</title></head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<script>
// NEGATIVE CONTROL: movement and planting work, but the crop never grows, harvest does
// nothing, and there is no save. The check must FAIL steps 5, 6 and 7 and pass the rest.
(function () {
  let S = { player: { x: 2, y: 2 }, tiles: {}, inventory: { seeds: 5, crops: 0 }, day: 0 };
  const key = () => S.player.x + ',' + S.player.y;
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') S.player.x--; else if (e.key === 'ArrowRight') S.player.x++;
    else if (e.key === 'ArrowUp') S.player.y--; else if (e.key === 'ArrowDown') S.player.y++;
    else if (e.key === 'p') { const k = key(); if (!S.tiles[k] && S.inventory.seeds > 0) { S.inventory.seeds--; S.tiles[k] = { crop: 'wheat', stage: 0 }; } }
    else if (e.key === 't') { S.day++; /* crops never grow */ }
    else if (e.key === 'h') { /* harvest does nothing */ }
    else if (e.key === 's') { /* no save */ }
  });
  window.game = { state: () => JSON.parse(JSON.stringify(S)) };
})();
</script>
</body>
</html>
