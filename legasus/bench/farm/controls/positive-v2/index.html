<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Farm (positive control v2: day/night + selling)</title>
<style>body{margin:0;background:#233;color:#eee;font-family:sans-serif}canvas{display:block;margin:8px auto}#hud{text-align:center}</style>
</head>
<body>
<div id="hud"></div>
<canvas id="c" width="480" height="320"></canvas>
<script>
// POSITIVE CONTROL v2: everything in v1 plus a day/night phase (alternating every 4 ticks)
// and selling crops for coins with x. Must pass all 11 steps of play-v2 and all 8 of play.
(function () {
  const W = 12, H = 8, T = 40, GROW_TICKS = 3, PHASE_TICKS = 4;
  let S = { player: { x: 2, y: 2 }, tiles: {}, inventory: { seeds: 5, crops: 0 }, day: 0, phase: 'day', coins: 0 };
  const key = () => S.player.x + ',' + S.player.y;
  function load() { try { const s = localStorage.getItem('farm-save'); if (s) { const o = JSON.parse(s); S = Object.assign(S, o); if (!S.phase) S.phase = 'day'; if (typeof S.coins !== 'number') S.coins = 0; } } catch (e) {} }
  function save() { localStorage.setItem('farm-save', JSON.stringify(S)); }
  function tick() { S.day++; if (S.day % PHASE_TICKS === 0) S.phase = S.phase === 'day' ? 'night' : 'day'; for (const k in S.tiles) { const t = S.tiles[k]; if (t.stage < GROW_TICKS) t.stage++; } }
  function plant() { const k = key(); if (S.tiles[k] || S.inventory.seeds <= 0) return; S.inventory.seeds--; S.tiles[k] = { crop: 'wheat', stage: 0 }; }
  function harvest() { const k = key(); const t = S.tiles[k]; if (!t || t.stage < GROW_TICKS) return; delete S.tiles[k]; S.inventory.crops++; }
  function sell() { S.coins += S.inventory.crops * 3; S.inventory.crops = 0; }
  function move(dx, dy) { S.player.x = Math.max(0, Math.min(W - 1, S.player.x + dx)); S.player.y = Math.max(0, Math.min(H - 1, S.player.y + dy)); }
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  function draw() {
    cx.fillStyle = S.phase === 'night' ? '#123' : '#3a5'; cx.fillRect(0, 0, cv.width, cv.height);
    for (const k in S.tiles) { const [x, y] = k.split(',').map(Number); const t = S.tiles[k]; cx.fillStyle = t.stage >= GROW_TICKS ? '#fc3' : '#7a4'; cx.fillRect(x * T + 4, y * T + 4, T - 8, T - 8); }
    cx.fillStyle = '#36f'; cx.fillRect(S.player.x * T + 8, S.player.y * T + 8, T - 16, T - 16);
    document.getElementById('hud').textContent = 'Day ' + S.day + ' (' + S.phase + ') | seeds ' + S.inventory.seeds + ' | crops ' + S.inventory.crops + ' | coins ' + S.coins + ' | arrows move, p plant, t time, h harvest, x sell, s save';
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') move(-1, 0); else if (e.key === 'ArrowRight') move(1, 0);
    else if (e.key === 'ArrowUp') move(0, -1); else if (e.key === 'ArrowDown') move(0, 1);
    else if (e.key === 'p') plant(); else if (e.key === 't') tick(); else if (e.key === 'h') harvest(); else if (e.key === 'x') sell(); else if (e.key === 's') save();
    draw();
  });
  window.game = { state: () => JSON.parse(JSON.stringify(S)) };
  load(); draw();
})();
</script>
</body>
</html>
