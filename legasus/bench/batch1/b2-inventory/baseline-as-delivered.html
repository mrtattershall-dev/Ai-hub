<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
</head>
<body>
    <h1>Inventory</h1>
    <ul id="inventory">
        <li>Item 1, Quantity: 10</li>
        <li>Item 2, Quantity: 20</li>
        <li>Item 3, Quantity: 30</li>
        <li>Item 4, Quantity: 40</li>
        <li>Item 5, Quantity: 50</li>
    </ul>
    <input type="text" id="filter" placeholder="Filter by name">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterInput = document.getElementById('filter');
            const inventoryList = document.getElementById('inventory');

            filterInput.addEventListener('input', () => {
                const filterText = filterInput.value.toLowerCase();
                const items = inventoryList.getElementsByTagName('li');

                for (let i = 0; i < items.length; i++) {
                    const itemName = items[i].textContent.toLowerCase();
                    if (itemName.includes(filterText)) {
                        items[i].style.display = '';
                    } else {
                        items[i].style.display = 'none';
                    }
                }
            });

            window.app = { state: () => ({ ... }) };
        });
    </script>
</body>
</html>
