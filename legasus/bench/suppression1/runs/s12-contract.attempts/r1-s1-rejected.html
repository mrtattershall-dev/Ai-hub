<!DOCTYPE html>
<html>
<head><title>s12</title></head>
<body>
<h2>s12</h2>
<input type="text" id="seek">
<ol id="results">
  <li class="item">tundra</li>
  <li class="item">tulip</li>
  <li class="item">meadow</li>
  <li class="item">canyon</li>
  <li class="item">delta</li>
</ol>
<script>
const model = { query: '' };
const field = document.getElementById('seek');
const rows = Array.from(document.querySelectorAll('#results .item'));
function recompute() {
  model.query = field.value.toLowerCase();
  const q = model.query;
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.hidden = !hit;
  });
}
field.addEventListener('input', recompute);
        // JAVASCRIPT STATEMENTS ONLY. This point is inside the page's existing <script> block.
        // when #clear-filter is clicked: #seek is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
        // This succeeds when that holds and everything the page already did still works.
        // Continue here:

        // JAVASCRIPT STATEMENTS ONLY. This point is inside the page's existing <script> block.
        // when #clear-filter is clicked: #seek is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
        // This succeeds when that holds and everything the page already did still works.
        // Continue here:
        document.getElementById('clear-filter').addEventListener('click', function () {
          field.value = '';
          recompute();
        });

</script>
</body>
</html>
