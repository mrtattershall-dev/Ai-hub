<!DOCTYPE html>
<html>
<head><title>s01</title></head>
<body>
<h2>s01</h2>
<input type="text" id="q">
<ul id="rows">
  <li class="item">almond</li>
  <li class="item">apricot</li>
  <li class="item">brazil</li>
  <li class="item">cashew</li>
  <li class="item">pecan</li>
</ul>
<script>
const field = document.getElementById('q');
const rows = Array.from(document.querySelectorAll('#rows .item'));
function filterRows() {
  const q = field.value.toLowerCase();
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.style.display = hit ? '' : 'none';
  });
}
field.addEventListener('input', filterRows);
// create #clear-filter and attach the handler that does the work
// the page updates through filterRows, which existing code calls after changing state
// FACT: this file defines filterRows()
// FACT: a input on input#q handler is registered
// when #clear-filter is clicked: #q is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
document.createElement('div').id = 'clear-filter'; document.body.appendChild(document.getElementById('clear-filter')); document.getElementById('clear-filter').addEventListener('click', function () { field.value = ''; filterRows(); });
</script>
</body>
</html>
