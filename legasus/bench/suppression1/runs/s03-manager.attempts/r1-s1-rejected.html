<!DOCTYPE html>
<html>
<head><title>s03</title></head>
<body>
<h2>s03</h2>
<input type="text" id="lookup">
<section id="entries">
  <p class="item">quartz</p>
  <p class="item">quarry</p>
  <p class="item">basalt</p>
  <p class="item">gneiss</p>
  <p class="item">shale</p>
</section>
<script>
const model = { query: '' };
const field = document.getElementById('lookup');
const rows = Array.from(document.querySelectorAll('#entries .item'));
function update() {
  model.query = field.value.toLowerCase();
  const q = model.query;
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.hidden = !hit;
  });
}
field.addEventListener('keyup', update);
// create #clear-filter and attach the handler that does the work
// the page updates through update, which existing code calls after changing state
// FACT: this file defines update()
// FACT: a keyup on input#lookup handler is registered
// when #clear-filter is clicked: #lookup is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
const clearFilterButton = document.createElement('button');
clearFilterButton.textContent = 'Clear Filter';
document.body.appendChild(clearFilterButton);
clearFilterButton.addEventListener('click', function () {
  field.value = '';
  update();
});
// end of your code </script>
</script>
</body>
</html>
