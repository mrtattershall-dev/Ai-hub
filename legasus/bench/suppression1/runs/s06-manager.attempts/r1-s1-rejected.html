<!DOCTYPE html>
<html>
<head><title>s06</title></head>
<body>
<h2>s06</h2>
<input type="text" id="find">
<ul id="log">
  <li class="item">delta</li>
  <li class="item">denim</li>
  <li class="item">fennel</li>
  <li class="item">garnet</li>
  <li class="item">hazel</li>
</ul>
<script>
const model = { query: '' };
const field = document.getElementById('find');
const rows = Array.from(document.querySelectorAll('#log .item'));
function show() {
  model.query = field.value.toLowerCase();
  const q = model.query;
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.hidden = !hit;
  });
}
field.addEventListener('input', show);
// create #clear-filter and attach the handler that does the work
// the page updates through show, which existing code calls after changing state
// FACT: this file defines show()
// FACT: a input on input#find handler is registered
// when #clear-filter is clicked: #find is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
const clearFilterButton = document.createElement('button');
clearFilterButton.textContent = 'Clear Filter';
document.body.appendChild(clearFilterButton);
clearFilterButton.addEventListener('click', function () {
  field.value = '';
  show();
});
// Ensure typing in the filter still narrows the list. This point is inside the page's existing <script> block. No HTML, no <script> tags, no markdown fence, no explanation, no full-page replacement. Continue here:
// Ensure typing in the filter still narrows the list. This point is inside the page's existing <script> block. No HTML, no <script> tags, no markdown fence, no explanation, no full-page replacement. Continue here:
</script>
</body>
</html>
