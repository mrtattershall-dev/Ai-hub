<!DOCTYPE html>
<html>
<head><title>s11</title><style>.gone{display:none}</style></head>
<body>
<h2>s11</h2>
<input type="text" id="input-term">
<article id="listing">
  <p class="item">cobalt</p>
  <p class="item">copper</p>
  <p class="item">nickel</p>
  <p class="item">osmium</p>
  <p class="item">pewter</p>
</article>
<script>
const field = document.getElementById('input-term');
const rows = Array.from(document.querySelectorAll('#listing .item'));
function display() {
  const q = field.value.toLowerCase();
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.className = hit ? 'item' : 'item gone';
  });
}
field.addEventListener('keyup', display);
        // JAVASCRIPT STATEMENTS ONLY. This point is inside the page's existing <script> block.
        // when #clear-filter is clicked: #input-term is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
        // This succeeds when that holds and everything the page already did still works.
        // Continue here:
        document.getElementById('clear-filter').addEventListener('click', function () {
          field.value = '';
          rows.forEach(function (el) {
            el.className = 'item';
          });
        });
</script>
</body>
</html>
