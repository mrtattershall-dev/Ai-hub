<!DOCTYPE html>
<html>
<head><title>s08</title><style>.gone{display:none}</style></head>
<body>
<h2>s08</h2>
<input type="text" id="text">
<ul id="parts">
  <li class="item">washer</li>
  <li class="item">wrench</li>
  <li class="item">anvil</li>
  <li class="item">bolt</li>
  <li class="item">clamp</li>
</ul>
<script>
const model = { query: '' };
const field = document.getElementById('text');
const rows = Array.from(document.querySelectorAll('#parts .item'));
function narrowList() {
  model.query = field.value.toLowerCase();
  const q = model.query;
  rows.forEach(function (el) {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.className = hit ? 'item' : 'item gone';
  });
}
field.addEventListener('input', narrowList);
// create #clear-filter and attach the handler that does the work
// the page updates through narrowList, which existing code calls after changing state
// FACT: this file defines narrowList()
// FACT: a input on input#text handler is registered
// when #clear-filter is clicked: #text is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
const clearFilterButton = document.createElement('button');
clearFilterButton.textContent = 'Clear Filter';
document.body.appendChild(clearFilterButton);
clearFilterButton.addEventListener('click', function () {
  field.value = '';
  narrowList();
});
// FACT: a button with text 'Clear Filter' is created
// FACT: a click event handler is attached to the button
// when the button is clicked: #text is empty; every item in the list is visible again. Ensure typing in the filter still narrows the list.
</script>
</body>
</html>
