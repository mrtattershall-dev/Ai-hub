<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Scoreboard</title></head>
<body style="margin:0">
<canvas id="scoreboard" width="400" height="100"></canvas>
<script>
// MISLEADING ACCESSOR: the drawing is honest; the accessor reports zeros after 0.
const canvas = document.getElementById('scoreboard');
const ctx = canvas.getContext('2d');
let playerA = 0;
let playerB = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#000000';
  ctx.fillText('Player A: ' + playerA, 10, 20);
  ctx.fillText('Player B: ' + playerB, 290, 20);
}

let pretendReset = false;
document.addEventListener('keydown', (e) => {
  if (e.key === 'a') { pretendReset = false; playerA++; draw(); }
  else if (e.key === 'b') { pretendReset = false; playerB++; draw(); }
  else if (e.key === 'z') { pretendReset = false; playerA = Math.max(0, playerA - 1); draw(); }
  else if (e.key === '0') { pretendReset = true; draw(); }
});
draw();
window.app = { state: () => (pretendReset ? { playerA: 0, playerB: 0 } : { playerA, playerB }) };
</script></body></html>
