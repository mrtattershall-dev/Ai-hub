<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Scoreboard</title></head>
<body style="margin:0">
<canvas id="scoreboard" width="400" height="100"></canvas>
<script>
// SWAPPED LABELS: each label shows the other player total.
const canvas = document.getElementById('scoreboard');
const ctx = canvas.getContext('2d');
let playerA = 0;
let playerB = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#000000';
  ctx.fillText('Player A: ' + playerB, 10, 20);
  ctx.fillText('Player B: ' + playerA, 290, 20);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'a') { playerA++; draw(); }
  else if (e.key === 'b') { playerB++; draw(); }
  else if (e.key === 'z') { playerA = Math.max(0, playerA - 1); draw(); }
  else if (e.key === '0') { playerA = 0; playerB = 0; draw(); }
});
draw();
window.app = { state: () => ({ playerA, playerB }) };
</script></body></html>
