<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TattershallStudios</title>

  <!-- Open Graph / Social Preview -->
  <meta property="og:title" content="TattershallStudios" />
  <meta property="og:description" content="Independent game developer. Check out Dust & Harvest and ByteMiner!" />
  <meta property="og:image" content="https://tattershallstudios.w3spaces.com/preview.png" />
  <meta property="og:url" content="https://tattershallstudios.w3spaces.com" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Syne:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0f; color: #e8e4d8; font-family: 'Syne', sans-serif; min-height: 100vh; }
    .page { max-width: 700px; margin: 0 auto; padding: 48px 24px 80px; position: relative; z-index: 1; }
    .logo { font-family: 'Press Start 2P', monospace; font-size: 13px; color: #b8f04a; letter-spacing: 0.05em; line-height: 1.8; margin-bottom: 8px; }
    .tagline { font-size: 13px; color: #6b6a62; letter-spacing: 0.15em; text-transform: uppercase; min-height: 20px; }
    .divider { width: 48px; height: 2px; background: #b8f04a; margin: 20px 0; }
    .stats-bar { display: flex; gap: 24px; margin: 28px 0 40px; }
    .stat-val { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #b8f04a; margin-bottom: 4px; }
    .stat-label { font-size: 11px; color: #3a3a3e; text-transform: uppercase; letter-spacing: 0.1em; }
    .section-label { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #b8f04a; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 28px; opacity: 0.7; }
    .games { display: flex; flex-direction: column; gap: 20px; }
    .game-card { background: #141416; border: 0.5px solid #2a2a2e; border-radius: 8px; overflow: hidden; }
    .game-card iframe { display: block; width: 100%; border: none; }
    .footer { margin-top: 64px; padding-top: 24px; border-top: 0.5px solid #1e1e22; font-size: 11px; color: #3a3a3e; font-family: 'Press Start 2P', monospace; letter-spacing: 0.1em; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { display: inline-block; animation: blink 1.1s step-end infinite; }
    #toast { position: fixed; bottom: 24px; right: 24px; background: #b8f04a; color: #0d0d0f; font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 16px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <canvas id="stars" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

  <div class="page">
    <header style="margin-bottom: 20px;">
      <div class="logo">TATTERSHALL<br>STUDIOS</div>
      <div class="divider"></div>
      <div class="tagline" id="tagline"></div>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-val" id="visit-count">...</div>
        <div class="stat-label">Visitors</div>
      </div>
      <div class="stat">
        <div class="stat-val">2</div>
        <div class="stat-label">Games</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="time-display">--:--</div>
        <div class="stat-label">Local Time</div>
      </div>
    </div>

    <div class="section-label">// Games</div>

    <div class="games">
      <div class="game-card">
        <iframe frameborder="0" src="https://itch.io/embed/4593737?linkback=true&fg_color=267d10&link_color=985031&border_color=141416" width="552" height="167">
          <a href="https://tattershallstudios.itch.io/dust-harvest">Dust &amp; Harvest by TattershallStudios</a>
        </iframe>
      </div>
      <div class="game-card">
        <iframe frameborder="0" src="https://itch.io/embed/4596367?fg_color=26d3de&link_color=0033cd&border_color=141416" width="552" height="167">
          <a href="https://tattershallstudios.itch.io/byteminer">ByteMiner by TattershallStudios</a>
        </iframe>
      </div>
    </div>

    <div class="footer">© 2025 TattershallStudios<span class="cursor">_</span></div>
  </div>

  <div id="toast"></div>

  <script src="scripts.js"></script>
</body>
</html>
