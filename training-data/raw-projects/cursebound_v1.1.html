}

function _drawTitleFrame(ctx, af, showPrompt) {
  const menuDrop   = 92 * (1 - _tEaseOut(Math.min(1, af/116)));
  const introT     = _tClamp01(af / TITLE_INTRO_FRAMES);
  const titleReveal = _tEaseIO(_tClamp01((af-18)/78));
  let flashAlpha = 0, lightningAlpha = 0.16 + (1-introT)*0.10;
  const FLASHES = [12,16,18,44,47,74,77,80,112,116,154,159];
  for (const f of FLASHES) {
    const d = Math.abs(af - f);
    if (d<=1)  flashAlpha = Math.max(flashAlpha, 1.00);
    else if (d<=3)  flashAlpha = Math.max(flashAlpha, 0.72);
    else if (d<=6)  flashAlpha = Math.max(flashAlpha, 0.44);
    else if (d<=10) flashAlpha = Math.max(flashAlpha, 0.18);
    if (d<=7) lightningAlpha = Math.max(lightningAlpha, 0.95 - d*0.11);
  }

  /* Sky */
  ctx.fillStyle = '#000008'; ctx.fillRect(0,0,NES.W,NES.H);
  ctx.fillStyle = '#0a0614'; ctx.fillRect(0,130,NES.W,50);

  /* Crescent moon */
  ctx.fillStyle = PAL.LIGHTGRAY;
  for (let dy=-21;dy<=21;dy++){const hw=Math.sqrt(Math.max(0,21*21-dy*dy))|0;ctx.fillRect(48-hw,45+dy,hw*2,1);}
  ctx.fillStyle='#000008';
  for (let dy=-18;dy<=18;dy++){const hw=Math.sqrt(Math.max(0,18*18-dy*dy))|0;ctx.fillRect(54-hw,40+dy,hw*2,1);}
  ctx.fillStyle=PAL.MIDGRAY;
  [[38,48,3],[44,56,2],[52,44,2]].forEach(([mx,my,r])=>{ctx.fillRect(mx,my,r,1);ctx.fillRect(mx,my+1,r+1,1);});

  /* Stars */
  ctx.fillStyle=PAL.WHITE;
  [[90,12],[120,8],[160,20],[200,15],[230,30],[15,25],[70,35]].forEach(([sx,sy])=>ctx.fillRect(sx,sy,1,1));
  [[110,30],[180,10],[240,22],[30,18],[150,6]].forEach(([sx,sy])=>ctx.fillRect(sx,sy,2,2));
  ctx.fillStyle=PAL.PALE_GOLD;
  if (Math.floor(G.frame/20)%3===0) ctx.fillRect(90,12,2,2);
  if (Math.floor(G.frame/20)%3===1) ctx.fillRect(160,20,2,2);
  if (Math.floor(G.frame/20)%3===2) ctx.fillRect(230,30,2,2);

  /* Lightning */
  if (lightningAlpha > 0.02) {
    ctx.save(); ctx.globalAlpha = lightningAlpha;
    _drawLightningSet(ctx, af, flashAlpha);
    ctx.restore();
  }

  /* Castle + UI — drops in from above */
  ctx.save();
  ctx.translate(0, Math.round(menuDrop + TITLE_MENU_SETTLE_Y));

  /* Castle silhouette — dark layer */
  ctx.fillStyle='#1a1020';
  ctx.fillRect(0,148,NES.W,NES.H-148); ctx.fillRect(80,118,96,30);
  ctx.fillRect(140,90,16,58); ctx.fillRect(170,115,50,35); ctx.fillRect(30,128,40,20);

  /* Castle — main stone */
  ctx.fillStyle=PAL.STONE_DARK;
  ctx.fillRect(0,160,NES.W,NES.H-160);
  ctx.fillRect(96,100,64,60);
  [96,108,120,132,144,156].forEach(bx=>ctx.fillRect(bx,94,8,8));
  ctx.fillRect(120,68,16,32); ctx.fillRect(124,56,8,14); ctx.fillRect(127,46,2,12);
  ctx.fillRect(8,118,36,42);
  [8,18,28].forEach(bx=>ctx.fillRect(bx,112,7,8));
  ctx.fillRect(208,120,40,40);
  [208,220,232].forEach(bx=>ctx.fillRect(bx,114,8,8));
  ctx.fillRect(56,128,32,32);
  [56,66,76].forEach(bx=>ctx.fillRect(bx,122,8,8));
  ctx.fillRect(168,124,32,36);
  [168,178,188].forEach(bx=>ctx.fillRect(bx,118,8,8));

  /* Castle flash lit by lightning */
  if (flashAlpha > 0.05) {
    ctx.save(); ctx.globalAlpha = flashAlpha*0.9;
    ctx.fillStyle='#3b3550';
    ctx.fillRect(96,100,64,60); ctx.fillRect(120,68,16,32); ctx.fillRect(124,56,8,14);
    ctx.fillRect(8,118,36,42); ctx.fillRect(208,120,40,40);
    ctx.fillRect(56,128,32,32); ctx.fillRect(168,124,32,36);
    ctx.fillStyle='#c8d6ff';
    ctx.fillRect(126,62,4,8); ctx.fillRect(121,79,14,12);
    ctx.fillRect(108,113,8,16); ctx.fillRect(136,114,8,18);
    ctx.restore();
  }

  /* Title text — reveals with easing */
  if (titleReveal > 0) {
    ctx.save(); ctx.globalAlpha = titleReveal;
    drawPxText(ctx,'CURSEBOUND',NES.W/2+2,58,2,PAL.BLOOD_RED,'center');
    drawPxText(ctx,'CURSEBOUND',NES.W/2,56,2,PAL.PALE_GOLD,'center');
    drawPxText(ctx,'A HORRIBLE NIGHT TO HAVE A CURSE',NES.W/2,84,1,PAL.LIGHTGRAY,'center');
    ctx.fillStyle=PAL.BLOOD_RED;
    ctx.fillRect(32,92,NES.W-64,2); ctx.fillRect(30,90,4,6); ctx.fillRect(NES.W-34,90,4,6);
    ctx.restore();
  }

  /* PRESS START — only after animation completes */
  if (showPrompt && af >= TITLE_INTRO_FRAMES) {
    drawPxText(ctx,'PRESS START',NES.W/2,108,1,PAL.WHITE,'center',true);
  }

  /* Controls — fade in at end of reveal */
  const controlsA = _tClamp01((titleReveal - 0.78)/0.22);
  if (controlsA > 0) {
    ctx.save(); ctx.globalAlpha = controlsA;
    drawPxText(ctx,'D-PAD=MOVE  A=JUMP  B=ATTACK',NES.W/2,130,1,PAL.MIDGRAY,'center');
    drawPxText(ctx,'START=START  SELECT=WEAPON',NES.W/2,140,1,PAL.MIDGRAY,'center');
    drawPxText(ctx,'NES JAM 2026',NES.W/2,NES.H-12,1,'#2a2a2a','center');
    ctx.restore();
  }
  ctx.restore();

  /* Full-screen flash overlay */
  if (flashAlpha > 0.01) {
    ctx.save(); ctx.globalAlpha = flashAlpha*0.32;
    ctx.fillStyle=PAL.WHITE; ctx.fillRect(0,0,NES.W,150);
    ctx.restore();
  }
}

const titleScreen = {
  animFrame:  0,
  blinkTimer: 0,
  showPrompt: true,

  reset() {
    this.animFrame  = 0;
    this.blinkTimer = 0;
    this.showPrompt = true;
  },

  update() {
    /* Phase 1: animation running — START/A skips to end, does NOT start game */
    if (this.animFrame < TITLE_INTRO_FRAMES) {
      if (INPUT.START.just || INPUT.A.just) {
        this.animFrame = TITLE_INTRO_FRAMES;   /* skip to settled */
      } else {
        this.animFrame++;
      }
      return;
    }

    /* Phase 2: animation done — blink prompt, START/A starts game */
    this.blinkTimer++;
    if (this.blinkTimer >= 30) {
      this.blinkTimer = 0;
      this.showPrompt = !this.showPrompt;
    }
    if (INPUT.START.just || INPUT.A.just) {
      introScreen.reset();
      setState(STATE.INTRO);
    }
  },

  draw(ctx) {
    _drawTitleFrame(ctx, this.animFrame, this.showPrompt);
  },
};


/* ----------------------------------------------------------------
   10. PLAYING STATE — delegates to zoneView (Section 2)
---------------------------------------------------------------- */
const playingPlaceholder = zoneView;   /* alias — keeps render dispatch clean */


/* ================================================================
   SECTION 3 — PLAYER ENTITY
================================================================ */

/* ----------------------------------------------------------------
   S3-A. PHYSICS CONSTANTS
---------------------------------------------------------------- */
const PHYS = Object.freeze({
  GRAVITY:      0.35,
  MAX_FALL:     8,
  WALK:         1.5,
  JUMP:         -6.5,    /* 60px max height: row-7(48px)✓ row-5 via row-7(32px)✓ */
  KB_X:         3.5,
  KB_Y:         -3.0,
  KB_FRAMES:    20,
  IFRAME_DUR:   60,
  /* ATTACK_DUR removed — weapon recovery is in WEAPON_DEF[name].recovery */
  PLAYER_W:     14,
  PLAYER_H:     22,
});

/* ----------------------------------------------------------------
   S3-B. PLAYER INIT
   Called from onStateEnter(PLAYING). Safe to call again on respawn.
---------------------------------------------------------------- */
function initPlayer(zoneId) {
  const zone = ZONES[zoneId];
  if (!zone) return;
  const spawnX = (zone.spawnTX != null ? zone.spawnTX : 3) * NES.TILE;
  const spawnY = (zone.spawnTY != null ? zone.spawnTY : 10) * NES.TILE - PHYS.PLAYER_H;

  Camera.reset();   /* always reset — prevents camera snap on respawn */

  G.player = {
    /* Position + velocity (hitbox top-left) */
    x: spawnX, y: spawnY,
    w: PHYS.PLAYER_W, h: PHYS.PLAYER_H,
    vx: 0, vy: 0,

    /* State flags */
    onGround:  false,
    facing:    1,         /* 1=right  -1=left */

    /* Combat */
    hp:        6,
    maxHp:     6,
    iFrames:   0,         /* invincibility frames remaining */
    kbTimer:   0,         /* knockback frames remaining */
    attackTimer: 0,       /* attack animation frames remaining */

    /* Animation */
    animFrame: 0,
    animTimer: 0,

    /* Inventory — sword always present; re-add anything collected this run */
    weapons:    ['sword', ...Array.from(G.collectedWeapons)],
    weaponIdx:  0,
    swingId:    0,     /* increments each attack swing — deduplicates enemy hits */

    /* Notification text for pickups */
    notifyText: '',
    notifyTimer: 0,
  };
  if (DEBUG) console.log(`[player] spawned at (${spawnX}, ${spawnY})`);
}

/* ----------------------------------------------------------------
   S3-C. DAMAGE + KNOCKBACK HELPERS
---------------------------------------------------------------- */
function damagePlayer(amount, sourceX) {
  const p = G.player;
  if (!p || p.iFrames > 0) return;
  p.hp = Math.max(0, p.hp - amount);
  Shake.trigger();   /* screen shake on every hit */
  p.iFrames = PHYS.IFRAME_DUR;
  if (sourceX !== undefined) {
    const dir = p.x + p.w * 0.5 > sourceX ? 1 : -1;
    p.vx = dir * PHYS.KB_X;
    p.vy = PHYS.KB_Y;
    p.kbTimer = PHYS.KB_FRAMES;
  }
  if (p.hp === 0) setState(STATE.DEAD);
}

/* ----------------------------------------------------------------
   S3-D. TILE INTERACTION
---------------------------------------------------------------- */
function checkPlayerTiles() {
  const p  = G.player;
  if (!p) return;
  const md = G.currentZoneId ? ZONES[G.currentZoneId].mapData : null;
  if (!md) return;

  /* Scan tiles overlapping the player's AABB — clamped to map bounds */
  const tx0 = Math.max(0,          ( p.x              / NES.TILE) | 0);
  const tx1 = Math.min(md.cols-1, ((p.x + p.w - 1)   / NES.TILE) | 0);
  const ty0 = Math.max(0,          ( p.y              / NES.TILE) | 0);
  const ty1 = Math.min(md.rows-1, ((p.y + p.h - 1)   / NES.TILE) | 0);

  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const idx = ty * md.cols + tx;
      const id  = md.data[idx];
      if (!id) continue;

      const props = TILE_PROPS[id];
      if (!props) continue;

      /* Spike — damage from source at spike center */
      if (props.hazard) {
        damagePlayer(1, tx * NES.TILE + 8);
        /* If the hit killed the player, stop scanning — a door tile later in
           the same AABB could call transitionZone and override STATE.DEAD. */
        if (G.state !== STATE.PLAYING) return;
      }

      /* Weapon pickup */
      if (id === T.WEAPON) {
        if (!p.weapons.includes('bone_whip')) {
          p.weapons.push('bone_whip');
          G.collectedWeapons.add('bone_whip');  /* persists through death */
          p.notifyText  = 'BONE WHIP';
          p.notifyTimer = 120;
        }
        md.data[idx] = T.AIR;   /* remove from map (dynamic layer stops drawing it) */
      }

      /* Zone door triggers — vx/vy guard prevents accidental fires */
      if (props.trigger === 'door_l' && p.vx < -0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.left;
        if (dest) { transitionZone(dest); return; }
      }
      if (props.trigger === 'door_r' && p.vx > 0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.right;
        if (dest) { transitionZone(dest); return; }
      }
      if (props.trigger === 'door_up' && p.vy < -0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.up;
        if (dest) { transitionZone(dest); return; }
      }

      /* Lore pickup — freeze game, show panel, track collection */
      if (id === T.LORE) {
        const zone   = ZONES[G.currentZoneId];
        const lLines = zone.loreTexts && zone.loreTexts.get(idx);
        const key    = G.currentZoneId + ':' + idx;
        G.loreCollected.add(key);
        md.data[idx] = T.AIR;
        lorePanel.show(lLines || ['LORE FOUND']);
      }
    }
  }

  /* Pit death — fell past map bottom */
  if (p.y > md.rows * NES.TILE + 32) {
    p.hp = 0;
    setState(STATE.DEAD);
  }
}

function playerUpdate() {
  const p  = G.player;
  if (!p) return;
  const md = ZONES[G.currentZoneId] && ZONES[G.currentZoneId].mapData;
  if (!md) {
    /* Zone not yet built — immediately return player to entry hall */
    transitionZone(ZONE_ID.ENTRY);
    return;
  }

  /* ── Timers ── */
  if (p.iFrames     > 0) p.iFrames--;
  if (p.attackTimer > 0) p.attackTimer--;
  if (p.kbTimer     > 0) p.kbTimer--;
  if (p.notifyTimer > 0) p.notifyTimer--;

  /* ── Gravity ── */
  p.vy += PHYS.GRAVITY;
  if (p.vy > PHYS.MAX_FALL) p.vy = PHYS.MAX_FALL;

  /* ── Input (locked during knockback) ── */
  if (p.kbTimer === 0) {
    if (INPUT.LEFT.pressed) {
      p.vx = -PHYS.WALK;
      p.facing = -1;
    } else if (INPUT.RIGHT.pressed) {
      p.vx = PHYS.WALK;
      p.facing = 1;
    } else {
      p.vx = 0;
    }

    if (INPUT.A.just && p.onGround) {
      p.vy = PHYS.JUMP;
      p.onGround = false;
    }

    if (INPUT.B.just && p.attackTimer === 0) {
      const wdef    = getWeaponDef(p);
      p.attackTimer = wdef.recovery;
      p.swingId++;          /* new swing — enemies can be hit again */
    }

    if (INPUT.SELECT.just && p.weapons.length > 1) {
      p.weaponIdx = (p.weaponIdx + 1) % p.weapons.length;
      p.notifyText  = p.weapons[p.weaponIdx].toUpperCase().replace(/_/g, ' ');
      p.notifyTimer = 90;
    }
  } else {
    p.vx *= 0.82;
  }

  /* ── Collision resolution ── */
  const res = resolveCollision(p, md);
  p.x = res.x;  p.y = res.y;
  p.vx = res.vx; p.vy = res.vy;
  p.onGround = res.onGround;

  if (res.onGround && p.kbTimer > 0) p.kbTimer = 0;

  /* ── Tile interactions ── */
  checkPlayerTiles();
  /* Guard: transitionZone inside checkPlayerTiles replaces G.player.
     If p is now stale, abort — new player's first update runs next frame. */
  if (G.player !== p) return;

  /* ── Walk animation ── */
  if (p.onGround && Math.abs(p.vx) > 0.1) {
    if (++p.animTimer >= 8) { p.animTimer = 0; p.animFrame++; }
  } else {
    p.animTimer = 0;
  }

  /* ── Camera ── */
  Camera.follow(p);
}

/* ----------------------------------------------------------------
   S3-F. PLAYER DRAW — 16×24 pixel-art cloaked figure
   Uses translate + scale(-1,1) for left-facing flip.
   globalAlpha flicker for i-frames (classic NES invincibility).
---------------------------------------------------------------- */
function playerDraw(ctx) {
  const p = G.player;
  if (!p) return;

  const sx = Math.round(p.x - Camera.x) - 1;
  const sy = Math.round(p.y - Camera.y) - 1;

  const spriteVisible = !(p.iFrames > 0 && (p.iFrames % 6) < 3);

  if (spriteVisible) {
    ctx.save();
    if (p.facing === -1) {
      ctx.translate(sx + 16, sy);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(sx, sy);
    }

    /* ── Hood — with highlight ridge ── */
    ctx.fillStyle = PAL.CLOAK_DARK;
    ctx.fillRect(5, 0, 6, 2);
    ctx.fillRect(4, 2, 8, 3);
    ctx.fillRect(3, 4, 10, 2);
    /* Hood highlight — left-side lit edge */
    ctx.fillStyle = PAL.CLOAK_MID;
    ctx.fillRect(5, 0, 2, 2);
    ctx.fillRect(4, 2, 2, 3);

    /* ── Face ── */
    ctx.fillStyle = PAL.SKIN;
    ctx.fillRect(4, 4, 8, 4);
    /* Cheekbone shadow */
    ctx.fillStyle = '#c08050';
    ctx.fillRect(4, 6, 2, 2);

    /* ── Eyes — direction-aware glow ── */
    ctx.fillStyle = PAL.CLOAK_DARK;
    ctx.fillRect(5, 6, 2, 1);
    ctx.fillRect(9, 6, 2, 1);
    /* Subtle eye glow — curse mark */
    ctx.fillStyle = '#aa4422';
    ctx.fillRect(10, 6, 1, 1);

    /* ── Shoulder pauldron — left ── */
    ctx.fillStyle = PAL.CLOAK_MID;
    ctx.fillRect(1, 8, 14, 4);
    /* Shoulder highlight ridge */
    ctx.fillStyle = PAL.CLOAK_LITE;
    ctx.fillRect(2, 8, 4, 1);
    /* Right shoulder shadow */
    ctx.fillStyle = PAL.CLOAK_DARK;
    ctx.fillRect(12, 8, 2, 4);

    /* ── Cloak body — three-tone depth ── */
    ctx.fillStyle = PAL.CLOAK_MID;
    ctx.fillRect(2, 12, 12, 3);
    ctx.fillStyle = PAL.CLOAK_DARK;
    ctx.fillRect(2, 15, 12, 4);
    ctx.fillRect(3, 19, 10, 2);
    /* Centre fold crease */
    ctx.fillStyle = '#141430';
    ctx.fillRect(7, 12, 1, 7);

    /* ── Belt — horizontal gold strip ── */
    ctx.fillStyle = '#6c4010';
    ctx.fillRect(3, 12, 10, 1);
    ctx.fillStyle = PAL.GOLD;
    ctx.fillRect(6, 12, 4, 1);   /* belt buckle */

    /* ── Boots ── */
    const walking  = p.onGround && Math.abs(p.vx) > 0.1;
    const legShift = walking ? (p.animFrame % 2 === 0 ? -1 : 1) : 0;
    /* Boot body */
    ctx.fillStyle = '#1a1010';
    ctx.fillRect(3, 21 - legShift, 5, 5);
    ctx.fillRect(8, 21 + legShift, 5, 5);
    /* Boot toe — slightly brighter */
    ctx.fillStyle = '#2a2020';
    ctx.fillRect(3, 24 - legShift, 5, 2);
    ctx.fillRect(8, 24 + legShift, 5, 2);
    /* Boot highlight */
    ctx.fillStyle = '#3a3030';
    ctx.fillRect(3, 21 - legShift, 2, 1);
    ctx.fillRect(8, 21 + legShift, 2, 1);

    /* ── Attack animations — per weapon ── */
    if (p.attackTimer > 0) {
      const wName   = p.weapons[p.weaponIdx] || 'sword';
      const tNorm   = 1 - (p.attackTimer / (WEAPON_DEF_EXT[wName] || WEAPON_DEF[wName] || WEAPON_DEF.sword).recovery);

      if (wName === 'sword') {
        /* Sword: forward thrust — slides out then retracts */
        const ext = tNorm < 0.5 ? tNorm * 2 : 2 - tNorm * 2;
        const off = Math.round(ext * 6);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(12,     9,  3, 6);          /* crossguard */
        ctx.fillStyle = PAL.SWORD_GREY;
        ctx.fillRect(15,     10, 6 + off, 3);    /* blade extends */
        ctx.fillStyle = '#d0d0d0';
        ctx.fillRect(15,     10, 3,       1);    /* blade upper highlight */
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(20 + off, 11, 1, 1);        /* tip glint */

      } else if (wName === 'bone_whip') {
        /* Whip: sweeping arc from handle to tip */
        const arc = tNorm;
        const tipX = Math.round(12 + arc * 18);
        const tipY = Math.round(8 - Math.sin(arc * Math.PI) * 10);
        ctx.fillStyle = PAL.STONE_HIGH;
        ctx.fillRect(12, 8, 2, 4);               /* handle */
        /* Chain segments along arc */
        for (let s = 0; s < 5; s++) {
          const t2 = s / 5;
          const cx2 = Math.round(14 + t2 * (tipX - 14));
          const cy2 = Math.round(9  - Math.sin(t2 * Math.PI * arc) * 8);
          ctx.fillStyle = (s % 2 === 0) ? PAL.LIGHTGRAY : PAL.STONE_MID;
          ctx.fillRect(cx2, cy2, 2, 2);
        }
        ctx.fillStyle = PAL.PALE_GOLD;
        ctx.fillRect(tipX, tipY, 2, 2);          /* tip spike */
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(tipX, tipY, 1, 1);

      } else if (wName === 'cursed_dagger') {
        /* Dagger: arm extends forward quickly — projectile fired separately */
        ctx.fillStyle = PAL.CLOAK_LITE;
        ctx.fillRect(13, 11, 8, 2);              /* arm thrust */
        ctx.fillStyle = '#6644aa';
        ctx.fillRect(13, 10, 8, 1);              /* curse glint on arm */

      } else if (wName === 'holy_axe') {
        /* Axe: raised overhead then forward throw arc */
        const phase = tNorm < 0.3 ? 'raise' : 'throw';
        if (phase === 'raise') {
          ctx.fillStyle = PAL.PALE_GOLD;
          ctx.fillRect(11, 2,  3, 8);            /* shaft raised */
          ctx.fillStyle = PAL.GOLD;
          ctx.fillRect(8,  1,  4, 5);            /* axe head up */
          ctx.fillStyle = PAL.WHITE;
          ctx.fillRect(8,  1,  2, 2);            /* blade glint */
        } else {
          const ext = (tNorm - 0.3) / 0.7;
          ctx.fillStyle = PAL.PALE_GOLD;
          ctx.fillRect(11, 2 + Math.round(ext * 8), 3, 8);  /* shaft angle */
          ctx.fillStyle = PAL.GOLD;
          ctx.fillRect(11 + Math.round(ext * 4), 1, 4, 5);  /* axe forward */
        }

      } else if (wName === 'void_scythe') {
        /* Scythe: wide sweep — simultaneous both directions shown as a broad arc */
        const sweep = Math.sin(tNorm * Math.PI);
        ctx.fillStyle = '#4a3060';
        ctx.fillRect(7, 6, 2, 10);              /* central staff */
        /* Left blade arc */
        ctx.fillStyle = '#8844cc';
        ctx.fillRect(Math.round(5 - sweep * 6), Math.round(6 - sweep * 2), 5, 2);
        /* Right blade arc */
        ctx.fillRect(Math.round(8 + sweep * 4), Math.round(6 - sweep * 2), 5, 2);
        /* Void particles */
        if (sweep > 0.5) {
          ctx.fillStyle = PAL.PALE_GOLD;
          ctx.fillRect(2, 4, 1, 1);
          ctx.fillRect(14, 4, 1, 1);
          ctx.fillRect(0, 8, 1, 1);
          ctx.fillRect(15, 8, 1, 1);
        }
      } else {
        /* Fallback — generic forward slash */
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(12, 9, 3, 6);
        ctx.fillStyle = PAL.SWORD_GREY;
        ctx.fillRect(15, 10, 8, 3);
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(22, 11, 1, 1);
      }
    }

    ctx.restore();
  }

  /* ── Pickup notification — fades out over last 20 frames ── */
  if (p.notifyTimer > 0) {
    const alpha = Math.min(1, p.notifyTimer / 20);
    ctx.globalAlpha = alpha;
    /* Small panel behind text */
    const nw = pxTextWidth(p.notifyText, 1) + 8;
    const nx = (sx + 8) - (nw >> 1);
    const ny = sy - 14;
    ctx.fillStyle = 'rgba(5,3,12,0.8)';
    ctx.fillRect(nx, ny, nw, 10);
    ctx.fillStyle = PAL.BLOOD_RED;
    ctx.fillRect(nx, ny, nw, 1);
    drawPxText(ctx, p.notifyText, sx + 8, ny + 3, 1, PAL.PALE_GOLD, 'center');
    ctx.globalAlpha = 1;
  }
}


/* ================================================================
   SECTION 4 — WEAPON DIFFERENTIATION + ENEMY SYSTEM
================================================================ */

/* ----------------------------------------------------------------
   S4-A. WEAPON DEFINITIONS
   Each weapon has distinct reach, vertical offset, arc height,
   recovery frames, and damage. Bone Whip hits overhead; sword hits
   forward at chest height.
---------------------------------------------------------------- */
const WEAPON_DEF = Object.freeze({
  sword: {
    reach:    20,   /* horizontal reach px            */
    yOff:     -2,   /* y offset from player mid       */
    arcH:     14,   /* hitbox height                  */
    recovery: 18,   /* frames attack window is active */
    damage:   1,
  },
  bone_whip: {
    reach:    48,   /* much longer arc                */
    yOff:    -10,   /* hits high — above the player   */
    arcH:     20,
    recovery: 28,   /* slower than sword              */
    damage:   1,
  },
});

function getWeaponDef(player) {
  return WEAPON_DEF[player.weapons[player.weaponIdx]] || WEAPON_DEF.sword;
}

/* Returns world-space {x,y,w,h} attack rectangle, or null if not attacking */
function getAttackHitbox(player) {
  if (!player || player.attackTimer <= 0) return null;
  const def = getWeaponDef(player);
  const hbx = player.facing === 1
    ? player.x + player.w
    : player.x - def.reach;
  const hby = player.y + (player.h >> 1) + def.yOff;
  return { x: hbx, y: hby, w: def.reach, h: def.arcH };
}


/* ----------------------------------------------------------------
   S4-B. ENEMY CONFIG
   Single source of truth for per-type stats.
---------------------------------------------------------------- */
const ENEMY_CFG = Object.freeze({
  skeleton: {
    w: 14, h: 22, hp: 2,
    speed: 0.8, aggroRange: 96, lungeVx: 2.8,
    gravity: true, contactDamage: 1,
  },
  bat: {
    w: 14, h: 12, hp: 1,
    diveSpeed: 2.4, aggroRange: 80,
    gravity: false, contactDamage: 1,
    ampX: 36, ampY: 10,
  },
  armored_guard: {
    w: 14, h: 22, hp: 3,
    speed: 0.45, aggroRange: 80,
    gravity: true, contactDamage: 2,
  },
});


/* ----------------------------------------------------------------
   S4-C. SHARED HELPERS
---------------------------------------------------------------- */
function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* True if there is no solid floor one step ahead of the enemy */
function enemyWouldFall(enemy, dir, md) {
  const edgeX  = dir === 1 ? enemy.x + enemy.w + 2 : enemy.x - 2;
  const floorY = enemy.y + enemy.h + 4;
  return !tileIsSolid(tileAt(md, (edgeX / NES.TILE) | 0, (floorY / NES.TILE) | 0));
}


/* ----------------------------------------------------------------
   S4-D. ENEMY FACTORY
   tx/ty are tile coordinates. Ground enemies: feet land on ty*TILE.
   Bats: base center at ty*TILE.
---------------------------------------------------------------- */
function createEnemy(type, tx, ty) {
  const cfg  = ENEMY_CFG[type];
  const wx   = tx * NES.TILE;
  const wy   = cfg.gravity ? ty * NES.TILE - cfg.h : ty * NES.TILE;
  const e = {
    type, x: wx, y: wy, w: cfg.w, h: cfg.h,
    vx: 0, vy: 0, facing: 1,
    hp: cfg.hp, maxHp: cfg.hp,
    state: 'patrol', stateTimer: 0,
    hurtTimer: 0, dead: false,
    animFrame: 0, animTimer: 0,
    lastHitSwing: -1,
  };
  if (type === 'bat') {
    e.baseX     = wx;
    e.baseY     = wy;
    e.animPhase = (tx * 0.37 + ty * 0.19) % (Math.PI * 2);
  }
  return e;
}

/* Spawn fresh enemies from a zone's enemySpawns definition list */
function initZoneEnemies(zoneId) {
  const zone = ZONES[zoneId];
  if (!zone) return;
  zone.enemies = (zone.enemySpawns && zone.enemySpawns.length)
    ? zone.enemySpawns.map(d => createEnemy(d.type, d.tx, d.ty))
    : [];
}


/* ----------------------------------------------------------------
   S4-E. COMBAT
---------------------------------------------------------------- */
function enemyTakeDamage(enemy, amount, sourceX) {
  if (enemy.state === 'hurt' || enemy.state === 'dead') return;
  enemy.hp = Math.max(0, enemy.hp - amount);
  enemy.state    = 'hurt';
  enemy.stateTimer = 0;
  enemy.hurtTimer  = 20;
  const dir  = (enemy.x + enemy.w * 0.5) > sourceX ? 1 : -1;
  enemy.vx   = dir * 2.5;
  enemy.vy   = enemy.type === 'bat' ? -1.5 : -2.0;
}


/* ----------------------------------------------------------------
   S4-F. GROUND ENEMY AI  (skeleton + armored_guard)
   Skeleton:      patrol → alert (pause) → attack (lunge) → patrol
   Armored guard: patrol → chase (persistent pursuit) → patrol
---------------------------------------------------------------- */
function updateEnemyGround(enemy, md, player) {
  const cfg = ENEMY_CFG[enemy.type];

  /* ── Dead flash ── */
  if (enemy.state === 'dead') {
    if (++enemy.stateTimer >= 30) enemy.dead = true;
    return;
  }

  /* ── Hurt — knockback + brief stun ── */
  if (enemy.state === 'hurt') {
    enemy.stateTimer++;
    enemy.vx *= 0.75;
    enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
    if (enemy.stateTimer >= 14) {
      enemy.state      = enemy.hp <= 0 ? 'dead' : 'patrol';
      enemy.stateTimer = 0;
      if (enemy.state === 'patrol') enemy.vx = 0;
    }
    return;
  }

  const hasPlayer = !!(player && player.hp > 0);
  const pdx       = hasPlayer ? (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1)) : 0;
  const sameFloor = hasPlayer &&
    Math.abs((player.y + player.h) - (enemy.y + enemy.h)) < 40;

  /* ─────────────────────────────────────────────────────────────
     SKELETON: patrol → alert (18fr pause) → attack (22fr lunge)
  ───────────────────────────────────────────────────────────── */
  if (enemy.type === 'skeleton') {
    if (enemy.state === 'patrol') {
      enemy.vx = enemy.facing * cfg.speed;
      if (hasPlayer && sameFloor && Math.abs(pdx) < cfg.aggroRange) {
        enemy.facing     = pdx > 0 ? 1 : -1;
        enemy.state      = 'alert';
        enemy.stateTimer = 0;
        enemy.vx = 0;
      }
    } else if (enemy.state === 'alert') {
      enemy.stateTimer++;
      enemy.vx = 0;
      if (hasPlayer) enemy.facing = pdx > 0 ? 1 : -1;
      if (enemy.stateTimer >= 18) {
        enemy.state      = 'attack';
        enemy.stateTimer = 0;
        enemy.vx         = enemy.facing * cfg.lungeVx;
      }
    } else if (enemy.state === 'attack') {
      /* Decelerate lunge over the 22 frames rather than running full speed */
      enemy.vx *= 0.93;
      if (++enemy.stateTimer >= 22) {
        enemy.state      = 'patrol';
        enemy.stateTimer = 0;
        enemy.vx = 0;
      }
    }
  }

  /* ─────────────────────────────────────────────────────────────
     ARMORED GUARD: patrol → chase (continuous pursuit, 150fr max)
     No lunge. Slow, heavy, persistent.
  ───────────────────────────────────────────────────────────── */
  if (enemy.type === 'armored_guard') {
    if (enemy.state === 'patrol') {
      enemy.vx = enemy.facing * cfg.speed;
      if (hasPlayer && sameFloor && Math.abs(pdx) < cfg.aggroRange) {
        enemy.facing     = pdx > 0 ? 1 : -1;
        enemy.state      = 'chase';
        enemy.stateTimer = 0;
      }
    } else if (enemy.state === 'chase') {
      enemy.stateTimer++;
      if (hasPlayer) enemy.facing = pdx > 0 ? 1 : -1;
      enemy.vx = enemy.facing * cfg.speed;
      const lostPlayer = !hasPlayer || !sameFloor;
      if (lostPlayer && enemy.stateTimer > 30) {
        enemy.state      = 'patrol';
        enemy.stateTimer = 0;
      }
    }
  }

  /* ── Gravity + collision ── */
  enemy.vy += PHYS.GRAVITY;
  if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
  const res = resolveCollision(enemy, md);
  enemy.x = res.x; enemy.y = res.y;
  enemy.vx = res.vx; enemy.vy = res.vy;

  /* ── Turn logic — only ONE flip per frame ── */
  const inAttack = enemy.state === 'attack';
  const inChase  = enemy.state === 'chase';

  if (inAttack && (res.hitWallL || res.hitWallR)) {
    /* Lunge cancelled by wall */
    enemy.state      = 'patrol';
    enemy.stateTimer = 0;
    enemy.facing    *= -1;
    enemy.vx = 0;

  } else if (inChase && (res.hitWallL || res.hitWallR)) {
    /* Chase hits wall — turn and keep going */
    enemy.facing *= -1;
    enemy.vx = enemy.facing * cfg.speed;

  } else if (!inAttack && !inChase) {
    /* Patrol: wall, pit, and door checks — only one flip allowed */
    let turned = false;
    if (res.hitWallL || res.hitWallR) {
      enemy.facing *= -1;
      turned = true;
    }
    if (!turned && res.onGround && enemyWouldFall(enemy, enemy.facing, md)) {
      enemy.facing *= -1;
      turned = true;
    }
    if (!turned) {
      const ftx = ((enemy.x + (enemy.facing === 1 ? enemy.w + 1 : -1)) / NES.TILE) | 0;
      const fty = ((enemy.y + enemy.h * 0.5) / NES.TILE) | 0;
      const fid = tileAt(md, ftx, fty);
      if (!tileIsSolid(fid) && TILE_PROPS[fid] && TILE_PROPS[fid].trigger) {
        enemy.facing *= -1;
      }
    }
    /* Only restore patrol speed — alert and other non-moving states keep their own vx */
    if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed;
  }

  /* ── Walk animation ── */
  if (res.onGround && Math.abs(enemy.vx) > 0.1) {
    if (++enemy.animTimer >= 10) { enemy.animTimer = 0; enemy.animFrame++; }
  }
}


/* ----------------------------------------------------------------
   S4-G. BAT AI
   States: patrol (sine wave) → dive → returning → patrol
   No teleporting — every transition uses velocity-based movement.
---------------------------------------------------------------- */
function updateEnemyBat(enemy, player) {
  const cfg = ENEMY_CFG.bat;

  /* ── Dead flash ── */
  if (enemy.state === 'dead') {
    if (++enemy.stateTimer >= 30) enemy.dead = true;
    return;
  }

  /* ── Hurt — knocked away, then return to base ── */
  if (enemy.state === 'hurt') {
    enemy.stateTimer++;
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;
    enemy.vx *= 0.80;
    enemy.vy *= 0.85;
    if (enemy.stateTimer >= 14) {
      enemy.state      = enemy.hp <= 0 ? 'dead' : 'returning';
      enemy.stateTimer = 0;
    }
    if (++enemy.animTimer >= 7) { enemy.animTimer = 0; enemy.animFrame++; }
    return;
  }

  /* ── Returning — fly smoothly back to base, then resume patrol ── */
  if (enemy.state === 'returning') {
    const dx   = enemy.baseX - enemy.x;
    const dy   = enemy.baseY - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 5) {
      /* Arrived — snap cleanly and resume sine wave */
      enemy.x     = enemy.baseX;
      enemy.y     = enemy.baseY;
      enemy.state = 'patrol';
    } else {
      /* Proportional speed — faster when far, slows near base */
      const spd = Math.min(2.2, Math.max(0.8, dist * 0.07));
      enemy.x  += (dx / dist) * spd;
      enemy.y  += (dy / dist) * spd;
      enemy.facing = dx >= 0 ? 1 : -1;
    }
    if (++enemy.animTimer >= 7) { enemy.animTimer = 0; enemy.animFrame++; }
    return;
  }

  /* ── Dive — tracks player horizontally while falling ── */
  if (enemy.state === 'dive') {
    enemy.stateTimer++;
    if (player && player.hp > 0) {
      const targetCX = player.x + (player.w >> 1);
      const selfCX   = enemy.x  + (enemy.w  >> 1);
      enemy.vx += (targetCX - selfCX) * 0.04;
    }
    enemy.vx = Math.max(-3, Math.min(3, enemy.vx));
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;
    enemy.facing = enemy.vx >= 0 ? 1 : -1;

    /* End dive: overshot base or ran too long */
    if (enemy.y > enemy.baseY + 110 || enemy.stateTimer > 80) {
      enemy.state      = 'returning';
      enemy.stateTimer = 0;
      enemy.vx = 0;
      enemy.vy = 0;
    }
    if (++enemy.animTimer >= 5) { enemy.animTimer = 0; enemy.animFrame++; }
    return;
  }

  /* ── Patrol — sine-wave float ── */
  const t    = G.frame;
  enemy.x    = enemy.baseX + Math.sin(t * 0.025 + enemy.animPhase) * cfg.ampX;
  enemy.y    = enemy.baseY + Math.sin(t * 0.018 + enemy.animPhase * 1.5) * cfg.ampY;
  enemy.facing = Math.cos(t * 0.025 + enemy.animPhase) >= 0 ? 1 : -1;

  /* Dive trigger: player is below within horizontal + vertical range */
  if (player && player.hp > 0) {
    const cx  = enemy.x  + (enemy.w  >> 1);
    const pcx = player.x + (player.w >> 1);
    const dx  = Math.abs(pcx - cx);
    const dy  = (player.y + player.h) - (enemy.y + enemy.h);   /* +ve = player below */
    if (dx < 44 && dy > 0 && dy < cfg.aggroRange) {
      enemy.state      = 'dive';
      enemy.stateTimer = 0;
      enemy.vy = cfg.diveSpeed;
      enemy.vx = (pcx - cx) * 0.06;
    }
  }
  if (++enemy.animTimer >= 7) { enemy.animTimer = 0; enemy.animFrame++; }
}


/* ----------------------------------------------------------------
   S4-H. MAIN ENEMY UPDATE — called each PLAYING frame
---------------------------------------------------------------- */
function updateEnemies() {
  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies || zone.enemies.length === 0) return;
  const md      = zone.mapData;
  const p       = G.player;
  const hitbox  = getAttackHitbox(p);
  const wdef    = p ? getWeaponDef(p) : null;

  for (let i = zone.enemies.length - 1; i >= 0; i--) {
    const e = zone.enemies[i];

    /* Decrement visual hurt flash independently of AI state */
    if (e.hurtTimer > 0) e.hurtTimer--;

    /* Type-specific AI update */
    if (e.type === 'bat') {
      updateEnemyBat(e, p);
    } else {
      if (md) updateEnemyGround(e, md, p);
    }

    /* Remove fully dead enemies */
    if (e.dead) { zone.enemies.splice(i, 1); continue; }

    /* Skip interactions during hurt/dead states */
    if (e.state === 'dead' || e.state === 'hurt') continue;

    /* Player attack hitbox → enemy damage */
    if (hitbox && wdef && p && e.lastHitSwing !== p.swingId) {
      if (aabbOverlap(hitbox, e)) {
        e.lastHitSwing = p.swingId;
        enemyTakeDamage(e, wdef.damage, p.x + (p.facing === 1 ? p.w : 0));
      }
    }

    /* Enemy body contact → player damage */
    if (p && p.hp > 0 && aabbOverlap(e, p)) {
      damagePlayer(ENEMY_CFG[e.type].contactDamage, e.x + e.w * 0.5);
    }
  }
}


/* ----------------------------------------------------------------
   S4-I. ENEMY DRAW FUNCTIONS
   All sprites drawn at local (0,0); save/restore + translate handles
   world→screen and facing flip.
---------------------------------------------------------------- */
function _drawSkeleton(ctx, e) {
  const flash = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const CB = flash ? PAL.WHITE : PAL.LIGHTGRAY;
  const CD = flash ? PAL.WHITE : PAL.STONE_DARK;

  ctx.fillStyle = CB;
  ctx.fillRect(4, 0, 6, 5);              /* skull */
  ctx.fillStyle = CD;
  ctx.fillRect(4, 1, 2, 2);              /* left eye  */
  ctx.fillRect(8, 1, 2, 2);              /* right eye */
  ctx.fillRect(6, 4, 2, 1);              /* jaw gap   */
  ctx.fillStyle = CB;
  ctx.fillRect(6, 5, 2, 2);              /* neck */
  ctx.fillRect(3, 7, 8, 4);              /* ribcage */
  ctx.fillStyle = CD;
  ctx.fillRect(5, 8, 4, 2);              /* rib shadow */
  ctx.fillStyle = CB;
  ctx.fillRect(0, 9, 3, 2);              /* left arm  */
  ctx.fillRect(11, 9, 3, 2);             /* right arm */
  ctx.fillRect(4, 11, 6, 3);             /* pelvis */
  const leg = e.animFrame % 2 === 0 ? 1 : -1;
  ctx.fillRect(4, 14 - leg, 3, 8);       /* left leg  */
  ctx.fillRect(7, 14 + leg, 3, 8);       /* right leg */
}

function _drawBat(ctx, e) {
  const flash  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = flash ? PAL.WHITE : PAL.CLOAK_DARK;
  const C2 = flash ? PAL.WHITE : PAL.CLOAK_MID;
  const CE = flash ? PAL.WHITE : PAL.BLOOD_RED;
  const up = e.animFrame % 2 === 0;      /* wing flap */

  ctx.fillStyle = C1;
  ctx.fillRect(0,  up ? 2 : 5, 4, 4);   /* left wing  */
  ctx.fillRect(10, up ? 2 : 5, 4, 4);   /* right wing */
  ctx.fillStyle = C2;
  ctx.fillRect(1,  up ? 3 : 6, 3, 2);   /* left membrane  */
  ctx.fillRect(10, up ? 3 : 6, 3, 2);   /* right membrane */
  ctx.fillStyle = C1;
  ctx.fillRect(4, 3, 6, 6);             /* body */
  ctx.fillStyle = CE;
  ctx.fillRect(5, 4, 2, 2);             /* left eye  */
  ctx.fillRect(8, 4, 2, 2);             /* right eye */
}

function _drawArmoredGuard(ctx, e) {
  const flash = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = flash ? PAL.WHITE : PAL.STONE_MID;
  const C2 = flash ? PAL.WHITE : PAL.STONE_HIGH;
  const C3 = flash ? PAL.WHITE : PAL.STONE_DARK;

  ctx.fillStyle = C1;
  ctx.fillRect(1, 0, 12, 8);             /* helmet body */
  ctx.fillStyle = C2;
  ctx.fillRect(2, 0, 10, 2);             /* helmet top  */
  ctx.fillStyle = C3;
  ctx.fillRect(3, 2, 3, 3);              /* visor left  */
  ctx.fillRect(8, 2, 3, 3);              /* visor right */
  ctx.fillStyle = C1;
  ctx.fillRect(0, 8, 14, 7);             /* armored torso */
  ctx.fillStyle = C2;
  ctx.fillRect(2, 9, 10, 4);             /* chest plate   */
  ctx.fillStyle = C3;
  ctx.fillRect(6, 10, 2, 2);             /* chest line    */
  ctx.fillStyle = C1;
  const leg = e.animFrame % 2 === 0 ? 1 : -1;
  ctx.fillRect(1, 15 - leg, 5, 7);       /* left leg  */
  ctx.fillRect(8, 15 + leg, 5, 7);       /* right leg */
}

function drawEnemies(ctx) {
  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies || zone.enemies.length === 0) return;

  for (const e of zone.enemies) {
    if (e.dead) continue;
    const sx = Math.round(e.x - Camera.x);
    const sy = Math.round(e.y - Camera.y);
    if (sx + e.w < 0 || sx > NES.W || sy + e.h < 0 || sy > NES.H) continue;

    /* Death flicker — skip alternate 3-frame bursts */
    if (e.state === 'dead' && (e.stateTimer % 6) < 3) continue;

    ctx.save();
    if (e.facing === -1) {
      ctx.translate(sx + e.w, sy);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(sx, sy);
    }

    switch (e.type) {
      case 'skeleton':      _drawSkeleton(ctx, e);      break;
      case 'bat':           _drawBat(ctx, e);           break;
      case 'armored_guard': _drawArmoredGuard(ctx, e);  break;
    }
    ctx.restore();
  }
}

      desc1: 'CANNOT BE KILLED.',
      desc2: 'ANY WEAPON STUNS 3 SECS.',
    },
    {
      type: 'header',
      text: 'OBJECTIVE',
    },
    {
      type:  'item',
      name:  'BREAK THE CURSE',
      icon:  null,
      zone:  '',
      desc1: 'REACH THE THRONE ROOM.',
      desc2: 'FIVE ZONES. ONE WAY OUT.',
    },
  ];

  let showGuide  = false;
  let guideLine  = 0;           /* scroll index into GUIDE_ENTRIES */
  const VISIBLE  = 4;           /* entries visible at once in guide */

  /* ── Draw a single weapon/item icon in the guide — reuses _drawWeaponIcon ── */
  function drawGuideIcon(ctx, iconName, cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    switch(iconName) {
      case 'sword':
        ctx.fillStyle = PAL.SWORD_GREY;
        ctx.fillRect(-1,-5, 2, 9);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(-3,-1, 6, 2);
        ctx.fillStyle = '#8c6030';
        ctx.fillRect(-1, 1, 2, 3);
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(-1,-5, 1, 2);
        break;
      case 'bone_whip':
        ctx.fillStyle = PAL.LIGHTGRAY;
        for(let i=0;i<4;i++) ctx.fillRect(-5+i*3,-2+i, 2, 2);
        ctx.fillStyle = PAL.STONE_HIGH;
        ctx.fillRect(-6,-3, 3, 2);
        break;
      case 'cursed_dagger':
        ctx.fillStyle = PAL.CLOAK_LITE;
        ctx.fillRect(-5,-1, 8, 2);
        ctx.fillStyle = PAL.STONE_HIGH;
        ctx.fillRect(2,-2, 2, 4);
        ctx.fillStyle = '#8866ff';
        ctx.fillRect(-5, 0, 7, 1);
        break;
      case 'holy_axe':
        ctx.fillStyle = PAL.PALE_GOLD;
        ctx.fillRect(-2,-5, 4, 8);
        ctx.fillStyle = PAL.GOLD;
        ctx.fillRect(-5,-5, 3, 6);
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(-5,-5, 2, 2);
        break;
      case 'void_scythe':
        ctx.fillStyle = '#4a3060';
        ctx.fillRect(-1,-5, 2, 9);
        ctx.fillStyle = '#aa66ff';
        ctx.fillRect(-5,-5, 5, 2);
        ctx.fillRect(-5,-5, 2, 5);
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(-5,-5, 2, 1);
        break;
      case 'lore':
        ctx.fillStyle = '#283848';
        ctx.fillRect(-4,-5, 8, 10);
        ctx.fillStyle = '#4466cc';
        ctx.fillRect(-2,-3, 4, 6);
        ctx.fillStyle = PAL.WHITE;
        ctx.fillRect(-1,-1, 2, 2);
        break;
      case 'hand':
        ctx.fillStyle = PAL.STONE_MID;
        ctx.fillRect(-4,-2, 8, 6);
        ctx.fillStyle = PAL.STONE_HIGH;
        ctx.fillRect(-4,-5, 2, 4);
        ctx.fillRect(-1,-6, 2, 5);
        ctx.fillRect( 2,-5, 2, 4);
        break;
    }
    ctx.restore();
  }

  return {
    cursor:    0,
    options:   ['RESUME', 'GUIDE', 'QUIT TO TITLE'],

    reset() {
      this.cursor = 0;
      showGuide   = false;
      guideLine   = 0;
    },

    update() {
      if (showGuide) {
        /* B or START closes guide back to pause menu */
        if (INPUT.B.just || INPUT.START.just) {
          showGuide = false;
          return;
        }
        const maxScroll = Math.max(0, GUIDE_ENTRIES.length - VISIBLE);
        if (INPUT.DOWN.just) guideLine = Math.min(maxScroll, guideLine + 1);
        if (INPUT.UP.just)   guideLine = Math.max(0,         guideLine - 1);
        return;
      }

      /* Normal pause menu */
      if (INPUT.DOWN.just) this.cursor = (this.cursor + 1) % this.options.length;
      if (INPUT.UP.just)   this.cursor = (this.cursor - 1 + this.options.length) % this.options.length;
      if (INPUT.A.just || INPUT.START.just) {
        if (this.cursor === 0) { setState(STATE.PLAYING); return; }
        if (this.cursor === 1) { showGuide = true; guideLine = 0; return; }
        if (this.cursor === 2) { setState(STATE.TITLE); return; }
      }
      /* B always resumes */
      if (INPUT.B.just) { setState(STATE.PLAYING); }
    },

    draw(ctx) {
      /* Dim game world underneath */
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      ctx.fillRect(0, 0, NES.W, NES.H);

      if (showGuide) {
        this._drawGuide(ctx);
      } else {
        this._drawPause(ctx);
      }
    },

    _drawPause(ctx) {
      const PX = 64, PY = 70, PW = 128, PH = 80;
      drawNESPanel(ctx, PX, PY, PW, PH, {
        bg: '#090714', border: PAL.PALE_GOLD, hi: '#2a2040', corners: true,
      });

      drawPxText(ctx, 'PAUSED', NES.W/2, PY+8, 1, PAL.PALE_GOLD, 'center', true);

      ctx.fillStyle = PAL.BLOOD_RED;
      ctx.fillRect(PX+8, PY+17, PW-16, 1);

      this.options.forEach((opt, i) => {
        const sel   = i === this.cursor;
        const color = sel ? PAL.PALE_GOLD : PAL.HUD_TEXT;
        const ty    = PY + 26 + i * 15;
        if (sel && Math.floor(G.frame/15)%2===0) {
          drawPxText(ctx, '>', PX+10, ty, 1, PAL.CURSOR);
        }
        drawPxText(ctx, opt, NES.W/2, ty, 1, color, 'center', sel);
      });

      drawPxText(ctx, 'B=RESUME', NES.W/2, PY+PH-8, 1, '#2a2a3a', 'center');
    },

    _drawGuide(ctx) {
      /* Full-width guide panel */
      const PX = 4, PY = 4, PW = NES.W-8, PH = NES.H-HUD_H-8;
      drawNESPanel(ctx, PX, PY, PW, PH, {
        bg: '#05030c', border: PAL.PALE_GOLD, hi: '#1a1030', corners: true,
      });

      /* Title bar */
      drawPxText(ctx, 'GUIDE', NES.W/2, PY+6, 1, PAL.PALE_GOLD, 'center', true);
      ctx.fillStyle = PAL.BLOOD_RED;
      ctx.fillRect(PX+6, PY+14, PW-12, 1);

      /* Visible entries */
      const entryH  = 36;
      const startY  = PY + 18;
      const visible = GUIDE_ENTRIES.slice(guideLine, guideLine + VISIBLE);

      visible.forEach((entry, vi) => {
        const ey = startY + vi * entryH;

        if (entry.type === 'header') {
          /* Section header — full-width separator */
          ctx.fillStyle = '#1a1030';
          ctx.fillRect(PX+6, ey, PW-12, entryH - 2);
          ctx.fillStyle = PAL.BLOOD_RED;
          ctx.fillRect(PX+6, ey, PW-12, 1);
          drawPxText(ctx, entry.text, NES.W/2, ey+6, 1, PAL.FIRE_RED, 'center');
          ctx.fillStyle = PAL.BLOOD_RED;
          ctx.fillRect(PX+6, ey+entryH-3, PW-12, 1);
          return;
        }

        /* Entry row background */
        const rowAlpha = (vi + guideLine) % 2 === 0 ? '#0a0818' : '#0e0c1c';
        ctx.fillStyle = rowAlpha;
        ctx.fillRect(PX+6, ey, PW-12, entryH - 1);

        /* Icon box */
        const iconBoxX = PX + 10;
        const iconBoxY = ey + 4;
        ctx.fillStyle = '#181028';
        ctx.fillRect(iconBoxX, iconBoxY, 16, 16);
        ctx.fillStyle = '#2a1848';
        ctx.fillRect(iconBoxX, iconBoxY, 16, 1);
        ctx.fillRect(iconBoxX, iconBoxY, 1, 16);
        if (entry.icon) drawGuideIcon(ctx, entry.icon, iconBoxX+8, iconBoxY+8);

        /* Name + zone label */
        const textX = iconBoxX + 20;
        drawPxText(ctx, entry.name, textX, ey+5,  1, PAL.PALE_GOLD);
        drawPxText(ctx, entry.zone, textX, ey+13, 1, '#5a4878');

        /* Description lines */
        drawPxText(ctx, entry.desc1, textX, ey+21, 1, PAL.LIGHTGRAY);
        drawPxText(ctx, entry.desc2, textX, ey+29, 1, '#888898');
      });

      /* Scroll indicators */
      const maxScroll = Math.max(0, GUIDE_ENTRIES.length - VISIBLE);
      if (guideLine > 0) {
        drawPxText(ctx, '[UP]', NES.W/2, startY - 6, 1, PAL.MIDGRAY, 'center');
        /* Up arrow pixel art */
        ctx.fillStyle = PAL.MIDGRAY;
        ctx.fillRect(NES.W/2 - 1, startY - 8, 2, 1);
        ctx.fillRect(NES.W/2 - 3, startY - 7, 6, 1);
      }
      if (guideLine < maxScroll) {
        const bottomY = startY + VISIBLE * entryH + 2;
        ctx.fillStyle = PAL.MIDGRAY;
        ctx.fillRect(NES.W/2 - 3, bottomY,   6, 1);
        ctx.fillRect(NES.W/2 - 1, bottomY+1, 2, 1);
      }

      /* Scroll progress bar */
      const barH    = PH - 24;
      const barX    = PX + PW - 8;
      const barY    = PY + 18;
      ctx.fillStyle = '#1a1030';
      ctx.fillRect(barX, barY, 3, barH);
      if (maxScroll > 0) {
        const thumbH = Math.max(6, (VISIBLE / GUIDE_ENTRIES.length) * barH) | 0;
        const thumbY = barY + ((guideLine / maxScroll) * (barH - thumbH)) | 0;
        ctx.fillStyle = PAL.PALE_GOLD;
        ctx.fillRect(barX, thumbY, 3, thumbH);
      }

      /* Close hint */
      drawPxText(ctx, 'B=BACK', NES.W/2, PY+PH-6, 1, '#2a2a3a', 'center');
    },
  };
})();

/* ----------------------------------------------------------------
   15. MAIN RENDER DISPATCH
---------------------------------------------------------------- */
function render() {
  /* Always clear with black to avoid ghost frames */
  screenCtx.fillStyle = PAL.BLACK;
  screenCtx.fillRect(0, 0, NES.W, NES.H);

  /* imageSmoothingEnabled can be reset by fillRect on some browsers;
     re-assert it every frame to be safe */
  screenCtx.imageSmoothingEnabled = false;

  /* Screen shake — translate canvas before drawing game content */
  const { x: shakeX, y: shakeY } = Shake.offset();
  screenCtx.save();
  screenCtx.translate(shakeX, shakeY);

  switch (G.state) {
    case STATE.TITLE:   titleScreen.draw(screenCtx);        break;
    case STATE.INTRO:   introScreen.draw(screenCtx);        break;
    case STATE.PLAYING: playingPlaceholder.draw(screenCtx); break;
    case STATE.LORE_READ:
      playingPlaceholder.draw(screenCtx);   /* game frozen behind the panel */
      break;
    case STATE.PAUSED:
      playingPlaceholder.draw(screenCtx);
      pauseScreen.draw(screenCtx);
      break;
    case STATE.DEAD:    deadScreen.draw(screenCtx);         break;
    case STATE.WIN:     winScreen.draw(screenCtx);          break;
  }

  screenCtx.restore();

  /* Lore panel sits outside the shake transform — stays readable during hits */
  if (G.state === STATE.PLAYING || G.state === STATE.PAUSED || G.state === STATE.LORE_READ) {
    lorePanel.draw(screenCtx);
  }

  drawDebug();
}


/* ----------------------------------------------------------------
   16. MAIN UPDATE DISPATCH
---------------------------------------------------------------- */
function update() {
  pollGamepad();
  G.stateTimer++;
  G.frame++;
  Shake.update();
  lorePanel.update();

  switch (G.state) {
    case STATE.TITLE:     titleScreen.update();        break;
    case STATE.INTRO:     introScreen.update();        break;
    case STATE.PLAYING:   playingPlaceholder.update(); break;
    case STATE.LORE_READ: lorePanel.updateDismiss();   break;
    case STATE.PAUSED:    pauseScreen.update();        break;
    case STATE.DEAD:      deadScreen.update();         break;
    case STATE.WIN:       winScreen.update();          break;
  }
  /* inputFlush moved to gameLoop — called once per rAF, not per logic step */
}


/* ----------------------------------------------------------------
   17. MAIN LOOP
   Fixed-timestep accumulator — keeps logic at exactly 60fps
   regardless of display refresh rate.
   Render is called once per rAF tick (uncapped visually,
   but game logic is always 60Hz).
---------------------------------------------------------------- */
let lastTime    = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  /* First frame guard */
  if (!lastTime) { lastTime = timestamp; }

  const dt = Math.min(timestamp - lastTime, 100); /* cap at 100ms to prevent spiral-of-death */
  lastTime  = timestamp;
  accumulator += dt;

  while (accumulator >= NES.FRAME_MS) {
    update();
    accumulator -= NES.FRAME_MS;
  }

  inputFlush();   /* once per rAF — preserves .just flags across catch-up steps */
  render();
}

requestAnimationFrame(gameLoop);

/* ================================================================
   SECTION 5 — THE HAND (STALKER SYSTEM)
   GDD spec:
   - Spawns off-screen, crawls toward player via fingertips
   - 70% of player run speed
   - Climbs walls + ceilings — never fully blocked by terrain
   - Touch = 2 hearts + sent back to spawn
   - Any weapon stuns it 3 seconds (180fr)
   - Sound cue before appearing (handled in Section 8 stub)
   - Spawn triggers: 90s in room, player death+respawn,
     certain lore items, Zone 5 always-active
================================================================ */

/* ----------------------------------------------------------------
   S5-A. HAND CONSTANTS
---------------------------------------------------------------- */
const HAND = Object.freeze({
  W:          32,   /* hitbox width  — visual is larger */
  H:          24,   /* hitbox height */
  SPEED:      1.05, /* 70% of player WALK(1.5) */
  STUN_DUR:   180,  /* 3 seconds @ 60fps */
  ROOM_TIMER: 5400, /* 90 seconds @ 60fps */
  CONTACT_DMG: 2,
  WARN_DIST:  96,   /* pixels from player that triggers the warning SFX stub */
});

/* ----------------------------------------------------------------
   S5-B. THE HAND OBJECT
   Attached to G.theHand when active.
   Navigates by steering toward the player along whichever axis
   gives the shortest path — always prefer closing the gap.
   Wall/ceiling climbing: velocity is not zeroed by solid tiles;
   instead we use a slide-around approach that lets The Hand
   flow around geometry without getting stuck.
---------------------------------------------------------------- */
const TheHand = {
  /* --- state --- */
  active:     false,   /* is The Hand currently chasing the player? */
  visible:    false,   /* is it on-screen / drawn? */
  x: 0, y: 0,         /* world position (hitbox top-left) */
  w: HAND.W, h: HAND.H,
  vx: 0, vy: 0,

  stunTimer:  0,       /* frames of stun remaining */
  warnTimer:  0,       /* counts up to WARN_DIST warning */
  roomTimer:  0,       /* frames player has been in current room */
  alwaysActive: false, /* set true for Zone 5 */

  /* animation */
  animFrame:  0,
  animTimer:  0,
  crawlPhase: 0,       /* 0=fingers, 1=drag */

  /* --- public API --- */

  reset() {
    this.active           = false;
    this.visible          = false;
    this.stunTimer        = 0;
    this.roomTimer        = 0;
    this.warnTimer        = 0;
    this.alwaysActive     = false;
    this._diedThisSession = false;
    this._respawnGrace    = 0;
    if (DEBUG) console.log('[hand] reset');
  },

  /** Called when player enters a new zone */
  onZoneEnter(zoneId) {
    this.roomTimer    = 0;
    this.alwaysActive = (zoneId === ZONE_ID.THRONE);
    if (zoneId === ZONE_ID.BOSS) { this.active = false; this.visible = false; return; }
    if (this.alwaysActive || this._diedThisSession) {
      this._diedThisSession = false;
      if (this.alwaysActive) {
        this._spawn();
      } else {
        /* BUG-02: 3s grace period before Hand appears after death */
        this._respawnGrace = 180;
        this.active  = false;
        this.visible = false;
      }
    } else {
      this.active  = false;
      this.visible = false;
      this._respawnGrace = 0;
    }
  },

  /** Triggered by lore pickup that disturbs something */
  disturbByLore() {
    if (!this.active) this._spawn();
  },

  /** Called when player dies — deactivate Hand so it doesn't show on
      death screen. Flag so it spawns on next onZoneEnter (respawn). */
  onPlayerDeath() {
    /* GDD: "Spawn trigger: player death+respawn" — respawn = return to play.
       Deactivate now so Hand never appears on death/title screens.
       _diedThisSession flag makes onZoneEnter spawn it when play resumes.
       Also park Hand off-screen so a mid-crawl position can't cause an
       instant hit when the grace period ends. */
    this._diedThisSession = true;
    this.active  = false;
    this.visible = false;
    this.stunTimer = 0;
    this.x = -HAND.W - 64;
    this.y = -HAND.H - 64;
    this.vx = 0;
    this.vy = 0;
    if (DEBUG) console.log('[hand] player died — will spawn on respawn via onZoneEnter');
  },

  /** Stun The Hand (weapon hit) */
  stun() {
    this.stunTimer = HAND.STUN_DUR;
    if (DEBUG) console.log('[hand] stunned');
  },

  /** Spawn The Hand off-screen behind the player */
  _spawn() {
    const p = G.player;
    const camX = G.camera ? G.camera.x : 0;
    const camY = G.camera ? G.camera.y : 0;

    /* Choose the edge farthest from the player */
    if (p) {
      const fromLeft = p.x < (camX + NES.W / 2);
      this.x = fromLeft ? camX - HAND.W - 8 : camX + NES.W + 8;
      this.y = p.y;
    } else {
      this.x = -HAND.W - 8;
      this.y = 0;
    }
    this.vx      = 0;
    this.vy      = 0;
    this.active  = true;
    this.visible = true;
    this.stunTimer = 0;
    if (DEBUG) console.log(`[hand] spawned at (${this.x|0}, ${this.y|0})`);
  },

  /** Per-frame update — called from updateEnemies hook */
  update() {
    /* BUG-02: tick respawn grace period */
    if (this._respawnGrace > 0) {
      this._respawnGrace--;
      if (this._respawnGrace === 0) this._spawn();
      return;
    }

    if (!this.active) {
      if (!this.alwaysActive && G.state === STATE.PLAYING) {
        this.roomTimer++;
        if (this.roomTimer >= HAND.ROOM_TIMER) {
          this._spawn();
        }
      }
      return;
    }

    /* Stun countdown */
    if (this.stunTimer > 0) {
      this.stunTimer--;
      /* Animate in place — fingers twitch */
      if (++this.animTimer >= 8) { this.animTimer = 0; this.animFrame++; }
      return;
    }

    const p = G.player;
    if (!p || p.hp <= 0) return;

    const pcx = p.x + (p.w >> 1);
    const pcy = p.y + (p.h >> 1);
    const hcx = this.x + (this.w >> 1);
    const hcy = this.y + (this.h >> 1);

    const dx = pcx - hcx;
    const dy = pcy - hcy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    /* Steering — normalise and apply speed */
    if (dist > 1) {
      const nx = dx / dist;
      const ny = dy / dist;
      /* The Hand steers at full HAND.SPEED, blended with current velocity
         for a smooth, organic crawl rather than teleporting. */
      this.vx = this.vx * 0.7 + nx * HAND.SPEED * 0.3 + nx * HAND.SPEED * 0.7;
      this.vy = this.vy * 0.7 + ny * HAND.SPEED * 0.3 + ny * HAND.SPEED * 0.7;

      /* Clamp to max speed */
      const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (spd > HAND.SPEED) {
        this.vx = (this.vx / spd) * HAND.SPEED;
        this.vy = (this.vy / spd) * HAND.SPEED;
      }
    }

    /* The Hand climbs walls and ceilings — NO tile collision clamping.
       It steers around geometry by slightly deflecting velocity when it
       detects a solid tile in its path. This keeps it moving and
       never getting permanently blocked. */
    const md = G.currentZoneId ? ZONES[G.currentZoneId].mapData : null;
    if (md) {
      const nxtX = this.x + this.vx;
      const nxtY = this.y + this.vy;
      const cx   = ((nxtX + this.w * 0.5) / NES.TILE) | 0;
      const cy   = ((nxtY + this.h * 0.5) / NES.TILE) | 0;
      if (tileIsSolid(tileAt(md, cx, cy))) {
        /* Deflect: try moving only along the axis that's less blocked */
        const cxH = ((this.x + this.vx + this.w * 0.5) / NES.TILE) | 0;
        const cyV = ((this.y + this.vy + this.h * 0.5) / NES.TILE) | 0;
        const blockedH = tileIsSolid(tileAt(md, cxH, ((this.y + this.h * 0.5) / NES.TILE) | 0));
        const blockedV = tileIsSolid(tileAt(md, ((this.x + this.w * 0.5) / NES.TILE) | 0, cyV));
        if (blockedH && !blockedV) {
          this.vx *= -0.3;   /* bounce off horizontal wall lightly */
        } else if (blockedV && !blockedH) {
          this.vy *= -0.3;
        } else {
          /* Both blocked — slide diagonally */
          this.vx *= 0.6;
          this.vy *= 0.6;
        }
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    /* Contact damage to player */
    if (aabbOverlap(this, p) && p.hp > 0) {
      damagePlayer(HAND.CONTACT_DMG, this.x + this.w * 0.5);
      /* Send Hand back to spawn after touching player */
      this._spawn();
      return;
    }

    /* Check if player weapon is hitting The Hand */
    const hitbox = getAttackHitbox(p);
    if (hitbox && aabbOverlap(hitbox, this) && !this.stunTimer) {
      this.stun();
    }

    /* Crawl animation */
    if (++this.animTimer >= 6) { this.animTimer = 0; this.animFrame++; }

    /* Warning tick — fires once when hand first comes within warn range */
    if (dist < HAND.WARN_DIST && this.warnTimer === 0) {
      this.warnTimer = 1;  /* Section 8 audio picks this up */
    }
  },

  /** Draw The Hand — 32×24 crawling hand sprite */
  draw(ctx) {
    if (!this.active || !this.visible) return;

    const sx = Math.round(this.x - Camera.x);
    const sy = Math.round(this.y - Camera.y);

    /* Off-screen culling */
    if (sx + this.w < -8 || sx > NES.W + 8 ||
        sy + this.h < -8 || sy > NES.H + 8) return;

    /* Stun flicker */
    if (this.stunTimer > 0 && (this.stunTimer % 6) < 3) return;

    const f      = this.animFrame % 4;   /* 4 crawl frames */
    const C1     = PAL.STONE_MID;        /* palm base */
    const C2     = PAL.STONE_HIGH;       /* knuckle highlight */
    const C3     = PAL.STONE_DARK;       /* shadow / fingernail */
    const CBONE  = PAL.LIGHTGRAY;        /* bone protrusion */

    ctx.save();
    ctx.translate(sx, sy);

    /* ── Palm ── large rectangular mass */
    ctx.fillStyle = C1;
    ctx.fillRect(8, 8, 20, 14);

    /* ── Palm detail — cross-hatch cracks ── */
    ctx.fillStyle = C3;
    ctx.fillRect(10, 12, 16, 1);
    ctx.fillRect(16,  9, 1,  6);

    /* ── Knuckle ridge ── */
    ctx.fillStyle = C2;
    ctx.fillRect(8, 8, 20, 2);

    /* ── Fingers — 5 fingers, animated crawl ── */
    /* Crawl phases alternate which finger-set is raised */
    const raisedA = (f === 0 || f === 1);   /* fingers 1,3,5 */
    const raisedB = (f === 2 || f === 3);   /* fingers 2,4   */

    const fingers = [
      { x: 8,  w: 4, even: false },
      { x: 12, w: 4, even: true  },
      { x: 16, w: 4, even: false },
      { x: 20, w: 4, even: true  },
      { x: 24, w: 4, even: false },
    ];

    fingers.forEach(({ x: fx, w: fw, even }) => {
      const raised = even ? raisedB : raisedA;
      const fy     = raised ? 0 : 4;
      ctx.fillStyle = C1;
      ctx.fillRect(fx, fy, fw, 10);
      /* knuckle */
      ctx.fillStyle = C2;
      ctx.fillRect(fx, fy, fw, 2);
      /* nail */
      ctx.fillStyle = C3;
      ctx.fillRect(fx + 1, fy, fw - 2, 2);
      /* bone tip */
      ctx.fillStyle = CBONE;
      ctx.fillRect(fx + 1, fy - 2, fw - 2, 2);
    });

    /* ── Thumb — stubby, left side ── */
    const thumbY = raisedA ? 6 : 9;
    ctx.fillStyle = C1;
    ctx.fillRect(2, thumbY, 6, 8);
    ctx.fillStyle = C2;
    ctx.fillRect(2, thumbY, 6, 2);
    ctx.fillStyle = CBONE;
    ctx.fillRect(3, thumbY - 2, 4, 2);

    /* ── Wrist trailing-off ── */
    ctx.fillStyle = C1;
    ctx.fillRect(10, 20, 14, 4);
    ctx.fillStyle = C3;
    ctx.fillRect(10, 22, 14, 2);

    ctx.restore();

    /* ── Stun indicator ── stars above the hand */
    if (this.stunTimer > 0) {
      const starT = this.stunTimer;
      for (let s = 0; s < 3; s++) {
        const angle = (G.frame * 0.15 + s * (Math.PI * 2 / 3));
        const starX = sx + 16 + Math.cos(angle) * 8;
        const starY = sy - 4  + Math.sin(angle) * 4;
        ctx.fillStyle = PAL.PALE_GOLD;
        ctx.fillRect(starX | 0, starY | 0, 2, 2);
      }
    }
  },
};

/* Extend WEAPON_DEF with new weapons.
   WEAPON_DEF is frozen, so we build a new mutable copy. */
const WEAPON_DEF_EXT = Object.assign({}, WEAPON_DEF, {
  cursed_dagger: {
    reach:      56,    /* projectile range in pixels            */
    yOff:        4,    /* fires at waist height                 */
    arcH:        8,    /* narrow hitbox — hits low / crawlers   */
    recovery:   14,    /* fastest non-sword weapon              */
    damage:      1,
    projectile:  true, /* flag: spawns a projectile entity      */
  },
  holy_axe: {
    reach:      40,    /* initial forward throw                 */
    yOff:      -18,    /* starts high                           */
    arcH:       28,    /* tall arc — sweeps from high to floor  */
    recovery:   36,    /* slow arc, high commitment             */
    damage:      2,    /* two damage — destroys flying enemies  */
    projectile:  true,
    arcThrow:    true, /* flag: parabolic arc, hits high-then-low */
  },
  void_scythe: {
    reach:      36,
    yOff:       -6,
    arcH:       32,    /* wide vertical sweep — both directions */
    recovery:   24,
    damage:      2,
    bothDirs:    true, /* hits left AND right simultaneously    */
  },
});

/* Patch getWeaponDef and getAttackHitbox to use the extended table */
getWeaponDef = function(player) {
  return WEAPON_DEF_EXT[player.weapons[player.weaponIdx]] || WEAPON_DEF_EXT.sword;
}

/* Projectile system — projectiles are short-lived world entities */
const projectiles = [];

function spawnProjectile(player) {
  const wdef = getWeaponDef(player);
  if (!wdef.projectile) return;

  if (wdef.arcThrow) {
    /* Holy Axe — arcing throw */
    projectiles.push({
      type:    'axe',
      x:       player.x + (player.facing === 1 ? player.w : -12),
      y:       player.y + wdef.yOff,
      vx:      player.facing * 2.5,
      vy:      -3.5,
      w: 10, h: 10,
      damage:  wdef.damage,
      life:    90,
      owner:   'player',
      swingId: player.swingId,
      rotation: 0,
    });
  } else {
    /* Cursed Dagger — straight shot */
    projectiles.push({
      type:    'dagger',
      x:       player.x + (player.facing === 1 ? player.w : -wdef.reach),
      y:       player.y + player.h * 0.5 + wdef.yOff,
      vx:      player.facing * 4.5,
      vy:      0,
      w:       8, h: 4,
      damage:  wdef.damage,
      life:    40,
      owner:   'player',
      swingId: player.swingId,
    });
  }
}

function updateProjectiles() {
  const zone = G.currentZoneId ? ZONES[G.currentZoneId] : null;
  const md   = zone ? zone.mapData : null;
  const p    = G.player;

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.life--;
    pr.x += pr.vx;
    pr.y += pr.vy;

    if (pr.type === 'axe') {
      pr.vy    += 0.22;   /* gravity on axe */
      pr.rotation = (pr.rotation || 0) + (pr.vx > 0 ? 0.2 : -0.2);
    }

    /* Remove if expired or hits solid tile */
    if (pr.life <= 0) { projectiles.splice(i, 1); continue; }
    if (md) {
      const tx = (pr.x / NES.TILE) | 0;
      const ty = (pr.y / NES.TILE) | 0;
      if (tileIsSolid(tileAt(md, tx, ty))) {
        projectiles.splice(i, 1); continue;
      }
    }

    /* Hit enemies */
    if (zone && zone.enemies) {
      for (const e of zone.enemies) {
        if (e.dead || e.state === 'hurt') continue;
        if (e.lastHitSwing === pr.swingId) continue;
        if (aabbOverlap(pr, e)) {
          e.lastHitSwing = pr.swingId;
          enemyTakeDamage(e, pr.damage, pr.x);
          projectiles.splice(i, 1); break;
        }
      }
    }

    /* Projectiles also hit The Hand */
    if (G.theHand && G.theHand.active && !G.theHand.stunTimer) {
      if (aabbOverlap(pr, G.theHand)) {
        G.theHand.stun();
        projectiles.splice(i, 1); continue;
      }
    }
  }
}

function drawProjectiles(ctx) {
  for (const pr of projectiles) {
    const sx = (pr.x - Camera.x) | 0;
    const sy = (pr.y - Camera.y) | 0;

    ctx.save();
    if (pr.type === 'axe') {
      ctx.translate(sx + 5, sy + 5);
      ctx.rotate(pr.rotation || 0);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(-4, -1, 8, 2);    /* axe shaft */
      ctx.fillStyle = PAL.PALE_GOLD;
      ctx.fillRect(-1, -4, 2, 8);    /* axe head vertical */
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(-1, -4, 2, 2);    /* glint */
    } else {
      /* Dagger */
      ctx.fillStyle = PAL.CLOAK_LITE;
      ctx.fillRect(sx, sy, 6, 2);    /* blade */
      ctx.fillStyle = PAL.STONE_HIGH;
      ctx.fillRect(sx + 6, sy - 1, 2, 4);  /* handle guard */
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(sx, sy, 1, 1);    /* tip glint */
    }
    ctx.restore();
  }
}

/* Patch playerUpdate to spawn projectiles on attack */
const _origPlayerUpdate = playerUpdate;
playerUpdate = function() {
  const p = G.player;
  if (!p) return;
  const prevAttack = p.attackTimer;
  _origPlayerUpdate();
  /* Detect the frame attack was just started (timer went from 0 to recovery) */
  const wdef = getWeaponDef(p);
  if (p.attackTimer > 0 && prevAttack === 0 && wdef.projectile) {
    spawnProjectile(p);
  }

  /* Void Scythe — both directions simultaneously */
  if (p.attackTimer > 0 && prevAttack === 0 && wdef.bothDirs) {
    /* Already handled by wide hitbox in getAttackHitbox — no extra projectile */
  }
}

/* Extend getAttackHitbox for void scythe both-dirs and standard melee */
const _origGetAttackHitbox = getAttackHitbox;
getAttackHitbox = function(player) {
  if (!player || player.attackTimer <= 0) return null;
  const def = getWeaponDef(player);
  if (def.projectile) return null;  /* projectile weapons: hitbox is the projectile */

  if (def.bothDirs) {
    /* Void Scythe — wide sweep centered on player */
    return {
      x: player.x - def.reach,
      y: player.y + (player.h >> 1) + def.yOff,
      w: player.w + def.reach * 2,
      h: def.arcH,
    };
  }

  /* Standard melee */
  const hbx = player.facing === 1
    ? player.x + player.w
    : player.x - def.reach;
  return {
    x: hbx,
    y: player.y + (player.h >> 1) + def.yOff,
    w: def.reach,
    h: def.arcH,
  };
}

/* ----------------------------------------------------------------
   Atmospheric decorations for Zone 2: The Crypt
   Baked into the static canvas — dripping water, grave markers.
---------------------------------------------------------------- */
function drawCryptDecorations(ctx, cols) {
  const T    = NES.TILE;
  const zpal = ZONE_PAL[ZONE_ID.CRYPT];

  /* ── Stalactites — dark blue stone dripping from ceiling ── */
  [4, 12, 22, 32, 44, 54].forEach(col => {
    const dx = col * T + 6;
    ctx.fillStyle = zpal.solidTop;
    ctx.fillRect(dx,     T * 2,      4, 3);
    ctx.fillRect(dx + 1, T * 2 + 3,  2, 4);
    ctx.fillRect(dx + 1, T * 2 + 7,  2, 2);
    ctx.fillRect(dx + 1, T * 2 + 9,  2, 1);
    /* Drip — bright blue water bead */
    ctx.fillStyle = zpal.platformTop;
    ctx.fillRect(dx + 2, T * 2 + 8, 1, 6);
    ctx.fillRect(dx + 2, T * 2 + 14, 2, 2);
  });

  /* ── Grave marker niches ── */
  [[1, 2], [1, 5]].forEach(([col, row]) => {
    const nx = col * T, ny = row * T;
    ctx.fillStyle = zpal.solidShad;
    ctx.fillRect(nx + 2, ny + 2, 10, 12);
    ctx.fillRect(nx + 4, ny,     6,  3);
    ctx.fillRect(nx + 6, ny - 2, 2,  2);
    ctx.fillStyle = zpal.solidTop;
    ctx.fillRect(nx + 1, ny + 2, 2,  12);
    ctx.fillRect(nx + 11,ny + 2, 2,  12);
    ctx.fillRect(nx + 2, ny + 1, 10, 2);
    /* Grave cross */
    ctx.fillStyle = zpal.platformTop;
    ctx.fillRect(nx + 6, ny + 5, 2, 6);
    ctx.fillRect(nx + 4, ny + 7, 6, 2);
    /* Eye sockets on skull */
    ctx.fillStyle = zpal.solidBase;
    ctx.fillRect(nx + 5, ny + 10, 4, 3);
    ctx.fillStyle = zpal.solidShad;
    ctx.fillRect(nx + 6, ny + 11, 1, 1);
    ctx.fillRect(nx + 8, ny + 11, 1, 1);
  });

  /* ── Bone piles ── */
  [[9, 9], [18, 9], [29, 9]].forEach(([col, row]) => {
    const bx = col * T, by = row * T - 4;
    ctx.fillStyle = PAL.LIGHTGRAY;
    ctx.fillRect(bx,     by + 2, 8, 2);
    ctx.fillRect(bx + 2, by,     2, 5);
    ctx.fillStyle = PAL.MIDGRAY;
    ctx.fillRect(bx + 5, by + 3, 6, 2);
    ctx.fillRect(bx + 6, by + 1, 2, 4);
    /* Skull */
    ctx.fillStyle = PAL.LIGHTGRAY;
    ctx.fillRect(bx + 8, by,     5, 4);
    ctx.fillRect(bx + 9, by + 4, 3, 2);
    ctx.fillStyle = PAL.DARKGRAY;
    ctx.fillRect(bx + 9, by + 1, 1, 2);
    ctx.fillRect(bx +11, by + 1, 1, 2);
  });

  /* ── Water stain streaks on walls ── */
  ctx.fillStyle = zpal.solidTop;
  [2, 16, 36, 52].forEach(col => {
    const wx = col * T + T - 2;
    for (let seg = 0; seg < 5; seg++) {
      ctx.fillRect(wx, T * 2 + seg * 14, 1, 10 + (seg % 3));
    }
  });

  /* ── Floor cracks ── */
  ctx.fillStyle = zpal.solidShad;
  [6, 15, 26, 38, 50].forEach(col => {
    const fx = col * T, fy = 9 * T;
    ctx.fillRect(fx + 2, fy + 4, 8, 1);
    ctx.fillRect(fx + 6, fy + 2, 1, 5);
    ctx.fillRect(fx + 8, fy + 5, 4, 1);
  });

  /* ── Moss smears on lower walls ── */
  ctx.fillStyle = zpal.solidBase;
  [3, 20, 40, 58].forEach(col => {
    const mx = col * T, my = 8 * T;
    ctx.fillRect(mx,     my + 4, T + 4, 3);
    ctx.fillRect(mx + 2, my + 2, T,     2);
    ctx.fillRect(mx + 4, my + 6, T - 2, 2);
  });
}

/* Patch the DOOR_D trigger handling in checkPlayerTiles */
const _origCheckPlayerTiles = checkPlayerTiles;
checkPlayerTiles = function() {
  const p  = G.player;
  if (!p) return;
  const md = G.currentZoneId ? ZONES[G.currentZoneId].mapData : null;
  if (!md) return;

  const tx0 = Math.max(0,          ( p.x              / NES.TILE) | 0);
  const tx1 = Math.min(md.cols-1, ((p.x + p.w - 1)   / NES.TILE) | 0);
  const ty0 = Math.max(0,          ( p.y              / NES.TILE) | 0);
  const ty1 = Math.min(md.rows-1, ((p.y + p.h - 1)   / NES.TILE) | 0);

  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const idx = ty * md.cols + tx;
      const id  = md.data[idx];
      if (!id) continue;
      const props = TILE_PROPS[id];
      if (!props) continue;

      if (props.hazard) {
        damagePlayer(1, tx * NES.TILE + 8);
        if (G.state !== STATE.PLAYING) return;
      }

      /* Weapon pickup — generic: zone declares which weapon it gives */
      if (id === T.WEAPON) {
        const zone     = ZONES[G.currentZoneId];
        const wName    = zone.weaponPickup || 'bone_whip';
        if (!p.weapons.includes(wName)) {
          p.weapons.push(wName);
          G.collectedWeapons.add(wName);
          p.notifyText  = wName.toUpperCase().replace(/_/g, ' ');
          p.notifyTimer = 120;
        }
        md.data[idx] = T.AIR;
      }

      if (props.trigger === 'door_l' && p.vx < -0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.left;
        if (dest) { transitionZone(dest); return; }
      }
      if (props.trigger === 'door_r' && p.vx > 0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.right;
        if (dest) { transitionZone(dest); return; }
      }
      if (props.trigger === 'door_up' && p.vy < -0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.up;
        if (dest) { transitionZone(dest); return; }
      }
      if (props.trigger === 'door_d' && p.vy > 0.5) {
        const dest = ZONES[G.currentZoneId]?.connects?.down;
        if (dest) {
          /* Boss door: require all lore, but allow entry at 5/6 to prevent
             soft-lock in case a fragment fails to register. */
          if (dest === ZONE_ID.BOSS && G.loreCollected.size < TOTAL_LORE) {
            const missing = TOTAL_LORE - G.loreCollected.size;
            if (missing > 1) {
              /* Hard block — still genuinely missing fragments */
              p.notifyText  = 'FIND ALL FRAGMENTS  ' + G.loreCollected.size + '/' + TOTAL_LORE;
              p.notifyTimer = 120;
            } else {
              /* Exactly 1 missing — allow entry with a warning.
                 Set notifyText AFTER transitionZone so it lands on
                 the new player object (initPlayer resets notifyText). */
              transitionZone(dest);
              if (G.player) {
                G.player.notifyText  = 'SOMETHING IS WRONG. ENTER ANYWAY.';
                G.player.notifyTimer = 120;
              }
              return;
            }
          } else {
            transitionZone(dest); return;
          }
        }
      }

      if (id === T.LORE) {
        const zone   = ZONES[G.currentZoneId];
        const lLines = zone.loreTexts && zone.loreTexts.get(idx);
        const key    = G.currentZoneId + ':' + idx;
        G.loreCollected.add(key);
        md.data[idx] = T.AIR;
        if (zone.disturbLoreIdx && zone.disturbLoreIdx.has(idx)) {
          TheHand.disturbByLore();
        }
        lorePanel.show(lLines || ['LORE FOUND']);
        return;  /* state is now LORE_READ — stop processing tiles */
      }











      if (p.y > md.rows * NES.TILE + 32) {
        p.hp = 0; setState(STATE.DEAD);
      }
    }
  }

  if (p.y > md.rows * NES.TILE + 32) {
    p.hp = 0; setState(STATE.DEAD);
  }
}

/* Clocktower atmospheric decorations */
function drawClockDecorations(ctx, cols) {
  const T    = NES.TILE;
  const zpal = ZONE_PAL[ZONE_ID.CLOCK];

  /* ── Large clock face — centre, rows 8-9 ── */
  const cx = 22 * T + T, cy = 8 * T + 4, R = 18;
  /* Dial body */
  ctx.fillStyle = zpal.solidBase;
  for (let dy = -R; dy <= R; dy++) {
    const hw = Math.sqrt(Math.max(0, R*R - dy*dy)) | 0;
    ctx.fillRect(cx - hw, cy + dy, hw*2, 1);
  }
  /* Dial ring */
  ctx.fillStyle = zpal.solidTop;
  for (let a = 0; a < 32; a++) {
    const ang = (a / 32) * Math.PI * 2;
    ctx.fillRect((cx + Math.cos(ang)*(R-1))|0, (cy + Math.sin(ang)*(R-1))|0, 2, 2);
  }
  /* Hour markers */
  ctx.fillStyle = zpal.platformTop;
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const sz  = (i % 3 === 0) ? 2 : 1;
    ctx.fillRect((cx + Math.cos(ang)*(R-4))|0, (cy + Math.sin(ang)*(R-4))|0, sz, sz);
  }
  /* Hands stopped at 3:00 */
  ctx.fillStyle = zpal.solidTop;
  ctx.fillRect(cx, cy - 1, R - 5, 2);      /* hour → 3 */
  ctx.fillStyle = zpal.platformTop;
  ctx.fillRect(cx - 1, cy - R + 5, 2, R - 5); /* minute ↑ 12 */
  /* Centre pin */
  ctx.fillStyle = PAL.PALE_GOLD;
  ctx.fillRect(cx - 1, cy - 1, 3, 3);

  /* ── Three gears ── */
  [[6*T, 8*T, 12], [36*T, 9*T, 10], [14*T, 5*T, 8]].forEach(([gx, gy, gr]) => {
    ctx.fillStyle = zpal.solidTop;
    for (let tooth = 0; tooth < 8; tooth++) {
      const ang = (tooth / 8) * Math.PI * 2;
      ctx.fillRect((gx + Math.cos(ang)*(gr+2) - 2)|0, (gy + Math.sin(ang)*(gr+2) - 2)|0, 4, 4);
    }
    ctx.fillStyle = zpal.solidBase;
    for (let dy = -gr; dy <= gr; dy++) {
      const hw = Math.sqrt(Math.max(0, gr*gr - dy*dy)) | 0;
      ctx.fillRect(gx - hw, gy + dy, hw*2, 1);
    }
    ctx.fillStyle = zpal.solidTop;
    for (let s = 0; s < 4; s++) {
      const ang = (s / 4) * Math.PI * 2;
      ctx.fillRect((gx + Math.cos(ang)*(gr*0.5) - 1)|0, (gy + Math.sin(ang)*(gr*0.5) - 1)|0, 2, 2);
    }
    ctx.fillStyle = PAL.PALE_GOLD;
    ctx.fillRect(gx - 2, gy - 2, 4, 4);
    ctx.fillStyle = PAL.WHITE;
    ctx.fillRect(gx - 1, gy - 1, 2, 2);
  });

  /* ── Pendulum housing on left wall ── */
  ctx.fillStyle = zpal.solidShad;
  ctx.fillRect(T, 4*T,  8, 8*T);
  ctx.fillStyle = zpal.solidTop;
  ctx.fillRect(T, 4*T,  8, 2);
  ctx.fillRect(T, 12*T, 8, 2);
  ctx.fillStyle = zpal.solidBase;
  ctx.fillRect(T - 4, 10*T, 16, 8);
  ctx.fillStyle = zpal.solidTop;
  ctx.fillRect(T - 4, 10*T, 16, 2);
  ctx.fillStyle = PAL.PALE_GOLD;
  ctx.fillRect(T, 10*T + 2, 8, 4);

  /* ── Chain links on right wall ── */
  ctx.fillStyle = zpal.solidBase;
  for (let cy2 = 2*T; cy2 < 14*T; cy2 += 8) {
    ctx.fillRect(cols*T - 2*T + 4, cy2,     8, 4);
    ctx.fillRect(cols*T - 2*T + 6, cy2 + 4, 4, 4);
  }

  /* ── Gear debris on platforms ── */
  ctx.fillStyle = zpal.solidBase;
  [[8,8],[16,8],[30,8],[40,8]].forEach(([col, row]) => {
    const dx = col * T, dy = row * T - 4;
    ctx.fillRect(dx,     dy + 2, 6, 2);
    ctx.fillRect(dx + 2, dy,     2, 6);
    ctx.fillRect(dx + 2, dy + 2, 2, 2);
    ctx.fillStyle = PAL.PALE_GOLD;
    ctx.fillRect(dx + 3, dy + 3, 1, 1);
    ctx.fillStyle = zpal.solidBase;
  });
}
