  if (ENEMY_CFG[type]) return _origCreateEnemy(type, tx, ty);
  const cfg = ENEMY_CFG_ALL[type];
  if (!cfg) { console.warn('[enemy] unknown type:', type); return null; }
  const wx = tx * NES.TILE;
  const wy = cfg.gravity ? ty * NES.TILE - cfg.h : ty * NES.TILE;
  const e = {
    type, x: wx, y: wy, w: cfg.w, h: cfg.h,
    vx: 0, vy: 0, facing: 1,
    hp: cfg.hp, maxHp: cfg.hp,
    state: 'patrol', stateTimer: 0,
    hurtTimer: 0, dead: false,
    animFrame: 0, animTimer: 0,
    lastHitSwing: -1,
    shootCooldown: cfg.shootCooldown || 0,
  };
  if (type === 'grave_worm') {
    e.baseY  = wy;
    e.riseY  = wy - 32;   /* how high it rises */
    e.rising = true;
  }
  if (type === 'ghost' || type === 'clockwork_bird') {
    e.baseX     = wx;
    e.baseY     = wy;
    e.animPhase = (tx * 0.37 + ty * 0.19) % (Math.PI * 2);
  }
  return e;
}

/* Enemy projectile pool (mech_construct shots) */
const enemyProjectiles = [];

function updateEnemyProjectiles() {
  const md = G.currentZoneId ? ZONES[G.currentZoneId].mapData : null;
  const p  = G.player;
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const pr = enemyProjectiles[i];
    pr.life--;
    pr.x += pr.vx;
    pr.y += pr.vy;
    if (pr.life <= 0) { enemyProjectiles.splice(i, 1); continue; }
    if (md && tileIsSolid(tileAt(md, (pr.x / NES.TILE) | 0, (pr.y / NES.TILE) | 0))) {
      enemyProjectiles.splice(i, 1); continue;
    }
    if (p && p.hp > 0 && aabbOverlap(pr, p)) {
      damagePlayer(1, pr.x);
      enemyProjectiles.splice(i, 1);
    }
  }
}

function drawEnemyProjectiles(ctx) {
  for (const pr of enemyProjectiles) {
    const sx = (pr.x - Camera.x) | 0;
    const sy = (pr.y - Camera.y) | 0;
    ctx.fillStyle = PAL.FIRE_RED;
    ctx.fillRect(sx, sy, 4, 4);
    ctx.fillStyle = PAL.PALE_GOLD;
    ctx.fillRect(sx + 1, sy + 1, 2, 2);
  }
}

/* ── Zone 2 enemy AI ── */
function updateEnemyCrawler(enemy, md, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++;
    enemy.vx *= 0.75; enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
    if (enemy.stateTimer >= 14) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.crawler;
  const pdx = player && player.hp > 0 ?
    (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1)) : 0;

  if (enemy.state === 'patrol') {
    enemy.vx = enemy.facing * cfg.speed;
    if (player && player.hp > 0 && Math.abs(pdx) < cfg.aggroRange) {
      enemy.facing = pdx > 0 ? 1 : -1;
      enemy.state  = 'chase';
    }
  } else if (enemy.state === 'chase') {
    if (player && player.hp > 0) enemy.facing = pdx > 0 ? 1 : -1;
    enemy.vx = enemy.facing * cfg.speed;
    if (!player || Math.abs(pdx) > cfg.aggroRange + 20) enemy.state = 'patrol';
  }

  enemy.vy += PHYS.GRAVITY;
  if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
  const res = resolveCollision(enemy, md);
  enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;

  if (res.hitWallL || res.hitWallR) { enemy.facing *= -1; enemy.vx = 0; }
  if (res.onGround && enemyWouldFall(enemy, enemy.facing, md)) enemy.facing *= -1;
  if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed;

  if (res.onGround && Math.abs(enemy.vx) > 0.1) {
    if (++enemy.animTimer >= 8) { enemy.animTimer = 0; enemy.animFrame++; }
  }
}

function updateEnemyGraveWorm(enemy, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++; enemy.vx *= 0.75; enemy.vy *= 0.85;
    enemy.x += enemy.vx; enemy.y += enemy.vy;
    if (enemy.stateTimer >= 12) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.grave_worm;
  /* Sine-bob vertical pattern */
  enemy.y = enemy.baseY + Math.sin(G.frame * 0.04 + (enemy.baseX * 0.1)) * 18;
  /* Chase player horizontally when in range */
  if (player && player.hp > 0) {
    const pdx = (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1));
    if (Math.abs(pdx) < cfg.aggroRange) {
      enemy.x += Math.sign(pdx) * cfg.speed;
      enemy.facing = pdx > 0 ? 1 : -1;
    }
  }
  if (++enemy.animTimer >= 10) { enemy.animTimer = 0; enemy.animFrame++; }
}

function updateEnemyGhost(enemy, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++; enemy.vx *= 0.8; enemy.vy *= 0.8;
    enemy.x += enemy.vx; enemy.y += enemy.vy;
    if (enemy.stateTimer >= 12) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.ghost;
  /* Phase flicker — every 120 frames, ghost becomes visible and chaseable */
  enemy.stateTimer++;
  const phase = Math.floor(enemy.stateTimer / 60) % 3;  /* 0=visible, 1=visible, 2=phased */
  enemy.phasing = (phase === 2);

  if (!enemy.phasing && player && player.hp > 0) {
    const dx = (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1));
    const dy = (player.y + (player.h >> 1)) - (enemy.y + (enemy.h >> 1));
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < cfg.aggroRange && dist > 1) {
      enemy.x += (dx / dist) * cfg.speed;
      enemy.y += (dy / dist) * cfg.speed;
      enemy.facing = dx > 0 ? 1 : -1;
    }
  }
  if (++enemy.animTimer >= 8) { enemy.animTimer = 0; enemy.animFrame++; }
}

/* ── Zone 3 enemy AI ── */
function updateEnemyMechConstruct(enemy, md, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++; enemy.vx *= 0.75; enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
    if (enemy.stateTimer >= 14) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.mech_construct;
  if (enemy.shootCooldown > 0) enemy.shootCooldown--;
  const hasPlayer = !!(player && player.hp > 0);
  const pdx = hasPlayer ? (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1)) : 0;
  const sameFloor = hasPlayer &&
    Math.abs((player.y + player.h) - (enemy.y + enemy.h)) < 40;

  if (enemy.state === 'patrol') {
    enemy.vx = enemy.facing * cfg.speed;
    if (hasPlayer && sameFloor && Math.abs(pdx) < cfg.aggroRange) {
      enemy.facing = pdx > 0 ? 1 : -1;
      enemy.state  = 'chase'; enemy.stateTimer = 0;
    }
  } else if (enemy.state === 'chase') {
    enemy.stateTimer++;
    if (hasPlayer) enemy.facing = pdx > 0 ? 1 : -1;
    enemy.vx = enemy.facing * cfg.speed;
    /* Shoot when in range */
    if (hasPlayer && Math.abs(pdx) < cfg.shootRange && enemy.shootCooldown <= 0) {
      enemyProjectiles.push({
        x: enemy.x + (enemy.facing === 1 ? enemy.w : -6),
        y: enemy.y + enemy.h * 0.4,
        vx: enemy.facing * 3.5, vy: 0,
        w: 4, h: 4, life: 60,
      });
      enemy.shootCooldown = cfg.shootCooldown;
      enemy.vx = 0;  /* brief pause on shoot */
    }
    if (!hasPlayer || !sameFloor) enemy.state = 'patrol';
  }

  enemy.vy += PHYS.GRAVITY;
  if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
  const res = resolveCollision(enemy, md);
  enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
  if (res.hitWallL || res.hitWallR) { enemy.facing *= -1; enemy.vx = 0; }
  if (res.onGround && enemyWouldFall(enemy, enemy.facing, md)) enemy.facing *= -1;
  if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed;
  if (res.onGround && Math.abs(enemy.vx) > 0.1) {
    if (++enemy.animTimer >= 10) { enemy.animTimer = 0; enemy.animFrame++; }
  }
}

function updateEnemyClockworkBird(enemy, player) {
  /* Reuse bat AI with slightly different params */
  const cfg = ENEMY_CFG_ALL.clockwork_bird;
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++; enemy.x += enemy.vx; enemy.y += enemy.vy;
    enemy.vx *= 0.8; enemy.vy *= 0.85;
    if (enemy.stateTimer >= 12) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'returning'; enemy.stateTimer = 0;
    }
    return;
  }
  if (enemy.state === 'returning') {
    const dx = enemy.baseX - enemy.x; const dy = enemy.baseY - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 5) { enemy.x = enemy.baseX; enemy.y = enemy.baseY; enemy.state = 'patrol'; }
    else { const spd = Math.min(2.5, dist * 0.07); enemy.x += (dx / dist) * spd; enemy.y += (dy / dist) * spd; enemy.facing = dx >= 0 ? 1 : -1; }
    if (++enemy.animTimer >= 5) { enemy.animTimer = 0; enemy.animFrame++; }
    return;
  }
  if (enemy.state === 'dive') {
    enemy.stateTimer++;
    if (player && player.hp > 0) {
      const targetCX = player.x + (player.w >> 1);
      const selfCX   = enemy.x  + (enemy.w  >> 1);
      enemy.vx += (targetCX - selfCX) * 0.05;
    }
    enemy.vx = Math.max(-4, Math.min(4, enemy.vx));
    enemy.x += enemy.vx; enemy.y += enemy.vy;
    enemy.facing = enemy.vx >= 0 ? 1 : -1;
    if (enemy.y > enemy.baseY + 110 || enemy.stateTimer > 70) {
      enemy.state = 'returning'; enemy.stateTimer = 0; enemy.vx = 0; enemy.vy = 0;
    }
    if (++enemy.animTimer >= 4) { enemy.animTimer = 0; enemy.animFrame++; }
    return;
  }
  const t = G.frame;
  enemy.x = enemy.baseX + Math.sin(t * 0.028 + enemy.animPhase) * cfg.ampX;
  enemy.y = enemy.baseY + Math.sin(t * 0.02  + enemy.animPhase * 1.5) * cfg.ampY;
  enemy.facing = Math.cos(t * 0.028 + enemy.animPhase) >= 0 ? 1 : -1;
  if (player && player.hp > 0) {
    const cx = enemy.x + (enemy.w >> 1); const pcx = player.x + (player.w >> 1);
    const dx = Math.abs(pcx - cx);
    const dy = (player.y + player.h) - (enemy.y + enemy.h);
    if (dx < 44 && dy > 0 && dy < cfg.aggroRange) {
      enemy.state = 'dive'; enemy.stateTimer = 0; enemy.vy = 2.8; enemy.vx = (pcx - cx) * 0.07;
    }
  }
  if (++enemy.animTimer >= 6) { enemy.animTimer = 0; enemy.animFrame++; }
}

function updateEnemyGearGolem(enemy, md, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 40) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++; enemy.vx *= 0.75; enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
    if (enemy.stateTimer >= 16) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.gear_golem;
  enemy.spinTimer = (enemy.spinTimer || 0) + 1;
  const hasPlayer = !!(player && player.hp > 0);
  const pdx = hasPlayer ? (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1)) : 0;
  const sameFloor = hasPlayer && Math.abs((player.y + player.h) - (enemy.y + enemy.h)) < 50;

  if (enemy.state === 'patrol') {
    enemy.vx = enemy.facing * cfg.speed;
    if (hasPlayer && sameFloor && Math.abs(pdx) < cfg.aggroRange) {
      enemy.facing = pdx > 0 ? 1 : -1; enemy.state = 'chase'; enemy.stateTimer = 0;
    }
  } else if (enemy.state === 'chase') {
    if (hasPlayer) enemy.facing = pdx > 0 ? 1 : -1;
    enemy.vx = enemy.facing * cfg.speed;
    if (!hasPlayer || !sameFloor) enemy.state = 'patrol';
  }

  enemy.vy += PHYS.GRAVITY;
  if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
  const res = resolveCollision(enemy, md);
  enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
  if (res.hitWallL || res.hitWallR) enemy.facing *= -1;
  if (res.onGround && enemyWouldFall(enemy, enemy.facing, md)) enemy.facing *= -1;
  if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed;
  if (res.onGround && Math.abs(enemy.vx) > 0.1) {
    if (++enemy.animTimer >= 12) { enemy.animTimer = 0; enemy.animFrame++; }
  }
}

/* Patch initZoneEnemies and updateEnemies to handle all types */
const _origInitZoneEnemies = initZoneEnemies;
initZoneEnemies = function(zoneId) {
  const zone = ZONES[zoneId];
  if (!zone) return;
  zone.enemies = (zone.enemySpawns && zone.enemySpawns.length)
    ? zone.enemySpawns.map(d => createEnemy(d.type, d.tx, d.ty)).filter(Boolean)
    : [];
  /* Clear projectiles when entering a new zone */
  projectiles.length = 0;
  enemyProjectiles.length = 0;
}

const _origUpdateEnemies = updateEnemies;
updateEnemies = function() {
  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies || zone.enemies.length === 0) {
    updateEnemyProjectiles();
    return;
  }
  const md     = zone.mapData;
  const p      = G.player;
  const hitbox = getAttackHitbox(p);
  const wdef   = p ? getWeaponDef(p) : null;

  for (let i = zone.enemies.length - 1; i >= 0; i--) {
    const e = zone.enemies[i];
    if (e.hurtTimer > 0) e.hurtTimer--;

    switch (e.type) {
      case 'skeleton':
      case 'armored_guard':
        if (md) updateEnemyGround(e, md, p); break;
      case 'bat':
        updateEnemyBat(e, p); break;
      case 'crawler':
        if (md) updateEnemyCrawler(e, md, p); break;
      case 'grave_worm':
        updateEnemyGraveWorm(e, p); break;
      case 'ghost':
        updateEnemyGhost(e, p); break;
      case 'mech_construct':
        if (md) updateEnemyMechConstruct(e, md, p); break;
      case 'clockwork_bird':
        updateEnemyClockworkBird(e, p); break;
      case 'gear_golem':
        if (md) updateEnemyGearGolem(e, md, p); break;
    }

    if (e.dead) { zone.enemies.splice(i, 1); continue; }
    if (e.state === 'dead' || e.state === 'hurt') continue;

    /* Ghost can't be hit while phasing */
    if (e.type === 'ghost' && e.phasing) continue;

    if (hitbox && wdef && p && e.lastHitSwing !== p.swingId) {
      if (aabbOverlap(hitbox, e)) {
        e.lastHitSwing = p.swingId;
        enemyTakeDamage(e, wdef.damage, p.x + (p.facing === 1 ? p.w : 0));
      }
    }
    if (p && p.hp > 0) {
      if (e.type === 'ghost' && e.phasing) continue;
      if (aabbOverlap(e, p)) {
        damagePlayer(ENEMY_CFG_ALL[e.type] ? ENEMY_CFG_ALL[e.type].contactDamage : 1, e.x + e.w * 0.5);
      }
    }
  }
  updateEnemyProjectiles();
  updateProjectiles();   /* player projectiles — ticked once here, not via zoneView wrapper */
}

/* ── Draw new enemy types ── */
function _drawCrawler(ctx, e) {
  const f = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = f ? PAL.WHITE : PAL.STONE_MID;
  const C2 = f ? PAL.WHITE : PAL.BLOOD_RED;
  /* Worm body — horizontal oval */
  ctx.fillStyle = C1;
  ctx.fillRect(1, 4, 12, 6);    /* main body */
  ctx.fillRect(0, 5, 14, 4);    /* wide mid */
  /* Segments */
  ctx.fillStyle = PAL.STONE_DARK;
  ctx.fillRect(4, 4, 1, 6);
  ctx.fillRect(8, 4, 1, 6);
  /* Eyes */
  ctx.fillStyle = C2;
  ctx.fillRect(1, 5, 2, 2);
  ctx.fillRect(4, 5, 2, 2);
  /* Legs — animated */
  const l = e.animFrame % 2 === 0;
  ctx.fillStyle = C1;
  ctx.fillRect(2,  l ? 9  : 8,  2, 3);
  ctx.fillRect(6,  l ? 8  : 9,  2, 3);
  ctx.fillRect(10, l ? 9  : 8,  2, 3);
}

function _drawGraveWorm(ctx, e) {
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = f ? PAL.WHITE : PAL.STONE_HIGH;
  const C2 = f ? PAL.WHITE : PAL.BLOOD_RED;
  const bob = e.animFrame % 2 === 0 ? 0 : 1;
  ctx.fillStyle = C1;
  ctx.fillRect(2, bob, 6, 8);   /* body */
  ctx.fillRect(1, bob + 2, 8, 4); /* mid wide */
  ctx.fillStyle = C2;
  ctx.fillRect(3, bob, 2, 2);   /* eye */
  ctx.fillStyle = PAL.STONE_DARK;
  ctx.fillRect(2, bob + 4, 6, 2); /* underbelly line */
}

function _drawGhost(ctx, e) {
  if (e.phasing && (G.frame % 4) < 2) return;  /* flicker while phasing */
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const alpha = e.phasing ? 0.4 : 1;
  ctx.globalAlpha = alpha;
  const C1 = f ? PAL.WHITE : PAL.CLOAK_LITE;
  const C2 = f ? PAL.WHITE : PAL.WHITE;
  const wave = e.animFrame % 2 === 0 ? 0 : 1;
  /* Shroud */
  ctx.fillStyle = C1;
  ctx.fillRect(2, 0, 10, 10);
  ctx.fillRect(1, 3, 12, 6);
  ctx.fillRect(2, 10, 4, 3 + wave);
  ctx.fillRect(8, 10, 4, 3 - wave);
  ctx.fillRect(5, 12, 4, 2);
  /* Eyes */
  ctx.fillStyle = C2;
  ctx.fillRect(3, 4, 3, 3);
  ctx.fillRect(8, 4, 3, 3);
  ctx.fillStyle = PAL.STONE_DARK;
  ctx.fillRect(4, 5, 2, 2);
  ctx.fillRect(9, 5, 2, 2);
  ctx.globalAlpha = 1;
}

function _drawMechConstruct(ctx, e) {
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = f ? PAL.WHITE : PAL.STONE_MID;
  const C2 = f ? PAL.WHITE : PAL.STONE_HIGH;
  const C3 = f ? PAL.WHITE : PAL.GOLD;
  /* Head box */
  ctx.fillStyle = C1;
  ctx.fillRect(2, 0, 10, 8);
  ctx.fillStyle = C2;
  ctx.fillRect(3, 1, 8, 2);    /* top panel */
  ctx.fillStyle = C3;
  ctx.fillRect(3, 3, 3, 3);    /* visor left */
  ctx.fillRect(8, 3, 3, 3);    /* visor right */
  /* Torso */
  ctx.fillStyle = C1;
  ctx.fillRect(1, 8, 12, 7);
  ctx.fillStyle = C2;
  ctx.fillRect(3, 10, 8, 4);   /* chest panel */
  ctx.fillStyle = C3;
  ctx.fillRect(5, 11, 4, 2);   /* power cell glow */
  /* Legs */
  const l = e.animFrame % 2 === 0 ? 1 : -1;
  ctx.fillStyle = C1;
  ctx.fillRect(2,  15 - l, 4, 5);
  ctx.fillRect(8,  15 + l, 4, 5);
}

function _drawClockworkBird(ctx, e) {
  const f   = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1  = f ? PAL.WHITE : PAL.STONE_MID;
  const C2  = f ? PAL.WHITE : PAL.GOLD;
  const flap = e.animFrame % 2 === 0;
  /* Wings */
  ctx.fillStyle = C1;
  ctx.fillRect(-2, flap ? 2 : 4, 4, 4);
  ctx.fillRect(10, flap ? 2 : 4, 4, 4);
  /* Body */
  ctx.fillStyle = C1;
  ctx.fillRect(2, 3, 8, 5);
  /* Gear eye */
  ctx.fillStyle = C2;
  ctx.fillRect(4, 4, 2, 2);
  ctx.fillRect(7, 4, 2, 2);
  /* Beak */
  ctx.fillStyle = C2;
  ctx.fillRect(10, 5, 3, 2);
}

function _drawGearGolem(ctx, e) {
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const C1 = f ? PAL.WHITE : PAL.STONE_MID;
  const C2 = f ? PAL.WHITE : PAL.STONE_HIGH;
  const C3 = f ? PAL.WHITE : PAL.GOLD;
  const spinAngle = ((e.spinTimer || 0) * 0.05) % (Math.PI * 2);

  /* Gear head — rotated gear */
  ctx.save();
  ctx.translate(7, 7);
  ctx.rotate(spinAngle);
  ctx.fillStyle = C1;
  for (let t = 0; t < 6; t++) {
    const a = (t / 6) * Math.PI * 2;
    ctx.fillRect(
      (Math.cos(a) * 7 - 2) | 0,
      (Math.sin(a) * 7 - 2) | 0,
      4, 4
    );
  }
  ctx.restore();
  ctx.fillStyle = C2;
  ctx.fillRect(4, 4, 6, 6);    /* gear center */
  ctx.fillStyle = C3;
  ctx.fillRect(5, 5, 4, 4);    /* core glint */

  /* Heavy body */
  ctx.fillStyle = C1;
  ctx.fillRect(0, 13, 14, 8);
  ctx.fillStyle = C2;
  ctx.fillRect(2, 14, 10, 5);

/* Patch drawEnemies to handle new types */
const _origDrawEnemies = drawEnemies;
drawEnemies = function(ctx) {
  _origDrawEnemies(ctx);

  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies) return;

  for (const e of zone.enemies) {
    if (e.dead) continue;
    /* Only draw types that weren't handled by the original drawEnemies */
    const newTypes = ['crawler','grave_worm','ghost','mech_construct','clockwork_bird','gear_golem'];
    if (!newTypes.includes(e.type)) continue;

    const sx = Math.round(e.x - Camera.x);
    const sy = Math.round(e.y - Camera.y);
    if (sx + e.w < 0 || sx > NES.W || sy + e.h < 0 || sy > NES.H) continue;
    if (e.state === 'dead' && (e.stateTimer % 6) < 3) continue;

    ctx.save();
    if (e.facing === -1) { ctx.translate(sx + e.w, sy); ctx.scale(-1, 1); }
    else { ctx.translate(sx, sy); }

    switch (e.type) {
      case 'crawler':        _drawCrawler(ctx, e);        break;
      case 'grave_worm':     _drawGraveWorm(ctx, e);      break;
      case 'ghost':          _drawGhost(ctx, e);          break;
      case 'mech_construct': _drawMechConstruct(ctx, e);  break;
      case 'clockwork_bird': _drawClockworkBird(ctx, e);  break;
      case 'gear_golem':     _drawGearGolem(ctx, e);      break;
    }
    ctx.restore();
  }

  drawEnemyProjectiles(ctx);
}

/* ── Sanctum atmosphere: pews, altar candles, stained shadow-work ── */
function drawSanctumDecorations(ctx, cols) {
  const ROWS  = 14;
  const T     = NES.TILE;
  const zpal  = ZONE_PAL[ZONE_ID.SANCTUM];

  /* ── Pew backs ── */
  const pewCols = [8, 24, 40];
  pewCols.forEach(col => {
    const px2 = col * T;
    const backY = 4 * T + 4;
    ctx.fillStyle = zpal.solidBase;
    ctx.fillRect(px2, backY, T * 2, 10);
    ctx.fillStyle = zpal.solidShad;
    ctx.fillRect(px2 + 2, backY + 2, T * 2 - 4, 2);
    ctx.fillRect(px2 + 2, backY + 6, T * 2 - 4, 1);
    ctx.fillStyle = zpal.solidTop;
    ctx.fillRect(px2, backY, T * 2, 2);
    ctx.fillStyle = zpal.platformMid;
    ctx.fillRect(px2 + 2, 5 * T + T, T * 2 - 4, 3);
  });

  /* ── Altar ── */
  const altarX = 42 * T;
  const altarY = 6 * T;
  ctx.fillStyle = zpal.solidBase;
  ctx.fillRect(altarX, altarY - 4, 8 * T, 8);
  ctx.fillStyle = zpal.solidTop;
  ctx.fillRect(altarX, altarY - 4, 8 * T, 2);
  ctx.fillStyle = PAL.PALE_GOLD;
  ctx.fillRect(altarX + 4, altarY - 6, 8, 3);
  ctx.fillRect(altarX + T * 6, altarY - 6, 8, 3);

  /* ── Altar candles ── */
  [[altarX + 6, altarY - 12], [altarX + T * 7 - 4, altarY - 12]].forEach(([cx2, cy2]) => {
    ctx.fillStyle = PAL.STONE_HIGH;
    ctx.fillRect(cx2, cy2 + 4, 4, 8);
    ctx.fillStyle = '#f8f8d8';
    ctx.fillRect(cx2, cy2 + 2, 4, 3);
    ctx.fillStyle = PAL.FIRE_RED;
    ctx.fillRect(cx2 + 1, cy2, 2, 3);
    ctx.fillStyle = PAL.PALE_GOLD;
    ctx.fillRect(cx2 + 1, cy2 - 1, 2, 1);
  });

  /* ── Inverted cross — blood red on purple wall ── */
  const crossX = 47 * T;
  const crossY = 5 * T;
  ctx.fillStyle = PAL.FIRE_RED;
  ctx.fillRect(crossX + 6, crossY,      4, 12);
  ctx.fillRect(crossX + 2, crossY + 4,  12, 4);
  ctx.fillStyle = PAL.BLOOD_RED;
  ctx.fillRect(crossX + 5, crossY - 1,  6, 1);
  ctx.fillRect(crossX + 5, crossY + 12, 6, 1);

  /* ── Floor cracks ── */
  ctx.fillStyle = zpal.solidShad;
  [[10, 9], [22, 9], [30, 9]].forEach(([col, row]) => {
    const cx2 = col * T, cy2 = row * T;
    ctx.fillRect(cx2 + 3, cy2 + 5, 6, 1);
    ctx.fillRect(cx2 + 6, cy2 + 3, 1, 4);
  });

  /* ── Pointed arch windows — purple recess ── */
  [6, 18, 32].forEach(col => {
    const ax = col * T, ay = T;
    ctx.fillStyle = zpal.solidShad;
    ctx.fillRect(ax,         ay, 3, 10);
    ctx.fillRect(ax + T - 3, ay, 3, 10);
    ctx.fillRect(ax + 3, ay, T - 6, 4);
    ctx.fillStyle = zpal.solidBase;
    ctx.fillRect(ax + 5, ay - 2, T - 10, 2);
    ctx.fillRect(ax + 7, ay - 4, T - 14, 2);
  });
}

/* ── Throne Room atmosphere: vast pillars, curse geometry, void ── */
function drawThroneDecorations(ctx, cols) {
  const T     = NES.TILE;
  const ROWS  = 20;
  const zpal  = ZONE_PAL[ZONE_ID.THRONE];
  const mapH  = ROWS * T;

  /* ── Floor-to-ceiling pillars ── */
  [6, 12, 20, 28, 34, 42].forEach(col => {
    const px2 = col * T + 6;
    ctx.fillStyle = zpal.solidBase;
    ctx.fillRect(px2, 0, 4, mapH);
    ctx.fillStyle = zpal.solidTop;
    ctx.fillRect(px2 - 2, T, 8, 3);
    ctx.fillStyle = zpal.solidShad;
    for (let y = T * 3; y < mapH - T * 2; y += T * 2) {
      ctx.fillRect(px2, y, 4, 2);
    }
    ctx.fillStyle = zpal.solidTop;
    ctx.fillRect(px2 - 2, mapH - T * 2, 8, 3);
  });

  /* ── Curse rune chains — 1px dots ── */
  ctx.fillStyle = zpal.solidTop;
  for (let step = 0; step < 180; step++) {
    const x = ((step * 3) % (cols * T)) | 0;
    const y = (step * 2 + T * 4) | 0;
    if (y < mapH - T * 2) ctx.fillRect(x, y, 1, 1);
  }

  /* ── Throne silhouette — grey-on-grey, subtle ── */
  const tx = 22 * T;
  ctx.fillStyle = zpal.solidBase;
  ctx.fillRect(tx, T, T * 4, T * 3);
  ctx.fillStyle = zpal.solidTop;
  ctx.fillRect(tx + T, 0, T * 2, T * 2);
  ctx.fillStyle = zpal.solidBase;
  ctx.fillRect(tx, T + 4, T, T);
  ctx.fillRect(tx + T * 3, T + 4, T, T);
  /* Crown spikes — pale grey, not gold (curse stripped colour) */
  ctx.fillStyle = zpal.platformTop;
  [tx + 2, tx + T, tx + T * 2, tx + T * 3 - 2].forEach(sx => {
    ctx.fillRect(sx, 0, 3, T - 4);
    ctx.fillRect(sx + 1, 0 - 2, 1, 2);
  });

  /* ── Boss door frame — only colour in the zone: blood red ── */
  const doorX = 22 * T;
  const doorY = 19 * T;
  ctx.fillStyle = PAL.BLOOD_RED;
  ctx.fillRect(doorX - 4, doorY - 8, 4, T + 8);
  ctx.fillRect(doorX + T * 2, doorY - 8, 4, T + 8);
  ctx.fillStyle = PAL.FIRE_RED;
  ctx.fillRect(doorX - 4, doorY - 8, T * 2 + 8, 4);
  ctx.fillStyle = zpal.solidShad;
  ctx.fillRect(doorX, doorY, T * 2, T);
  /* Warning rune dots */
  ctx.fillStyle = PAL.FIRE_RED;
  ctx.fillRect(doorX - 3, doorY,     2, 2);
  ctx.fillRect(doorX - 3, doorY + 4, 2, 2);
  ctx.fillRect(doorX - 3, doorY + 8, 2, 2);
  ctx.fillRect(doorX + T * 2 + 1, doorY,     2, 2);
  ctx.fillRect(doorX + T * 2 + 1, doorY + 4, 2, 2);
  ctx.fillRect(doorX + T * 2 + 1, doorY + 8, 2, 2);

  /* ── Debris scatter ── */
  ctx.fillStyle = zpal.solidBase;
  [[8,32],[40,48],[96,80],[144,32],[200,64],[280,48],
   [80,128],[160,160],[240,192],[320,128],[400,144]].forEach(([x, y]) => {
    ctx.fillRect(x, y, 2, 2);
  });
}

/* ================================================================
   SECTION 9-C — NEW ENEMY TYPES
   cursed_priest:   Range attacker. Fires homing curse bolt. Backs away
                    from player. Found on Sanctum floor/altar.
   kneeling_undead: Dormant (crouched, no hitbox) until player enters
                    aggroRange. Then rises over 30 frames and attacks.
================================================================ */

Object.assign(ENEMY_CFG_ALL, {
  cursed_priest: {
    w: 12, h: 20, hp: 2,
    speed: 0.6, aggroRange: 110,
    gravity: true, contactDamage: 1,
    shootRange: 100, shootCooldown: 80,
    retreatSpeed: 0.5,
  },
  kneeling_undead: {
    w: 12, h: 10, hp: 2,   /* h=10 when kneeling, rises to h=20 */
    speed: 0.7, aggroRange: 72,
    gravity: true, contactDamage: 1,
    riseFrames: 30,
  },
});

function updateEnemyCursedPriest(enemy, md, player) {
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++;
    enemy.vx *= 0.75; enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const r = resolveCollision(enemy, md);
    enemy.x = r.x; enemy.y = r.y; enemy.vx = r.vx; enemy.vy = r.vy;
    if (enemy.stateTimer >= 14) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'patrol'; enemy.stateTimer = 0;
    }
    return;
  }
  const cfg = ENEMY_CFG_ALL.cursed_priest;
  if (enemy.shootCooldown > 0) enemy.shootCooldown--;

  const hp = !!(player && player.hp > 0);
  const pdx = hp ? (player.x + (player.w >> 1)) - (enemy.x + (enemy.w >> 1)) : 0;
  const pdy = hp ? (player.y + (player.h >> 1)) - (enemy.y + (enemy.h >> 1)) : 0;
  const dist = hp ? Math.sqrt(pdx*pdx + pdy*pdy) : 999;

  if (enemy.state === 'patrol') {
    enemy.vx = enemy.facing * cfg.speed * 0.3;   /* slow patrol */
    if (hp && dist < cfg.aggroRange) {
      enemy.facing = pdx > 0 ? 1 : -1;
      enemy.state  = 'chase'; enemy.stateTimer = 0;
    }
  } else if (enemy.state === 'chase') {
    enemy.stateTimer++;
    if (hp) enemy.facing = pdx > 0 ? 1 : -1;

    /* Retreat to maintain distance — priests don't melee */
    if (dist < 40 && hp) {
      enemy.vx = -enemy.facing * cfg.retreatSpeed;
    } else {
      enemy.vx = 0;   /* hold position while shooting */
    }

    /* Fire curse bolt */
    if (hp && dist < cfg.shootRange && enemy.shootCooldown <= 0) {
      const speed = 2.8;
      const norm  = Math.sqrt(pdx*pdx + pdy*pdy) || 1;
      enemyProjectiles.push({
        x: enemy.x + enemy.w * 0.5,
        y: enemy.y + enemy.h * 0.4,
        vx: (pdx / norm) * speed,
        vy: (pdy / norm) * speed,
        w: 5, h: 5, life: 60,
        isCurseBolt: true,   /* purple tint in draw */
      });
      enemy.shootCooldown = cfg.shootCooldown;
    }

    if (!hp || dist > cfg.aggroRange + 24) { enemy.state = 'patrol'; }
  }

  enemy.vy += PHYS.GRAVITY;
  if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
  const res = resolveCollision(enemy, md);
  enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
  if (res.hitWallL || res.hitWallR) { enemy.facing *= -1; enemy.vx = 0; }
  if (res.onGround && enemyWouldFall(enemy, enemy.facing, md)) enemy.facing *= -1;
  if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed * 0.3;
  if (res.onGround && Math.abs(enemy.vx) > 0.1) {
    if (++enemy.animTimer >= 12) { enemy.animTimer = 0; enemy.animFrame++; }
  }
}

function updateEnemyKneelingUndead(enemy, md, player) {
  /* State machine: kneeling → rising (30fr) → standing → [patrol/chase] → dead */
  if (enemy.state === 'dead') { if (++enemy.stateTimer >= 30) enemy.dead = true; return; }
  if (enemy.state === 'hurt') {
    enemy.stateTimer++;
    enemy.vx *= 0.75; enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const r = resolveCollision(enemy, md);
    enemy.x = r.x; enemy.y = r.y; enemy.vx = r.vx; enemy.vy = r.vy;
    if (enemy.stateTimer >= 14) {
      enemy.state = enemy.hp <= 0 ? 'dead' : 'standing'; enemy.stateTimer = 0;
    }
    return;
  }

  const cfg = ENEMY_CFG_ALL.kneeling_undead;

  if (enemy.state === 'kneeling') {
    /* Dormant — tiny hitbox, no movement. Check player proximity. */
    enemy.h = 10;   /* kneeling height */
    if (player && player.hp > 0) {
      const pdx = Math.abs((player.x + (player.w>>1)) - (enemy.x + (enemy.w>>1)));
      const pdy = Math.abs((player.y + (player.h>>1)) - (enemy.y + enemy.h * 0.5));
      if (pdx < cfg.aggroRange && pdy < 48) {
        enemy.state = 'rising'; enemy.stateTimer = 0;
      }
    }
    /* Still apply gravity so it stays on ground */
    enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = 0; enemy.vy = res.vy;
    return;
  }

  if (enemy.state === 'rising') {
    enemy.stateTimer++;
    /* Grow hitbox from 10→20px over riseFrames (shift y up to compensate) */
    const progress  = Math.min(1, enemy.stateTimer / cfg.riseFrames);
    const newH      = 10 + Math.floor(progress * 10);
    enemy.y        -= (newH - enemy.h);   /* keep feet planted */
    enemy.h         = newH;
    enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = 0; enemy.vy = res.vy;
    if (enemy.stateTimer >= cfg.riseFrames) {
      enemy.state = 'standing'; enemy.h = 20; enemy.stateTimer = 0;
    }
    return;
  }

  /* Standing — behaves like a slow skeleton */
  if (enemy.state === 'standing' || enemy.state === 'patrol' || enemy.state === 'chase') {
    const hp  = !!(player && player.hp > 0);
    const pdx = hp ? (player.x + (player.w>>1)) - (enemy.x + (enemy.w>>1)) : 0;
    const sameFloor = hp && Math.abs((player.y + player.h) - (enemy.y + enemy.h)) < 40;

    if (enemy.state === 'standing') {
      enemy.state = 'patrol'; enemy.vx = 0;
    } else if (enemy.state === 'patrol') {
      enemy.vx = enemy.facing * cfg.speed;
      if (hp && sameFloor && Math.abs(pdx) < cfg.aggroRange) {
        enemy.facing = pdx > 0 ? 1 : -1; enemy.state = 'chase';
      }
    } else {
      if (hp) enemy.facing = pdx > 0 ? 1 : -1;
      enemy.vx = enemy.facing * cfg.speed;
      if (!hp || !sameFloor) enemy.state = 'patrol';
    }

    enemy.vy += PHYS.GRAVITY;
    if (enemy.vy > PHYS.MAX_FALL) enemy.vy = PHYS.MAX_FALL;
    const res = resolveCollision(enemy, md);
    enemy.x = res.x; enemy.y = res.y; enemy.vx = res.vx; enemy.vy = res.vy;
    if (res.hitWallL || res.hitWallR) enemy.facing *= -1;
    if (res.onGround && enemyWouldFall(enemy, enemy.facing, md)) enemy.facing *= -1;
    if (enemy.state === 'patrol') enemy.vx = enemy.facing * cfg.speed;
    if (res.onGround && Math.abs(enemy.vx) > 0.1) {
      if (++enemy.animTimer >= 10) { enemy.animTimer = 0; enemy.animFrame++; }
    }
  }
}

/* ── Draw cursed priest — robed figure with staff and glowing eyes ── */
function _drawCursedPriest(ctx, e) {
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  /* Sanctum palette: deep purple + corrupt gold + glowing void-white eyes */
  const ROBE_D  = f ? PAL.WHITE : '#2a1e38';   /* dark robe body       */
  const ROBE_M  = f ? PAL.WHITE : '#4a3060';   /* robe mid highlight   */
  const GOLD_C  = f ? PAL.WHITE : PAL.GOLD;    /* staff / trim         */
  const EYE_C   = f ? PAL.WHITE : '#cc88ff';   /* corrupted glow eyes  */

  /* Hood */
  ctx.fillStyle = ROBE_D;
  ctx.fillRect(3, 0, 6, 3);
  ctx.fillRect(2, 2, 8, 3);

  /* Face — sunken, partially visible under hood */
  ctx.fillStyle = PAL.STONE_MID;
  ctx.fillRect(3, 3, 6, 3);
  ctx.fillStyle = EYE_C;
  ctx.fillRect(4, 4, 2, 1);   /* left glowing eye */
  ctx.fillRect(7, 4, 2, 1);   /* right glowing eye */

  /* Robe body */
  ctx.fillStyle = ROBE_D;
  ctx.fillRect(2, 6, 8, 9);
  ctx.fillStyle = ROBE_M;
  ctx.fillRect(4, 7, 4, 7);   /* robe centre seam */

  /* Gold trim on robe hem */
  ctx.fillStyle = GOLD_C;
  ctx.fillRect(2, 14, 8, 1);

  /* Staff — held to the right */
  ctx.fillStyle = GOLD_C;
  ctx.fillRect(10, 4, 2, 12);   /* staff shaft */
  ctx.fillRect(8,  3, 6, 2);    /* staff crosspiece */
  ctx.fillStyle = EYE_C;
  ctx.fillRect(10, 2, 2, 2);    /* glowing orb top */

  /* Robe hem / feet */
  ctx.fillStyle = ROBE_D;
  ctx.fillRect(3, 15, 3, 4);    /* left foot-hem */
  ctx.fillRect(7, 15, 3, 4);    /* right foot-hem */
}

/* ── Draw kneeling undead — shows rise animation ── */
function _drawKneelingUndead(ctx, e) {
  const f  = e.hurtTimer > 0 && (e.hurtTimer % 4) < 2;
  const CB = f ? PAL.WHITE : PAL.STONE_HIGH;
  const CD = f ? PAL.WHITE : PAL.STONE_DARK;
  const isKneeling = e.h <= 12;
  const isRising   = e.state === 'rising';

  if (isKneeling) {
    /* Crouched skull visible at ground level */
    ctx.fillStyle = CB;
    ctx.fillRect(2, 2, 8, 6);   /* skull */
    ctx.fillStyle = CD;
    ctx.fillRect(3, 3, 2, 2);   /* eye L */
    ctx.fillRect(7, 3, 2, 2);   /* eye R */
    ctx.fillStyle = CB;
    ctx.fillRect(3, 8, 6, 2);   /* folded body */
    return;
  }

  /* Rising / standing — proportion based on current h */
  const scaleY = e.h / 20;
  const headY  = Math.max(0, Math.round(2 - scaleY * 2));

  ctx.fillStyle = CB;
  ctx.fillRect(3, headY,     6, 5);              /* skull */
  ctx.fillStyle = CD;
  ctx.fillRect(4, headY + 1, 2, 2);             /* eye L */
  ctx.fillRect(8, headY + 1, 2, 2);             /* eye R */
  ctx.fillStyle = CB;
  ctx.fillRect(4, headY + 5, 2, 2);             /* neck */
  ctx.fillRect(2, headY + 7, 8, 4);             /* torso */
  ctx.fillStyle = CD;
  ctx.fillRect(4, headY + 8, 4, 2);             /* rib */

  if (!isRising) {
    /* Full legs only when fully risen */
    const leg = e.animFrame % 2 === 0 ? 1 : -1;
    ctx.fillStyle = CB;
    ctx.fillRect(3, headY + 11 - leg, 3, 8);
    ctx.fillRect(6, headY + 11 + leg, 3, 8);
  } else {
    /* Partial legs emerging from ground */
    ctx.fillStyle = CB;
    ctx.fillRect(3, headY + 11, 3, Math.round((e.h - 10) * 0.8));
    ctx.fillRect(6, headY + 11, 3, Math.round((e.h - 10) * 0.6));
  }
}

/* ── Patch curse bolt drawing into drawEnemyProjectiles ── */
const _origDrawEnemyProj = drawEnemyProjectiles;
drawEnemyProjectiles = function(ctx) {
  /* Draw standard projectiles first */
  for (const pr of enemyProjectiles) {

    } else {
      ctx.fillStyle = PAL.FIRE_RED;

/* ── Patch updateEnemies to handle new types ── */
const _origUpdateEnemies_z45 = updateEnemies;
updateEnemies = function() {
  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies || zone.enemies.length === 0) {
    updateEnemyProjectiles();
    updateProjectiles();
    return;
  }
  const md     = zone.mapData;
  const p      = G.player;
  const hitbox = getAttackHitbox(p);
  const wdef   = p ? getWeaponDef(p) : null;

  for (let i = zone.enemies.length - 1; i >= 0; i--) {
    const e = zone.enemies[i];
    if (e.hurtTimer > 0) e.hurtTimer--;

    switch (e.type) {
      case 'cursed_priest':
        if (md) updateEnemyCursedPriest(e, md, p); break;
      case 'kneeling_undead':
        if (md) updateEnemyKneelingUndead(e, md, p); break;
      default: {
        /* All previous types — call their specific update functions directly */
        if (md) {
          switch (e.type) {
            case 'skeleton':
            case 'armored_guard': updateEnemyGround(e, md, p);   break;
            case 'bat':           updateEnemyBat(e, p);           break;
            case 'crawler':       updateEnemyCrawler(e, md, p);   break;
            case 'grave_worm':    updateEnemyGraveWorm(e, p);     break;
            case 'ghost':         updateEnemyGhost(e, p);         break;
            case 'mech_construct': updateEnemyMechConstruct(e, md, p); break;
            case 'clockwork_bird': updateEnemyClockworkBird(e, p);    break;
            case 'gear_golem':    updateEnemyGearGolem(e, md, p); break;
          }
        }
        break;
      }
    }

    if (e.dead) { zone.enemies.splice(i, 1); continue; }

    /* Skip hurt/dead for interaction checks */
    if (e.state === 'dead' || e.state === 'hurt') continue;
    /* Ghost phasing */
    if (e.type === 'ghost' && e.phasing) continue;
    /* Kneeling undead — no contact damage while kneeling */
    if (e.type === 'kneeling_undead' && e.state === 'kneeling') continue;

    if (hitbox && wdef && p && e.lastHitSwing !== p.swingId) {
      if (aabbOverlap(hitbox, e)) {
        e.lastHitSwing = p.swingId;
        enemyTakeDamage(e, wdef.damage, p.x + (p.facing === 1 ? p.w : 0));
      }
    }
    if (p && p.hp > 0 && aabbOverlap(e, p)) {
      const dmg = ENEMY_CFG_ALL[e.type] ? ENEMY_CFG_ALL[e.type].contactDamage : 1;
      damagePlayer(dmg, e.x + e.w * 0.5);
    }
  }

  updateEnemyProjectiles();
  updateProjectiles();
};

/* ── Patch drawEnemies to handle new types ── */
const _origDrawEnemies_z45 = drawEnemies;
drawEnemies = function(ctx) {
  _origDrawEnemies_z45(ctx);
  const zone = ZONES[G.currentZoneId];
  if (!zone || !zone.enemies) return;
  for (const e of zone.enemies) {
    if (e.dead) continue;
    if (e.type !== 'cursed_priest' && e.type !== 'kneeling_undead') continue;
    const sx = Math.round(e.x - Camera.x);
    const sy = Math.round(e.y - Camera.y);
    if (sx + e.w < 0 || sx > NES.W || sy + e.h < 0 || sy > NES.H) continue;
    if (e.state === 'dead' && (e.stateTimer % 6) < 3) continue;
    ctx.save();
    if (e.facing === -1) { ctx.translate(sx + e.w, sy); ctx.scale(-1, 1); }
    else { ctx.translate(sx, sy); }
    if (e.type === 'cursed_priest')    _drawCursedPriest(ctx, e);
    if (e.type === 'kneeling_undead')  _drawKneelingUndead(ctx, e);
    ctx.restore();
  }
};

   SECTION 9 — HUD SYSTEM
   GDD: 6 hearts, weapon indicator, zone name
   Classic NES bottom-strip HUD — always visible during PLAYING.
================================================================ */
const HUD_H = 16;   /* HUD strip height at bottom of screen */

const HUD = {
  zoneLabel: '',
  zoneLabelTimer: 0,

  showZone(label) {
    this.zoneLabel      = label;
    this.zoneLabelTimer = 240;  /* 4 seconds */
  },

  update() {
    if (this.zoneLabelTimer > 0) this.zoneLabelTimer--;
    if (G.objectiveFlash   > 0) G.objectiveFlash--;

    const p = G.player;
    if (!p) return;

    /* ── HUD strip background ── */
    ctx.fillStyle = PAL.HUD_BG;
    ctx.fillRect(0, NES.H - HUD_H, NES.W, HUD_H);

    ctx.fillStyle = PAL.STONE_HIGH;
    ctx.fillRect(0, NES.H - HUD_H, NES.W, 1);

    const heartW   = 9;
    const heartX0  = 4;
    const heartY   = NES.H - HUD_H + 4;
    for (let i = 0; i < p.maxHp; i++) {
      const px = heartX0 + i * heartW;
      /* outer shape */
      ctx.fillStyle = i < p.hp ? PAL.HUD_HEART : PAL.HUD_EMPTY;
      /* NES-style heart via 2 circles + triangle approximation */
      ctx.fillRect(px,     heartY + 2, 2, 2);
      ctx.fillRect(px + 4, heartY + 2, 2, 2);
      ctx.fillRect(px,     heartY + 2, 6, 5);
      ctx.fillRect(px + 1, heartY + 1, 4, 1);
      ctx.fillRect(px + 1, heartY + 7, 4, 1);
      ctx.fillRect(px + 2, heartY + 8, 2, 1);

      if (i < p.hp) {
        ctx.fillStyle = PAL.FIRE_RED;
        ctx.fillRect(px + 1, heartY + 2, 2, 2);

    /* ── Weapon indicator ── */
    const wName  = (p.weapons[p.weaponIdx] || 'sword').toUpperCase().replace(/_/g, ' ');

    const wX     = heartX0 + p.maxHp * heartW + 8;

    ctx.fillStyle = PAL.STONE_MID;
    ctx.fillRect(wX - 2, NES.H - HUD_H + 2, 72, 12);
    ctx.fillStyle = PAL.STONE_HIGH;
    ctx.fillRect(wX - 2, NES.H - HUD_H + 2, 72, 1);

    ctx.fillStyle = PAL.PALE_GOLD;
    ctx.font      = '6px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('WPN:', wX, NES.H - HUD_H + 11);
    ctx.fillStyle = PAL.WHITE;
    ctx.fillText(wName, wX + 24, NES.H - HUD_H + 11);

    /* weapon count [2/5] */
    ctx.fillStyle = PAL.MIDGRAY;
    ctx.fillText(`[${p.weaponIdx + 1}/${wCount}]`, wX + 60, NES.H - HUD_H + 11);

    /* ── Zone label flash ── */
    if (this.zoneLabelTimer > 0) {
      const fade = Math.min(1, this.zoneLabelTimer / 30, (240 - this.zoneLabelTimer + 1) / 30);
      ctx.globalAlpha = fade;
      ctx.fillStyle   = PAL.PALE_GOLD;
      ctx.font        = '7px monospace';
      ctx.textAlign   = 'center';
      ctx.fillText(this.zoneLabel, NES.W / 2, NES.H - HUD_H - 6);
      ctx.globalAlpha = 1;
      ctx.textAlign   = 'left';
    }

    /* ── Hand warning indicator ── */
    if (G.theHand && G.theHand.active && !G.theHand.stunTimer) {

        ctx.textAlign = 'right';
        ctx.fillText('!', NES.W - 4, 12);
        ctx.textAlign = 'left';
      }
    }
  },

/* ================================================================
   SECTION 10 — AUDIO ENGINE
   Web Audio API chiptune synthesiser.
   Hardware model: Ricoh 2A03 (NES) — 2 pulse + 1 triangle + 1 noise.
   All frequencies, envelopes, and volumes quantised to 4-bit / 60Hz
   steps to match original hardware behaviour.

   Architecture:
     - AudioContext created on first user gesture (title START press)
     - Look-ahead scheduler (100ms window, 25ms poll) drives all music
     - ScriptProcessorNode dummy loop keeps tab-background clock alive
     - LFSR noise channel via pre-computed AudioBuffer
     - Dynamic sampleRate — NEVER hardcoded 44100
     - Channel-steal: SFX mutes pulse1 music mid-phrase, restores after
     - Directional Hand scratch: StereoPannerNode tracks Hand X position
================================================================ */

const Audio = (() => {
'use strict';

/* ----------------------------------------------------------------
   A0. INTERNAL STATE
---------------------------------------------------------------- */
let ctx        = null;   /* AudioContext — null until first gesture */
let SR         = 44100;  /* set from ctx.sampleRate after init      */
let masterGain = null;   /* master volume node                      */
let ready      = false;

/* Look-ahead scheduler */
let schedTimer      = null;
let schedNextTime   = 0;
const SCHED_AHEAD   = 0.10;  /* 100ms lookahead                    */
const SCHED_POLL_MS = 25;    /* poll every 25ms                     */

/* Music state */
let currentTrack    = null;  /* { sequences, tempo, ... }          */
let musicStep       = 0;
let musicPlaying    = false;
let musicPaused     = false;

/* Channel steal — pulse1 music muted while SFX plays */
let pulse1MusicMuted = false;
let pulse1MuteTimer  = 0;   /* frames remaining in steal          */

/* Dummy keep-alive node (prevents tab-background throttle) */
let dummyNode = null;

/* Cached waveforms — built once after ctx init */
let waveP125  = null;   /* 12.5% duty pulse                       */
let waveP25   = null;   /* 25%  duty pulse                        */
let waveP50   = null;   /* 50%  duty pulse                        */
let waveTri   = null;   /* stepped 4-bit triangle                 */
let noiseBuffer = null; /* LFSR noise AudioBuffer                 */

/* Active music oscillator refs (for channel steal) */
let pulse1MusicGain = null;

/* ----------------------------------------------------------------
   A1. MATH HELPERS
---------------------------------------------------------------- */

/* Equal temperament from A4=440 */
function pitch(semi) { return 440 * Math.pow(2, semi / 12); }

/* Semitone offsets relative to A4 (0) */
const N = {
  C2:-33, D2:-31, E2:-29, F2:-28, G2:-26, A2:-24, B2:-22,
  C3:-21, D3:-19, E3:-17, F3:-16, 'G#3':-13, A3:-12, B3:-10,
  C4: -9, D4: -7, E4: -5, F4: -4, 'F#4':-3, 'G#4':-1,
  A4:  0, B4:  2, C5:  3, D5:  5, E5:  7, F5:  8, 'G#5': 11,
  A5: 12, B5: 14, C6: 15, D6: 17, E6: 19,
};

/* 4-bit volume quantisation (0-15 discrete levels) */
function q4(v) {
  return Math.round(Math.max(0, Math.min(1, v)) * 15) / 15;
}

/* ----------------------------------------------------------------
   A2. WAVEFORM BUILDERS
   Fourier series with Hanning window to suppress Gibbs ringing.
   sampleRate-independent — only harmonic coefficients matter.
---------------------------------------------------------------- */

function buildPulse(duty) {
  const H = 64;
  const real = new Float32Array(H);
  const imag = new Float32Array(H);
  for (let i = 1; i < H; i++) {
    /* Hanning window: w(i) = 0.5*(1 - cos(π*i/(H-1))) */
    const w = 0.5 * (1 - Math.cos(Math.PI * i / (H - 1)));
    imag[i] = w * (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
  }
  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

function buildSteppedTriangle() {
  /* 32-step 4-bit triangle — matches 2A03 DAC staircase output */
  const S = 32;
  const real = new Float32Array(S);
  const imag = new Float32Array(S);
  for (let i = 1; i < S; i += 2) {
    imag[i] = (8 / Math.pow(Math.PI * i, 2)) * (i % 4 === 1 ? 1 : -1);
  }
  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

/* ----------------------------------------------------------------
   A3. LFSR NOISE BUFFER  (15-bit shift register, pre-computed)
   shortMode=false → long  (32767-sample white noise — snare/hiss)
   shortMode=true  → short (93-sample metallic loop — bats/magic)
   Uses ctx.sampleRate so it plays back at correct pitch regardless
   of Bluetooth/low-rate environments.
---------------------------------------------------------------- */

function buildNoiseBuffer(shortMode) {
  /* One second worth of samples; scheduler loops as needed */
  const len  = SR;
  const buf  = ctx.createBuffer(1, len, SR);
  const data = buf.getChannelData(0);
  let   reg  = 0x0001;

  for (let i = 0; i < len; i++) {
    const tap  = shortMode ? 6 : 1;
    const b0   = reg & 1;
    const bN   = (reg >> tap) & 1;
    const feed = b0 ^ bN;
    reg = (reg >> 1) | (feed << 14);
    data[i] = b0 ? 1.0 : -1.0;
  }
  return buf;
}

/* ----------------------------------------------------------------
   A4. LOW-LEVEL NOTE PLAYER
   Schedules a single hardware-style note on one channel.
   Returns the GainNode so callers can mute/fade it.
   vibrato: true → 60Hz alternating ±depthSemi semitone steps
   sweep: { target, dur } → hardware frequency sweep
   pan: -1..1 → StereoPanner
---------------------------------------------------------------- */

function playNote(opts) {
  if (!ctx || !ready) return null;
  const {
    wave     = waveP25,
    freq,
    start,
    dur,
    vol      = 0.2,
    vibrato  = false,
    vibratoDepth = 0.3,   /* semitones */
    sweep    = null,
    pan      = 0,
    loop     = false,
  } = opts;

  if (!freq || freq <= 0) return null;

  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();

  if (wave) osc.setPeriodicWave(wave);
  osc.frequency.setValueAtTime(freq, start);

  /* 4-bit staccato envelope */
  const qv = q4(vol);
  gain.gain.setValueAtTime(qv, start);
  gain.gain.setValueAtTime(qv,     start + dur * 0.80);
  gain.gain.linearRampToValueAtTime(0, start + dur * 0.98);

  /* 60Hz vibrato — alternating frame-rate pitch steps */
  if (vibrato) {
    const fHi  = freq * Math.pow(2,  vibratoDepth / 12);
    const fLo  = freq * Math.pow(2, -vibratoDepth / 12);
    const step = 1 / 60;
    const frames = Math.floor(dur / step);
    for (let i = 0; i < frames; i++) {
      osc.frequency.setValueAtTime(
        i % 2 === 0 ? fHi : fLo,
        start + i * step
      );
    }
  }

  /* Hardware sweep (60Hz stepping, asymmetric for descending — 1's complement bug) */
  if (sweep) {
    const steps = Math.max(1, Math.floor(sweep.dur * 60));
    const delta = (sweep.target - freq) / steps;
    let   cur   = freq;
    for (let i = 0; i < steps; i++) {
      const bug = (sweep.target < freq) ? cur * 0.005 : 0;
      osc.frequency.setValueAtTime(cur + bug, start + i / 60);
      cur += delta;
    }
  }

  /* Routing: osc → gain → [panner →] master */
  osc.connect(gain);
  if (pan !== 0 && ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), start);
    gain.connect(panner);
    panner.connect(masterGain);
  } else {
    gain.connect(masterGain);
  }

  osc.start(start);
  osc.stop(start + dur + 0.02);

  return gain;
}

/* ----------------------------------------------------------------
   A5. NOISE HIT PLAYER  (uses BufferSourceNode from LFSR buffer)
---------------------------------------------------------------- */

function playNoise(opts) {
  if (!ctx || !ready || !noiseBuffer) return;
  const { start, dur, vol = 0.15, short = false, pan = 0 } = opts;
  /* We have one long-mode buffer; short-mode is a separate on-demand build */
  const buf = short ? buildNoiseBuffer(true) : noiseBuffer;

  const src  = ctx.createBufferSource();
  const gain = ctx.createGain();
  const qv   = q4(vol);

  src.buffer = buf;
  src.loop   = true;

  gain.gain.setValueAtTime(qv, start);
  gain.gain.setValueAtTime(qv, start + dur * 0.6);
  gain.gain.linearRampToValueAtTime(0, start + dur);

  src.connect(gain);

  if (pan !== 0 && ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.setValueAtTime(pan, start);
    gain.connect(panner);
    panner.connect(masterGain);
  } else {
    gain.connect(masterGain);
  }

  src.start(start);
  src.stop(start + dur + 0.02);
}

/* ----------------------------------------------------------------
   A7. SCHEDULER CORE
   Look-ahead pattern: schedules all notes that fall within
   [now, now + SCHED_AHEAD]. Runs every SCHED_POLL_MS.
---------------------------------------------------------------- */

function scheduleStep(stepIdx, time) {
  if (!currentTrack) return;
  const step = currentTrack.steps[stepIdx % currentTrack.steps.length];
  const stepDur = 60 / currentTrack.bpm / 2;  /* eighth-note grid */

  /* pulse1 — channel steal: skip if SFX has muted it */
  if (step.p1 && !pulse1MusicMuted) {
    const g = playNote({
      wave:  waveP125,
      freq:  pitch(step.p1.semi),
      start: time,
      dur:   stepDur,
      vol:   step.p1.vol,
      vibrato: step.p1.vib,
    });
    pulse1MusicGain = g;
  }

  /* pulse2 — 25% duty, structural harmony */
  if (step.p2) {
    playNote({
      wave:  waveP25,
      freq:  pitch(step.p2.semi),
      start: time,
      dur:   stepDur,
      vol:   step.p2.vol,
      vibrato: step.p2.vib,
    });
  }

  /* triangle — bass line, one octave lower */
  if (step.tri) {
    playNote({
      wave:  waveTri,
      freq:  pitch(step.tri.semi),
      start: time,
      dur:   stepDur * 0.95,
      vol:   step.tri.vol,
    });
  }

  /* noise — percussion/atmosphere layer */
  if (step.noise) {
    playNoise({
      start: time,
      dur:   stepDur * 0.5,
      vol:   step.noise.vol,
      short: step.noise.short,
    });
  }
}

function runScheduler() {
  if (!ctx || !musicPlaying || musicPaused) return;
  const stepDur = 60 / currentTrack.bpm / 2;
  while (schedNextTime < ctx.currentTime + SCHED_AHEAD) {
    scheduleStep(musicStep, schedNextTime);
    schedNextTime += stepDur;
    musicStep++;
  }
}

function startScheduler() {
  if (schedTimer) clearTimeout(schedTimer);
  function loop() {
    runScheduler();
    schedTimer = setTimeout(loop, SCHED_POLL_MS);
  }
  loop();
}

function stopScheduler() {
  if (schedTimer) { clearTimeout(schedTimer); schedTimer = null; }
}

/* ----------------------------------------------------------------
   A8. PUBLIC MUSIC API
---------------------------------------------------------------- */

function playTrack(trackKey) {
  if (!ready) return;
  const track = TRACKS[trackKey];
  if (!track) return;
  if (currentTrack === track && musicPlaying) return;  /* already playing */

  currentTrack  = track;
  musicStep     = 0;
  musicPlaying  = true;
  musicPaused   = false;
  schedNextTime = ctx.currentTime + 0.05;
  if (DEBUG) console.log(`[audio] track: ${trackKey}`);
}

function pauseMusic()  { musicPaused = true; }
function resumeMusic() { musicPaused = false; }
function stopMusic()   { musicPlaying = false; currentTrack = null; stopScheduler(); }

/* ----------------------------------------------------------------
   A9. SOUND EFFECTS
   All SFX use channel-steal on pulse1 (brief — 100-200ms).
   Triangle and pulse2 music continues undisturbed.
---------------------------------------------------------------- */

function _steal(ms) {
  /* Mute pulse1 music voice for ms milliseconds */
  if (pulse1MusicGain) {
    try { pulse1MusicGain.gain.setValueAtTime(0, ctx.currentTime); } catch(e) {}
  }
  pulse1MusicMuted = true;
  pulse1MuteTimer  = ms;
  /* Auto-restore handled in Audio.update() called from game loop */
}

/* ----------------------------------------------------------------
   A10. INITIALISATION
   Called on first user gesture (title START press via onStateEnter).
   Creates AudioContext, builds waveforms, starts dummy node,
   starts scheduler.
---------------------------------------------------------------- */

function init() {
  if (ctx) return;  /* idempotent */

  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    console.warn('[audio] WebAudio not available:', e);
    return;
  }

  /* CRITICAL: always read sampleRate from context — never hardcode */
  SR = ctx.sampleRate;
  if (DEBUG) console.log(`[audio] context created, sampleRate=${SR}Hz`);

  /* Master gain — all nodes route here */
  masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(1.0, ctx.currentTime);
  masterGain.connect(ctx.destination);

  /* Build waveforms */
  waveP125 = buildPulse(0.125);
  waveP25  = buildPulse(0.25);
  waveP50  = buildPulse(0.50);
  waveTri  = buildSteppedTriangle();

  /* Build long-mode noise buffer once (short-mode built on demand) */
  noiseBuffer = buildNoiseBuffer(false);

  /* Dummy ScriptProcessorNode — forces browser to keep audio thread alive
     when tab is backgrounded, preventing scheduler stutter.
     ScriptProcessorNode is deprecated but remains the only reliable
     single-file solution (AudioWorklet requires an external module URL
     or a Blob URL which requires careful CSP handling; the Blob approach
     works but the ScriptProcessor is simpler and sufficient for jam). */
  try {
    dummyNode = ctx.createScriptProcessor(4096, 0, 1);
    dummyNode.onaudioprocess = function() { runScheduler(); };
    dummyNode.connect(ctx.destination);
  } catch(e) {
    /* Fallback: scheduler runs purely on setTimeout — acceptable */
    if (DEBUG) console.log('[audio] ScriptProcessor unavailable, using setTimeout only');
  }

  ctx.resume().then(() => {
    ready = true;
    startScheduler();
    if (DEBUG) console.log('[audio] ready');
  });
}

/* ----------------------------------------------------------------
   A11. PER-FRAME UPDATE
   Called from the game loop once per frame.
   Handles: channel-steal timer, Hand warning SFX.
---------------------------------------------------------------- */

function update() {
  if (!ready) return;

  /* Channel-steal countdown */
  if (pulse1MusicMuted) {
    pulse1MuteTimer--;
    if (pulse1MuteTimer <= 0) {
      pulse1MusicMuted = false;
      pulse1MuteTimer  = 0;
    }
  }

  /* Jump SFX — INPUT.A.just is still valid here (flush happens after all updates) */
  if (INPUT.A.just && G.player && G.player.onGround) {
    SFX.jump();
  }

  /* Hand approach scratch — fires once when warnTimer flips to 1,
     then grows louder proportional to distance (called each frame
     while active but throttled to every 30 frames to avoid spam). */
  const hand = G.theHand;
  if (hand && hand.active && !hand.stunTimer && G.player) {
    if (hand.warnTimer > 0 && G.frame % 30 === 0) {
      /* Pan based on Hand position relative to viewport centre */
      const hcx = hand.x + hand.w * 0.5;
      const sceneW = NES.W;
      const pan = ((hcx - Camera.x) - sceneW * 0.5) / (sceneW * 0.5);
      SFX.handApproach(pan);
    }
  }
}

/* ----------------------------------------------------------------
   A12. HOOK INTO GAME SYSTEMS
   All hooks use the assignment pattern (no hoisting issue —
   existing bindings are already assigned, not declared here).
---------------------------------------------------------------- */

/* ── enterZone → start zone music + zone-entry chime ── */
const _origEnterZoneAudio = enterZone;
enterZone = function(zoneId) {
  _origEnterZoneAudio(zoneId);
  if (!ready && zoneId === ZONE_ID.ENTRY) init();
  if (ready || zoneId === ZONE_ID.ENTRY) {
    /* Slight delay so init() completes before playTrack */
    setTimeout(() => {
      SFX.zoneEnter();
      if (TRACKS[zoneId]) playTrack(zoneId);
    }, 60);
  }
};

/* ── setState → death music, pause/resume music ── */
const _origSetStateAudio = setState;
setState = function(next) {
  const prev = G.state;
  _origSetStateAudio(next);
  if (!ready) return;
  if (next === STATE.DEAD  && prev === STATE.PLAYING) SFX.playerDead();
  if (next === STATE.PAUSED) pauseMusic();
  if (next === STATE.PLAYING && prev === STATE.PAUSED) resumeMusic();
  if (next === STATE.TITLE)  stopMusic();
};

/* ── damagePlayer → hurt SFX ── */
const _origDamagePlayerAudio = damagePlayer;
damagePlayer = function(amount, sourceX) {
  const prevHp = G.player ? G.player.hp : 0;
  _origDamagePlayerAudio(amount, sourceX);
  const p = G.player;
  if (p && p.hp < prevHp && p.hp > 0) SFX.playerHurt();
  /* Hand touch is detected separately in TheHand.update via contact */
};

/* ── enemyTakeDamage → enemy hit SFX ── */
const _origEnemyTakeDamageAudio = enemyTakeDamage;
enemyTakeDamage = function(enemy, amount, sourceX) {
  _origEnemyTakeDamageAudio(enemy, amount, sourceX);
  if (ready) SFX.enemyHit(enemy.type);
};

/* ── playerUpdate → attack SFX + jump SFX + weapon swap SFX ──
   Patch new playerUpdate (already reassigned) to intercept inputs. */

  /* Jump started this frame: was on ground, now airborne with upward velocity */
  if (prevGround && !pp.onGround && pp.vy < 0) {

  if (pp.weaponIdx !== prevIdx) SFX.weaponSwap();

/* ----------------------------------------------------------------
   S11-A. BITMAP PIXEL FONT  (5×7 glyphs, 1px gap)
   Each character: array of 7 rows, each row = 5-bit integer (MSB=left).
   drawPxText(ctx, str, x, y, scale, color) — the one text function
   used by ALL UI elements going forward.
---------------------------------------------------------------- */
const FONT5X7 = (function() {
  /* Bit-packed 5×7 glyphs. Row 0 = top. Bit 4 = leftmost pixel. */
  const G = {
    ' ': [0,0,0,0,0,0,0],
    'A': [0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
    'B': [0b11110,0b10001,0b10001,0b11110,0b10001,0b10001,0b11110],
    'C': [0b01110,0b10001,0b10000,0b10000,0b10000,0b10001,0b01110],
    'D': [0b11100,0b10010,0b10001,0b10001,0b10001,0b10010,0b11100],
    'E': [0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b11111],
    'F': [0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b10000],
    'G': [0b01110,0b10001,0b10000,0b10111,0b10001,0b10001,0b01111],
    'H': [0b10001,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
    'I': [0b01110,0b00100,0b00100,0b00100,0b00100,0b00100,0b01110],
    'J': [0b00111,0b00010,0b00010,0b00010,0b10010,0b10010,0b01100],
    'K': [0b10001,0b10010,0b10100,0b11000,0b10100,0b10010,0b10001],
    'L': [0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111],
    'M': [0b10001,0b11011,0b10101,0b10001,0b10001,0b10001,0b10001],
    'N': [0b10001,0b11001,0b10101,0b10011,0b10001,0b10001,0b10001],
    'O': [0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    'P': [0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000],
    'Q': [0b01110,0b10001,0b10001,0b10001,0b10101,0b10010,0b01101],
    'R': [0b11110,0b10001,0b10001,0b11110,0b10100,0b10010,0b10001],
    'S': [0b01111,0b10000,0b10000,0b01110,0b00001,0b00001,0b11110],
    'T': [0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100],
    'U': [0b10001,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    'V': [0b10001,0b10001,0b10001,0b10001,0b10001,0b01010,0b00100],
    'W': [0b10001,0b10001,0b10001,0b10101,0b10101,0b11011,0b10001],
    'X': [0b10001,0b10001,0b01010,0b00100,0b01010,0b10001,0b10001],
    'Y': [0b10001,0b10001,0b01010,0b00100,0b00100,0b00100,0b00100],
    'Z': [0b11111,0b00001,0b00010,0b00100,0b01000,0b10000,0b11111],
    '0': [0b01110,0b10001,0b10011,0b10101,0b11001,0b10001,0b01110],
    '1': [0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110],
    '2': [0b01110,0b10001,0b00001,0b00110,0b01000,0b10000,0b11111],
    '3': [0b11111,0b00001,0b00010,0b00110,0b00001,0b10001,0b01110],
    '4': [0b00010,0b00110,0b01010,0b10010,0b11111,0b00010,0b00010],
    '5': [0b11111,0b10000,0b11110,0b00001,0b00001,0b10001,0b01110],
    '6': [0b00110,0b01000,0b10000,0b11110,0b10001,0b10001,0b01110],
    '7': [0b11111,0b00001,0b00010,0b00100,0b00100,0b00100,0b00100],
    '8': [0b01110,0b10001,0b10001,0b01110,0b10001,0b10001,0b01110],
    '9': [0b01110,0b10001,0b10001,0b01111,0b00001,0b00010,0b01100],
    '.': [0,0,0,0,0,0b00100,0b00100],
    ',': [0,0,0,0,0,0b00100,0b01000],
    '!': [0b00100,0b00100,0b00100,0b00100,0b00100,0,0b00100],
    '?': [0b01110,0b10001,0b00001,0b00110,0b00100,0,0b00100],
    '-': [0,0,0,0b11111,0,0,0],
    '/': [0b00001,0b00010,0b00100,0b00100,0b01000,0b10000,0b10000],
    ':': [0,0b00100,0b00100,0,0b00100,0b00100,0],
    "'": [0b00100,0b00100,0b01000,0,0,0,0],
    '"': [0b01010,0b01010,0b10100,0,0,0,0],
    '(': [0b00010,0b00100,0b01000,0b01000,0b01000,0b00100,0b00010],
    ')': [0b01000,0b00100,0b00010,0b00010,0b00010,0b00100,0b01000],
    '[': [0b01110,0b01000,0b01000,0b01000,0b01000,0b01000,0b01110],
    ']': [0b01110,0b00010,0b00010,0b00010,0b00010,0b00010,0b01110],
    '>': [0b10000,0b01000,0b00100,0b00010,0b00100,0b01000,0b10000],
    '<': [0b00001,0b00010,0b00100,0b01000,0b00100,0b00010,0b00001],
    '=': [0,0,0b11111,0,0b11111,0,0],
  };
  return G;
})();

/* Glyph width: 5px + 1px gap = 6px per char at scale 1 */
const FONT_GW = 6;
const FONT_GH = 8;   /* 7px glyph + 1px line gap */

function drawPxChar(ctx, ch, x, y, scale) {
  const g = FONT5X7[ch.toUpperCase()] || FONT5X7['?'];
  const s = scale || 1;
  for (let row = 0; row < 7; row++) {
    const bits = g[row] || 0;
    for (let col = 0; col < 5; col++) {
      if (bits & (1 << (4 - col))) {
        ctx.fillRect(x + col * s, y + row * s, s, s);
      }
    }
  }
}

/**
 * drawPxText — primary text renderer for all UI
 * align: 'left'|'center'|'right'  (default 'left')
 * shadow: true → 1px dark offset shadow first
 */
function drawPxText(ctx, str, x, y, scale, color, align, shadow) {
  const s    = scale  || 1;
  const aln  = align  || 'left';
  const text = String(str);
  const tw   = text.length * FONT_GW * s;

  let drawX = x;
  if (aln === 'center') drawX = x - (tw >> 1);
  if (aln === 'right')  drawX = x - tw;

  if (shadow) {
    ctx.fillStyle = PAL.BLACK;
    for (let i = 0; i < text.length; i++) {
      drawPxChar(ctx, text[i], drawX + i * FONT_GW * s + s, y + s, s);
    }
  }

  ctx.fillStyle = color || PAL.WHITE;
  for (let i = 0; i < text.length; i++) {
    drawPxChar(ctx, text[i], drawX + i * FONT_GW * s, y, s);
  }
}

/* Measure text width in pixels */
function pxTextWidth(str, scale) {
  return str.length * FONT_GW * (scale || 1);
}


/* ----------------------------------------------------------------
   S11-B. NES PANEL HELPER
   Draws an NES-style hard-bordered panel: solid fill, 2px border,
   1px inner highlight, corner ornaments.
   Used by pause, lore, weapon box, dead screen.
---------------------------------------------------------------- */
function drawNESPanel(ctx, x, y, w, h, opts) {
  const bg      = opts.bg      || PAL.HUD_BG;
  const border  = opts.border  || PAL.STONE_HIGH;
  const hi      = opts.hi      || PAL.WHITE;
  const corners = opts.corners !== false;

  /* Fill */
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);

  /* Outer border — 2px thick */
  ctx.fillStyle = border;
  ctx.fillRect(x,         y,         w,  2);   /* top    */
  ctx.fillRect(x,         y+h-2,     w,  2);   /* bottom */
  ctx.fillRect(x,         y,         2,  h);   /* left   */
  ctx.fillRect(x+w-2,     y,         2,  h);   /* right  */

  /* Inner highlight — 1px inset from border */
  ctx.fillStyle = hi;
  ctx.fillRect(x+2,       y+2,       w-4,  1); /* top hi    */
  ctx.fillRect(x+2,       y+2,       1,  h-4); /* left hi   */

  /* Corner ornaments — classic NES dialog box crosses */
  if (corners) {
    const C = PAL.PALE_GOLD;
    [[x, y], [x+w-4, y], [x, y+h-4], [x+w-4, y+h-4]].forEach(([cx, cy]) => {
      ctx.fillStyle = C;
      ctx.fillRect(cx+1, cy,   2, 4);
      ctx.fillRect(cx,   cy+1, 4, 2);
    });
  }
}


/* ----------------------------------------------------------------
   S11-D. ENHANCED HUD
   Reference: Castlevania NES HUD — brick-patterned strip,
   larger hearts, weapon initial icon, zone name in scroll banner.
---------------------------------------------------------------- */
HUD.draw = function(ctx) {
  const p = G.player;
  if (!p) return;

  const HY  = NES.H - HUD_H;   /* top y of HUD strip */

  /* ── HUD brick background ── */
  ctx.fillStyle = '#0d0a0e';
  ctx.fillRect(0, HY, NES.W, HUD_H);

  /* Brick pattern — 8×4 tiles, alternating seam */
  ctx.fillStyle = '#1a1420';
  for (let bx = 0; bx < NES.W; bx += 8) {
    const seam = (Math.floor(bx / 8) % 2) * 4;
    ctx.fillRect(bx, HY + seam, 1, HUD_H - seam);
  }

  /* Top border — double line NES style */
  ctx.fillStyle = PAL.BLOOD_RED;
  ctx.fillRect(0, HY,     NES.W, 1);
  ctx.fillStyle = '#3a0000';
  ctx.fillRect(0, HY + 1, NES.W, 1);

  /* ── Hearts: 6, pixel-accurate NES style ── */
  const heartX0 = 3;
  const heartY  = HY + 4;
  for (let i = 0; i < p.maxHp; i++) {
    const hx   = heartX0 + i * 10;
    const full = i < p.hp;
    /* Outer heart shape */
    ctx.fillStyle = full ? PAL.HUD_HEART : PAL.HUD_EMPTY;
    ctx.fillRect(hx+1, heartY,   4, 2);   /* top bumps */
    ctx.fillRect(hx,   heartY+1, 6, 1);
    ctx.fillRect(hx,   heartY+2, 6, 4);   /* body */
    ctx.fillRect(hx+1, heartY+6, 4, 1);
    ctx.fillRect(hx+2, heartY+7, 2, 1);   /* bottom point */
    /* Highlight pixel on full hearts */
    if (full) {
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(hx+1, heartY+1, 2, 2);
    }
    /* HP count — lost hearts get a dark cross */
    if (!full) {
      ctx.fillStyle = '#220000';
      ctx.fillRect(hx+2, heartY+2, 2, 4);
      ctx.fillRect(hx+1, heartY+3, 4, 2);
    }
  }

  /* ── Weapon box ── */
  const wName = (p.weapons[p.weaponIdx] || 'sword').toUpperCase().replace(/_/g,' ');
  const wX    = heartX0 + p.maxHp * 10 + 5;
  drawNESPanel(ctx, wX, HY+1, 95, HUD_H-2, {
    bg: '#0a0810', border: PAL.STONE_MID, hi: '#2a2838', corners: false
  });
  /* Weapon icon — draw actual mini weapon art */
  const iconCX = wX + 8, iconCY = HY + 8;
  ctx.save();
  ctx.translate(iconCX, iconCY);
  const wKey = (p.weapons[p.weaponIdx] || 'sword');
  switch(wKey) {
    case 'sword':
      ctx.fillStyle = PAL.SWORD_GREY;
      ctx.fillRect(-1,-4,2,7); ctx.fillStyle=PAL.GOLD; ctx.fillRect(-2,-1,4,1);
      ctx.fillStyle='#6c4010'; ctx.fillRect(-1,0,2,2); break;
    case 'bone_whip':
      ctx.fillStyle=PAL.STONE_HIGH; ctx.fillRect(-4,-1,3,2);
      ctx.fillStyle=PAL.LIGHTGRAY;
      for(let s=0;s<3;s++) ctx.fillRect(-1+s*2,-2+s,2,2); break;
    case 'cursed_dagger':
      ctx.fillStyle=PAL.CLOAK_LITE; ctx.fillRect(-4,-1,7,1);
      ctx.fillStyle='#6644aa';     ctx.fillRect(-4, 0,6,1);
      ctx.fillStyle=PAL.STONE_HIGH;ctx.fillRect( 2,-2,2,3); break;
    case 'holy_axe':
      ctx.fillStyle=PAL.PALE_GOLD; ctx.fillRect(-1,-4,2,7);
      ctx.fillStyle=PAL.GOLD;      ctx.fillRect(-4,-4,3,5);
      ctx.fillStyle=PAL.WHITE;     ctx.fillRect(-4,-4,2,1); break;
    case 'void_scythe':
      ctx.fillStyle='#4a3060'; ctx.fillRect(-1,-4,2,7);
      ctx.fillStyle='#aa66ff'; ctx.fillRect(-4,-4,4,2); ctx.fillRect(-4,-4,2,4);
      ctx.fillStyle=PAL.WHITE; ctx.fillRect(-4,-4,1,1); break;
    default:
      ctx.fillStyle=PAL.PALE_GOLD; ctx.fillRect(-2,-2,4,4);
  }
  ctx.restore();
  /* Weapon name — offset past icon */
  drawPxText(ctx, wName, wX+18, HY+4, 1, PAL.WHITE);
  /* Slot counter on second line */
  drawPxText(ctx, (p.weaponIdx+1)+'/'+p.weapons.length, wX+18, HY+10, 1, '#666688');

  /* ── Zone name banner — fades in/out ── */
  if (this.zoneLabelTimer > 0) {
    const fade = Math.min(1, this.zoneLabelTimer / 30, (240-this.zoneLabelTimer+1) / 30);
    ctx.globalAlpha = fade;
    /* Banner background */
    const bw  = pxTextWidth(this.zoneLabel, 1) + 14;
    const bx  = (NES.W - bw) >> 1;
    const by  = HY - 14;
    drawNESPanel(ctx, bx, by, bw, 12, {
      bg: '#0a0614', border: PAL.BLOOD_RED, hi: '#3a0020', corners: false
    });
    drawPxText(ctx, this.zoneLabel, NES.W/2, by+3, 1, PAL.PALE_GOLD, 'center');
    ctx.globalAlpha = 1;
  }

  /* ── Objective flash — shown once at game start ── */
  if (G.objectiveFlash > 0) {
    const f     = G.objectiveFlash;
    const alpha = Math.min(1, f / 60, (300 - f + 1) / 30);
    /* Blink in middle section (fr 60–240): on/off every 20fr */
    const blink = (f > 60 && f < 240) ? Math.floor(f / 20) % 2 === 0 : true;
    if (blink) {
      ctx.globalAlpha = alpha;
      const msg  = 'REACH THE THRONE ROOM';
      const tw   = pxTextWidth(msg, 1);
      const OY   = NES.H / 2 - 20;
      const PX2  = (NES.W - tw - 20) >> 1;
      drawNESPanel(ctx, PX2, OY - 4, tw + 20, 18, {
        bg: 'rgba(5,3,12,0.92)', border: PAL.BLOOD_RED, hi: '#2a0010', corners: true,
      });
      /* Decorative side marks */
      ctx.fillStyle = PAL.FIRE_RED;
      ctx.fillRect(PX2 + 4, OY + 3, 4, 1);
      ctx.fillRect(PX2 + tw + 12, OY + 3, 4, 1);
      drawPxText(ctx, msg, NES.W / 2, OY + 1, 1, PAL.BLOOD_RED,  'center');
      drawPxText(ctx, msg, NES.W / 2, OY,     1, PAL.PALE_GOLD,   'center');
      ctx.globalAlpha = 1;
    }
  }

  /* ── Hand warning — flashing skull icon top-right ── */
  if (G.theHand && G.theHand.active && !G.theHand.stunTimer) {
    if (Math.floor(G.frame/15) % 2 === 0) {
      /* Skull icon: 7×7 pixel skull */
      const sx = NES.W - 12, sy = 2;
      ctx.fillStyle = PAL.BLOOD_RED;
      ctx.fillRect(sx,   sy+1, 7, 4);   /* skull top */
      ctx.fillRect(sx+1, sy,   5, 6);   /* skull body */
      ctx.fillStyle = PAL.BLACK;
      ctx.fillRect(sx+1, sy+1, 2, 2);   /* left eye */
      ctx.fillRect(sx+4, sy+1, 2, 2);   /* right eye */
      ctx.fillRect(sx+2, sy+4, 3, 1);   /* nose gap */
      ctx.fillStyle = PAL.BLOOD_RED;
      ctx.fillRect(sx+1, sy+5, 2, 2);   /* teeth L */
      ctx.fillRect(sx+4, sy+5, 2, 2);   /* teeth R */
    }
  }
};

/* ----------------------------------------------------------------
   S11-E. ENHANCED LORE PANEL
   NES dialog box: hard border, corner ornaments, pixel font.
   Reference: Castlevania text boxes — dark bg, gold text, 2px frame.
---------------------------------------------------------------- */
lorePanel.draw = function(ctx) {
  if (this.timer <= 0 || this.lines.length === 0) return;

  const fade = Math.min(1, this.timer/40, (this.MAX_TIME-this.timer+1)/40);
  ctx.globalAlpha = fade;

  const LINE_H = 9;
  const PH     = this.lines.length * LINE_H + 16;
  const PY     = NES.H - HUD_H - PH - 4;
  const PX     = 4;
  const PW     = NES.W - 8;

  drawNESPanel(ctx, PX, PY, PW, PH, {
    bg: '#050308', border: PAL.PALE_GOLD, hi: '#3a2800', corners: true
  });

  /* Inner border — classic NES double-border dialog treatment */
  ctx.fillStyle = '#2a1800';
  ctx.fillRect(PX+4,    PY+4,    PW-8, 1);   /* inner top */
  ctx.fillRect(PX+4,    PY+PH-5, PW-8, 1);   /* inner bottom */
  ctx.fillRect(PX+4,    PY+4,    1, PH-8);   /* inner left */
  ctx.fillRect(PX+PW-5, PY+4,    1, PH-8);   /* inner right */

  /* Scroll ornament on top border centre */
  ctx.fillStyle = PAL.GOLD;
  ctx.fillRect(NES.W/2 - 4, PY - 1, 8, 3);
  ctx.fillRect(NES.W/2 - 2, PY - 2, 4, 1);

  this.lines.forEach((line, i) => {
    if (!line) return;   /* allow empty lines for spacing */
    drawPxText(ctx, line, NES.W/2, PY + 8 + i * LINE_H, 1, PAL.PALE_GOLD, 'center', true);
  });

  ctx.globalAlpha = 1;
};

/* ----------------------------------------------------------------
   S11-G. ENHANCED DEAD SCREEN
   Blood-red overlay fade-in, large 'YOU DIED', retry prompt.
   Castlevania style: minimal, punishing, immediate.
---------------------------------------------------------------- */
deadScreen.draw = function(ctx) {
  /* Full black */
  ctx.fillStyle = PAL.BLACK;
  ctx.fillRect(0, 0, NES.W, NES.H);

  /* Blood seep from top — grows over first 90 frames */
  const seepH = Math.min(NES.H, Math.floor(this.timer * 0.7));
  ctx.fillStyle = PAL.BLOOD_RED;
  ctx.fillRect(0, 0, NES.W, Math.min(seepH, 30));
  ctx.fillStyle = '#3a0000';
  ctx.fillRect(0, Math.min(seepH, 28), NES.W, 2);

  if (this.timer > 60) {
    /* 'YOU DIED' — 2× scale, red shadow then white */
    drawPxText(ctx, 'YOU DIED', NES.W/2, 90, 2, PAL.BLOOD_RED, 'center');
    drawPxText(ctx, 'YOU DIED', NES.W/2 - 1, 89, 2, PAL.WHITE, 'center');
  }

  if (this.timer > 180) {
    /* Blinking retry prompt */
    if (Math.floor(this.timer/20)%2===0) {
      drawPxText(ctx, 'PRESS START TO TRY AGAIN', NES.W/2, 132, 1, PAL.LIGHTGRAY, 'center', true);
    }
  }

  /* Death counter / flavor — frame number as in-universe "time lost" */
  if (this.timer > 120) {
    drawPxText(ctx, 'THE CURSE HOLDS', NES.W/2, NES.H - 20, 1, PAL.MIDGRAY, 'center');
  }
};


/* ----------------------------------------------------------------
   S11-H. ENHANCED WIN SCREEN
   Castlevania ending: slow white fade, single italic story line.
   'You remembered.' — the game's only complete sentence.
---------------------------------------------------------------- */
winScreen.draw = function(ctx) {
  /* Fade from black to white over first 180 frames */
  const fadeAmt = Math.min(255, Math.floor(this.timer * 1.4));
  const fadeByte = fadeAmt.toString(16).padStart(2, '0');
  ctx.fillStyle = '#' + fadeByte + fadeByte + fadeByte;
  ctx.fillRect(0, 0, NES.W, NES.H);

  if (this.showText) {
    /* The quote — dark on light, centred */
    const textAlpha = Math.min(1, (this.timer - 180) / 60);
    ctx.globalAlpha = textAlpha;
    drawPxText(ctx, 'YOU REMEMBERED.', NES.W/2, NES.H/2 - 6, 1, PAL.STONE_DARK, 'center', false);
    ctx.globalAlpha = 1;

    if (this.timer > 360 && Math.floor(this.timer/30)%2===0) {
      drawPxText(ctx, 'PRESS START', NES.W/2, NES.H/2 + 18, 1, PAL.STONE_MID, 'center');
    }
  }
};

/* ================================================================
   SECTION 12 — SAVE / CHECKPOINT SYSTEM
   GDD: localStorage checkpoint at zone entry.
   Saves: current zone + collected weapons.
   Loads on first PLAYING entry — player resumes from last zone.
   Cleared on TITLE (new game).
================================================================ */

const SaveSystem = {
  KEY: 'cursebound_s1',

  save(zoneId) {
    if (!zoneId || zoneId === ZONE_ID.BOSS) return;
    try {
      localStorage.setItem(this.KEY, JSON.stringify({
        zone:    zoneId,
        weapons: Array.from(G.collectedWeapons),
        v: 1,
      }));
    } catch(e) {}
  },

  load() {
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY));
      return (d && d.v === 1) ? d : null;
    } catch(e) { return null; }
  },

  clear() {
    try { localStorage.removeItem(this.KEY); } catch(e) {}
  },
};

/* Save on every zone entry */
const _origEnterZoneSave = enterZone;
enterZone = function(zoneId) {
  _origEnterZoneSave(zoneId);
  SaveSystem.save(zoneId);
};

/* Clear save on TITLE (new game).
   onStateEnter is a plain function — patch it directly. */
const _origOnStateEnter = onStateEnter;
onStateEnter = function(s) {
  _origOnStateEnter(s);
  if (s === STATE.TITLE) {
    SaveSystem.clear();
  }
  /* Resume from checkpoint: only on first PLAYING entry with no zone loaded */
  if (s === STATE.PLAYING && !G.currentZoneId) {
    const saved = SaveSystem.load();
    if (saved && ZONES[saved.zone]) {
      saved.weapons.forEach(w => G.collectedWeapons.add(w));
      enterZone(saved.zone);
      if (DEBUG) console.log('[save] resumed:', saved.zone);
    }
  }
};

window.CB.SaveSystem   = SaveSystem;
window.CB.enterZone    = enterZone;
window.CB.onStateEnter = onStateEnter;
