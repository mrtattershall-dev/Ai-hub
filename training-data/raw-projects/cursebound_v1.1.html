  animFrames: [],
  animIdx:    0,
  animTimer:  0,
  animSpeed:  8,   /* frames per sprite frame */
  animLoop:   false,
  animDone:   false,

  /* AI state machine */
  state:      'entrance',  /* entrance|idle|cast_tell|bolt|swipe_tell|swipe|hit|phase_flash|walk|tear_out|collapse|dead */
  stateTimer: 0,
  hurtTimer:  0,
  dead:       false,
  _lastHitSwing: -1,

  /* curse bolt projectiles fired by boss */
  bolts: [],

  /* phase flash overlay */
  flashTimer: 0,
  flashFrame: 0,

  init() {
    const zone = ZONES[ZONE_ID.BOSS];
    const mapW = zone.mapData.cols * NES.TILE;
    /* Place boss at right side of arena */
    this.x = 300;  /* ~300px from player spawn at x=64 — visible on screen */
    this.y = 12 * NES.TILE - this.h;  /* floor row 12 */
    this.hp = 6; this.maxHp = 6;
    this.phase = 0;
    this.dead  = false;
    this.bolts = [];
    this.flashTimer = 0;
    this.facing = -1;
    this._swipeHit = false;
    this._setAnim('hollow_king_entrance', 5, false, 10);
    this.state = 'entrance';
    this.stateTimer = 0;
    if (DEBUG) console.log('[boss] HollowKing init');
  },

  _setAnim(prefix, count, loop, speed) {
    this.anim       = prefix;
    this.animFrames = bossAnim(prefix, count);
    this.animIdx    = 0;
    this.animTimer  = 0;
    this.animSpeed  = speed || 8;
    this.animLoop   = loop !== false;
    this.animDone   = false;
  },

  _tickAnim() {
    if (++this.animTimer >= this.animSpeed) {
      this.animTimer = 0;
      this.animIdx++;
      if (this.animIdx >= this.animFrames.length) {
        if (this.animLoop) {
          this.animIdx = 0;
        } else {
          this.animIdx  = this.animFrames.length - 1;
          this.animDone = true;
        }
      }
    }
  },

  takeDamage(amount, sourceX) {
    if (this.state === 'entrance' || this.state === 'phase_flash' ||
        this.state === 'collapse' || this.state === 'dead') return;
    if (this.hurtTimer > 0) return;  /* i-frames — blocks ALL damage until window expires */
    this.hp = Math.max(0, this.hp - amount);
    this.hurtTimer = 55;  /* was 40 — now longer than sword recovery (18fr) so spam can't chain */

    /* Phase transitions */
    if (this.hp <= 0) {
      this._startCollapse();
      return;
    }
    if (this.hp <= 2 && this.phase < 2) {
      this._startPhaseFlash(2);
      return;
    }
    if (this.hp <= 4 && this.phase < 1) {
      this._startPhaseFlash(1);
      return;
    }

    this._setAnim('hollow_king_hit_react', 3, false, 7);
    this.state = 'hit';
    this.stateTimer = 0;
  },

  _startPhaseFlash(nextPhase) {
    this.phase = nextPhase;
    this.flashTimer = 60;
    this.flashFrame = 0;
    this._setAnim('phase_flash_overlay', 3, true, 8);
    this.state = 'phase_flash';
    this.stateTimer = 0;
    /* Notify audio */
    if (G.audio && G.audio.bossPhaseTransition) G.audio.bossPhaseTransition(nextPhase);
  },

  _startCollapse() {
    this.state = 'collapse';
    this.stateTimer = 0;
    this._setAnim('hollow_king_collapse', 3, false, 14);
    /* Then curse entity death */
  },

  _fireBolt(angleOffset) {
    const p = G.player;
    if (!p) return;
    const cx = this.x + this.w * 0.5;
    const cy = this.y + this.h * 0.3;
    const dx = (p.x + p.w * 0.5) - cx;
    const dy = (p.y + p.h * 0.5) - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const spd = this.phase >= 2 ? 3.2 : 2.8;  /* was 2.2 — now fast enough to threaten */
    /* Apply angle offset for spread shots */
    const baseAngle = Math.atan2(dy, dx);
    const angle = baseAngle + (angleOffset || 0);
    this.bolts.push({
      x: cx - 8, y: cy - 8,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      frame: 0, frameTimer: 0,
      w: 16, h: 16, life: 150,  /* longer life to cross the full arena */
    });
  },

  /* Anti-air stomp: fires a bolt straight down from above the player */
  _fireStomp() {
    const p = G.player;
    if (!p) return;
    /* Bolt spawns at ceiling above the player's current X */
    this.bolts.push({
      x: (p.x + p.w * 0.5) - 8,
      y: NES.TILE * 1,           /* just below ceiling */
      vx: 0, vy: 3.0,            /* straight down, fast */
      frame: 0, frameTimer: 0,
      w: 16, h: 16, life: 100,
      isStomp: true,
    });
  },

  update() {
    if (this.dead) return;
    if (this.hurtTimer > 0) this.hurtTimer--;
    this._tickAnim();

    /* Tick phase flash overlay */
    if (this.flashTimer > 0) {
      this.flashTimer--;
      this.flashFrame = Math.floor((60 - this.flashTimer) / 20);
    }

    /* Update bolts */
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      const b = this.bolts[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (++b.frameTimer >= 6) { b.frameTimer = 0; b.frame = (b.frame + 1) % 4; }
      if (b.life <= 0) { this.bolts.splice(i, 1); continue; }
      /* Hit player */
      const p = G.player;
      if (p && aabbOverlap(b, p)) {
        damagePlayer(1, b.x);
        this.bolts.splice(i, 1);
      }
    }

    /* Face the player */
    const p = G.player;
    if (p && this.state !== 'entrance' && this.state !== 'collapse' && this.state !== 'dead') {
      this.facing = (p.x + p.w * 0.5) < (this.x + this.w * 0.5) ? -1 : 1;
    }

    /* Check player weapon hit */
    if (p && this.state !== 'entrance' && this.state !== 'dead') {
      const hb = getAttackHitbox(p);
      if (hb && aabbOverlap(hb, { x: this.x, y: this.y, w: this.w, h: this.h })) {
        const wdef = getWeaponDef(p);
        if (p.swingId !== this._lastHitSwing) {
          this._lastHitSwing = p.swingId;
          this.takeDamage(wdef.damage, p.x);
        }
      }
      /* Projectile hits */
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        if (pr.owner === 'player' && aabbOverlap(pr, { x: this.x, y: this.y, w: this.w, h: this.h })) {
          if (pr.swingId !== this._lastHitSwing) {
            this._lastHitSwing = pr.swingId;
            this.takeDamage(pr.damage, pr.x);
            projectiles.splice(i, 1);
          }
        }
      }
    }

    this.stateTimer++;
    const st = this.stateTimer;

    switch (this.state) {

      case 'entrance':
        if (st === 1) this._setAnim('hollow_king_throne_shatter', 3, false, 12);
        if (st >= 36 && this.animDone) {
          this._setAnim('hollow_king_entrance', 5, false, 10);
          this.state = 'entrance2';
          this.stateTimer = 0;
        }
        break;

      case 'entrance2':
        if (this.animDone) {
          this._setAnim('hollow_king_phase1_idle', 4, true, 9);
          this.state = 'idle';
          this.stateTimer = 0;
        }
        break;

      case 'idle':
        /* Phase 0: single bolt every 75fr (was 120 — halved safe window)      */
        /* Phase 1: spread cast every 60fr + stomp if player is airborne        */
        /* Phase 2: almost no rest — walk immediately after 20fr                */
        if (this.phase === 0) {
          if (st >= 75) this._startCast();
        } else if (this.phase === 1) {
          if (p && p.vy < 0 && st % 50 === 25) this._fireStomp();
          if (st >= 60) this._startCast();
        } else {
          if (st >= 20) this._startWalk();
        }
        break;

      case 'cast_tell':
        if (this.animDone) {
          const spread = Math.PI / 7;
          if (this.phase === 0) {
            this._fireBolt(0);
          } else if (this.phase === 1) {
            this._fireBolt(0);
            this._fireBolt(-spread);
            this._fireBolt(spread);
          } else {
            this._fireBolt(0);
            this._fireBolt(-spread);
            this._fireBolt(spread);
            this._fireBolt(-spread * 2);
            this._fireBolt(spread * 2);
            this._fireStomp();
          }
          this._setAnim('hollow_king_phase1_idle', 4, true, 9);
          this.state = 'idle';
          this.stateTimer = 0;
        }
        break;

      case 'walk':
        /* Phase 2: 1.8px/fr — faster than player walk (1.5) so backing off fails */
        if (p) {
          const dx = (p.x + p.w*0.5) - (this.x + this.w*0.5);
          if (Math.abs(dx) > 48) {
            this.x += Math.sign(dx) * 1.8;
          } else {
            this._startSwipe();
          }
        }
        if (p && p.vy < 0 && st % 40 === 20) this._fireStomp();
        if (st >= 70) this._startSwipe();
        break;

      case 'swipe_tell':
        if (this.animDone) {
          this._setAnim('hollow_king_phase2_swipe', 3, false, 7);
          this.state = 'swipe';
          this.stateTimer = 0;
        }
        break;

      case 'swipe':
        /* Active hitbox for full swipe duration — not just a single frame */
        if (p && st >= 3 && st <= 14) {
          const swipeRange = this.phase >= 2 ? 80 : 65;
          const bossCenter = this.x + this.w * 0.5;
          const playerCenter = p.x + p.w * 0.5;
          const inFront = this.facing === -1
            ? playerCenter < bossCenter + 20
            : playerCenter > bossCenter - 20;
          if (inFront &&
              Math.abs(playerCenter - bossCenter) < swipeRange &&
              Math.abs((p.y + p.h*0.5) - (this.y + this.h*0.5)) < 56) {
            if (!this._swipeHit) {
              this._swipeHit = true;
              damagePlayer(2, bossCenter);
            }
          }
        }
        if (this.animDone) {
          this._swipeHit = false;
          if (this.phase >= 2) this._fireBolt(0);
          this._setAnim('hollow_king_phase2_walk', 4, true, 8);
          this.state = 'idle';
          this.stateTimer = 0;
        }
        break;

      case 'hit':
        if (this.animDone) {
          const idleAnim = this.phase >= 2
            ? ['hollow_king_phase2_walk', 4]
            : ['hollow_king_phase1_idle', 4];
          this._setAnim(idleAnim[0], idleAnim[1], true, 9);
          this.state = 'idle';
          this.stateTimer = 0;
        }
        break;

      case 'phase_flash':
        /* Burst of bolts the moment invulnerability ends — punishes players who rushed in */
        if (st === 60) {
          const spread = Math.PI / 7;
          this._fireBolt(0);
          this._fireBolt(-spread);
          this._fireBolt(spread);
          if (this.phase >= 2) {
            this._fireBolt(-spread * 2);
            this._fireBolt(spread * 2);
            this._fireStomp();
          }
        }
        if (st >= 70) {
          const idleAnim = this.phase >= 2
            ? ['hollow_king_phase2_walk', 4]
            : ['hollow_king_phase1_idle', 4];
          this._setAnim(idleAnim[0], idleAnim[1], true, 9);
          this.state = 'idle';
          this.stateTimer = 0;
        }
        break;

      case 'collapse':
        if (this.animDone && st >= 42) {
          this._setAnim('curse_entity_death', 5, false, 10);
          this.state = 'curse_death';
          this.stateTimer = 0;
        }
        break;

      case 'curse_death':
        if (this.animDone) {
          this.dead = true;
          setTimeout(() => setState(STATE.WIN), 2000);
        }
        break;
    }

    /* Clamp to arena bounds */
    const mapW = ZONES[ZONE_ID.BOSS].mapData.cols * NES.TILE;
    this.x = Math.max(8, Math.min(mapW - this.w - 8, this.x));
  },

  _startCast() {
    this._setAnim('hollow_king_cast_tell', 4, false, 8);
    this.state = 'cast_tell';
    this.stateTimer = 0;
  },

  _startWalk() {
    this._setAnim('hollow_king_phase2_walk', 4, true, 8);
    this.state = 'walk';
    this.stateTimer = 0;
    this._swipeHit = false;
  },

  _startSwipe() {
    this._setAnim('hollow_king_swipe_tell', 3, false, 8);
    this.state = 'swipe_tell';
    this.stateTimer = 0;
    this._swipeHit = false;
  },

  draw(ctx) {
    if (!BOSS_SPRITES['hollow_king_phase1_idle_0'].complete) return;

    const sx = Math.round(this.x - Camera.x);
    const sy = Math.round(this.y - Camera.y);

    /* Draw boss sprite — centred horizontally on hitbox */
    const spriteOffX = (this.w - this.SPRITE_W) / 2;
    const spriteOffY = this.h - this.SPRITE_H;
    const drawX = sx + spriteOffX;
    const drawY = sy + spriteOffY;

    const frame = this.animFrames[this.animIdx];
    if (frame && frame.complete) {
      const hurt = this.hurtTimer > 0 && (this.hurtTimer % 6) < 3;
      if (hurt) ctx.globalAlpha = 0.5;
      ctx.save();
      if (this.facing === 1) {
        ctx.translate(drawX + this.SPRITE_W, drawY);
        ctx.scale(-1, 1);
        ctx.drawImage(frame, 0, 0, this.SPRITE_W, this.SPRITE_H);
      } else {
        ctx.drawImage(frame, drawX, drawY, this.SPRITE_W, this.SPRITE_H);
      }
      ctx.restore();
      if (hurt) ctx.globalAlpha = 1;
    }

    /* Draw curse bolts */
    for (const b of this.bolts) {
      const bsx = (b.x - Camera.x) | 0;
      const bsy = (b.y - Camera.y) | 0;
      const bframe = BOSS_SPRITES['curse_bolt_' + b.frame];
      if (bframe && bframe.complete) {
        ctx.drawImage(bframe, bsx, bsy, 16, 16);
      }
    }

    /* Phase flash overlay — full screen */
    if (this.flashTimer > 0) {
      const fi = Math.min(2, this.flashFrame);
      const ff = BOSS_SPRITES['phase_flash_overlay_' + fi];
      if (ff && ff.complete) {
        const alpha = Math.min(1, this.flashTimer / 20);
        ctx.globalAlpha = alpha;
        ctx.drawImage(ff, -Camera.x, -Camera.y, NES.W, NES.H);  /* full screen flash */
        ctx.globalAlpha = 1;
      }
    }

    /* HP bar */
    this._drawHPBar(ctx);
  },

  _drawHPBar(ctx) {
    const BAR_W = 120, BAR_H = 5;
    const bx = (NES.W - BAR_W) / 2;
    const by = 8;
    ctx.fillStyle = '#1a0020';
    ctx.fillRect(bx - 1, by - 1, BAR_W + 2, BAR_H + 2);
    const filled = Math.ceil((this.hp / this.maxHp) * BAR_W);
    const col = this.phase >= 2 ? '#ff4400' : this.phase === 1 ? '#cc00ff' : '#6600cc';
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, filled, BAR_H);
    ctx.fillStyle = '#aa44ff';
    ctx.fillRect(bx, by, BAR_W, 1);
    /* Label */
    ctx.fillStyle = '#cc88ff';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('THE HOLLOW KING', NES.W / 2, by - 2);
    ctx.textAlign = 'left';
  },
};

G.boss = HollowKing;

/* Hook boss into zone enter */
const _origTransitionZoneBoss = transitionZone;
transitionZone = function(destId) {
  _origTransitionZoneBoss(destId);
  if (destId === ZONE_ID.BOSS) {
    HollowKing.init();
  }
};

/* Hook boss update + draw into zoneView */
const _origZoneViewUpdateBoss = zoneView.update.bind(zoneView);
zoneView.update = function() {
  _origZoneViewUpdateBoss();
  if (G.currentZoneId === ZONE_ID.BOSS && G.state === STATE.PLAYING) {
    HollowKing.update();
  }
};

const _origZoneViewDrawBoss = zoneView.draw.bind(zoneView);
zoneView.draw = function(ctx) {
  _origZoneViewDrawBoss(ctx);
  if (G.currentZoneId === ZONE_ID.BOSS) {
    HollowKing.draw(ctx);
  }
};

/* ── Win screen: use ending_door_light frames ── */
const _origWinDraw = winScreen.draw.bind(winScreen);
winScreen.draw = function(ctx) {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, NES.W, NES.H);

  /* Animate ending_door_light */
  const fi = Math.min(3, Math.floor(this.timer / 30));
  const frame = BOSS_SPRITES['ending_door_light_' + fi];
  if (frame && frame.complete) {
    ctx.globalAlpha = Math.min(1, this.timer / 60);
    ctx.drawImage(frame, (NES.W - 128) / 2, (NES.H - 192) / 2, 128, 192);
    ctx.globalAlpha = 1;
  }

  if (this.showText) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, NES.H / 2 - 10, NES.W, 30);
    ctx.fillStyle = '#f8e8a0';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('"YOU REMEMBERED."', NES.W / 2, NES.H / 2 + 4);
    if (this.timer > 360 && Math.floor(this.timer / 30) % 2 === 0) {
      ctx.font = '6px monospace';
      ctx.fillStyle = '#c8a020';
      ctx.fillText('PRESS START', NES.W / 2, NES.H / 2 + 20);
    }
    ctx.textAlign = 'left';
  }
};

/* ── Hand summon cue: play hand_summon_cue animation when Hand first appears ── */
const _handSummonAnim = { active: false, frame: 0, timer: 0, x: 0, y: 0 };
const _origHandSpawn  = TheHand._spawn.bind(TheHand);
TheHand._spawn = function() {
  _origHandSpawn();
  /* Show summon cue at spawn position */
  _handSummonAnim.active = true;
  _handSummonAnim.frame  = 0;
  _handSummonAnim.timer  = 0;
  _handSummonAnim.x      = this.x;
  _handSummonAnim.y      = this.y;
};

const _origZoneViewDrawCue = zoneView.draw.bind(zoneView);
zoneView.draw = function(ctx) {
  _origZoneViewDrawCue(ctx);
  if (_handSummonAnim.active) {
    if (++_handSummonAnim.timer >= 8) {
      _handSummonAnim.timer = 0;
      _handSummonAnim.frame++;
      if (_handSummonAnim.frame >= 4) { _handSummonAnim.active = false; }
    }
    if (_handSummonAnim.active) {
      const f = BOSS_SPRITES['hand_summon_cue_' + _handSummonAnim.frame];
      if (f && f.complete) {
        const sx = (_handSummonAnim.x - Camera.x) | 0;
        const sy = (_handSummonAnim.y - Camera.y) | 0;
        ctx.drawImage(f, sx, sy, 64, 96);
      }
    }
  }
};

window.CB.HollowKing = HollowKing;
if (DEBUG) console.log('[CURSEBOUND] Section 13 loaded: Hollow King boss fight active.');



/* ================================================================
   DEBUG WARP — type "boss" anywhere to warp to boss arena.
   REMOVE BEFORE FINAL SUBMISSION.
================================================================ */
(function installDebugWarp() {
  let _debugBuffer = '';
  const _debugCode  = 'boss';
  document.addEventListener('keydown', function(e) {
    if (e.repeat) return;
    _debugBuffer = (_debugBuffer + e.key.toLowerCase()).slice(-_debugCode.length);
    if (_debugBuffer === _debugCode) {
      _debugBuffer = '';
      /* Fill all lore so boss door is already unlocked */
      G.loreCollected.clear();
      for (let i = 0; i < 6; i++) G.loreCollected.add('debug:' + i);
      /* Go straight to boss */
      if (G.state !== STATE.PLAYING) {
        G.currentZoneId = null;
        G.player        = null;
        setState(STATE.PLAYING);
      }
      /* Short delay so PLAYING state initialises first */
      setTimeout(() => {
        transitionZone(ZONE_ID.BOSS);
        console.log('[DEBUG] Warped to BOSS arena. Type "boss" again to reset.');
      }, 50);
    }
  });
  if (DEBUG) console.log('[DEBUG] Boss warp active — type "boss" to warp.');
})();

</script>
