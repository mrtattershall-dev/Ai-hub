  <meta charset="UTF-8" />

  <title>Western Cobblestone Path</title>
  <style>
    :root {
      --bg-1: #9b6a3d;
      --bg-2: #8d5d35;
      --bg-3: #b47a46;
      --bg-4: #774b2a;
      --stone-a: #d6a25c;
      --stone-b: #c07d3f;
      --stone-c: #aa7140;
      --stone-d: #8d5e3a;
      --mortar: #4b2d18;
      --shadow: #382010;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      display: grid;
      place-items: center;
      background: #24160d;
      image-rendering: pixelated;
      font-family: Arial, sans-serif;
    }

    .tile {
      width: 1024px;
      height: 1024px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.04) 0 1.5%, transparent 1.6%),
        radial-gradient(circle at 74% 68%, rgba(0,0,0,0.06) 0 2%, transparent 2.2%),
        linear-gradient(180deg, var(--bg-3), var(--bg-2));
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(135deg, transparent 0 18%, rgba(0,0,0,0.03) 18% 19%, transparent 19% 100%),
        linear-gradient(45deg, transparent 0 38%, rgba(255,255,255,0.03) 38% 39%, transparent 39% 100%);
      mix-blend-mode: soft-light;
      opacity: 0.75;
      pointer-events: none;
    }

    .stone {
      position: absolute;
      border-radius: 22px;
      background: var(--stone-a);
      box-shadow:
        inset 0 10px 0 rgba(255, 255, 255, 0.08),
        inset 0 -10px 0 rgba(0, 0, 0, 0.10),
        0 0 0 10px var(--shadow);
    }

    .stone::before {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.12) 0 10%, transparent 11%),
        radial-gradient(circle at 70% 70%, rgba(0,0,0,0.08) 0 12%, transparent 13%),
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.03));
      opacity: 0.9;
    }

    .stone.dark { background: var(--stone-d); }
    .stone.mid { background: var(--stone-c); }
    .stone.light { background: var(--stone-a); }
    .stone.warm { background: var(--stone-b); }

    .grain {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(215, 162, 102, 0.92);
      border-radius: 1px;
      box-shadow: 0 0 0 3px rgba(75, 45, 24, 0.65);
    }

    .crack {
      position: absolute;
      background: var(--mortar);
      border-radius: 3px;
      box-shadow: 0 0 0 2px rgba(50, 30, 16, 0.45);
      opacity: 0.95;
    }

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(58, 33, 18, 0.8);
      box-shadow: 0 0 0 2px rgba(75, 45, 24, 0.55);
    }
  </style>
</head>
