<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="PinPortrait turns your webcam into a live 3D pixel portrait built from thousands of pins. Everything stays on your device.">
  <title>PinPortrait — 3D Webcam Pixel Portrait</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0c11'/><g fill='%23f0f3ff'><rect x='20' y='58' width='14' height='22' rx='3'/><rect x='43' y='34' width='14' height='46' rx='3'/><rect x='66' y='48' width='14' height='32' rx='3'/></g></svg>">
  <link rel="stylesheet" href="./src/styles/styles.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Sampling source. Never displayed; the pixels are read into an offscreen canvas. -->
  <video id="source" playsinline muted></video>

  <header class="brand">
    <h1>Pin<span>Portrait</span></h1>
    <p>Your webcam, rebuilt from pins. Nothing leaves this device.</p>
  </header>

  <aside id="panel" aria-label="Portrait controls">
    <div class="panel-head">
      <h2>Controls</h2>
      <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="controls" title="Collapse panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        <span class="sr-only">Toggle controls</span>
      </button>
    </div>
    <div id="controls"></div>
    <p class="panel-foot"><span><kbd>H</kbd> hide</span> <span><kbd>R</kbd> reset</span> <span><kbd>S</kbd> save</span> <span><kbd>F</kbd> full</span></p>
  </aside>

  <div id="stats" aria-live="off"></div>
  <p id="hint" hidden>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="loading" class="overlay">
    <div class="spinner" aria-hidden="true"></div>
    <p class="overlay-message">Waking up the camera…</p>
  </div>

  <div id="error" class="overlay" hidden role="alert">
    <h2 id="error-title"></h2>
    <p id="error-message"></p>
    <button id="error-retry" class="button button-primary" type="button">Try again</button>
  </div>

  <script type="module" src="./src/javascript/sketch.js"></script>
</body>
</html>
