<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        #s9-todo, #s9-doing, #s9-done {
            width: 30%;
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 300px;
        }
        .s9-card {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            list-style-type: none;
        }
        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div id="s9-todo">
        <h2>To Do</h2>
        <ul id="s9-todo-list"></ul>
    </div>
    <div id="s9-doing">
        <h2>Doing</h2>
        <ul id="s9-doing-list"></ul>
    </div>
    <div id="s9-done">
        <h2>Done</h2>
        <ul id="s9-done-list"></ul>
    </div>
    <input type="text" id="s9-new" placeholder="New task">
    <button id="s9-add">Add Task</button>
    <script src="s9_board.js"></script>
</body>
</html>
